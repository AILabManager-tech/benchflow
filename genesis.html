*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif; font-size:14px; line-height:1.5}
h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.012em; text-wrap:balance}
button,select{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
code{font-family:"IBM Plex Mono",monospace; font-size:.88em; background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:1px 5px}
.lbl{font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}

/* ---------- barre ---------- */
.bar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:11px 18px;
  background:var(--surface); border-bottom:1px solid var(--line)}
.bar h1{font-size:16px; margin-right:4px}
.bar .sp{flex:1}
.ctl{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-2)}
select{font-size:12.5px; padding:5px 8px; border-radius:5px; border:1px solid var(--line-2); background:var(--surface-2)}
.sw{position:relative; width:36px; height:20px; border-radius:99px; background:var(--line-2); border:0; flex:none; transition:background .15s}
.sw::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--surface); transition:transform .15s}
.sw[aria-pressed="true"]{background:var(--accent)}
.sw[aria-pressed="true"]::after{transform:translateX(16px)}
.btn{padding:7px 14px; border-radius:6px; border:1px solid var(--line-2); background:var(--surface-2); font-size:13px; font-weight:600}
.btn:hover{border-color:var(--accent); color:var(--accent-ink)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{filter:brightness(1.09); color:#fff}
.btn:disabled{opacity:.45; cursor:default}

/* ---------- canevas ---------- */
.canvas-wrap{overflow:auto; cursor:grab; user-select:none; -webkit-user-select:none; background:
  linear-gradient(var(--grid) 1px, transparent 1px) 0 0/22px 22px,
  linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/22px 22px, var(--ground);
  border-bottom:1px solid var(--line)}
.canvas-wrap.grabbing{cursor:grabbing}
.csize{position:relative}
.canvas{position:relative; transform-origin:0 0}
.canvas svg.edges{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}

.edge{fill:none; stroke:var(--ink-3); stroke-width:2.4; stroke-linejoin:miter; stroke-linecap:butt}
.edge.live{stroke:var(--accent); stroke-width:3.2; stroke-dasharray:7 6; animation:dash 620ms linear infinite}
.edge.done{stroke:var(--accent); opacity:.9}
.edge.dead{stroke:var(--abst); stroke-dasharray:3 5; opacity:.55}
.edge.side{stroke-dasharray:none}
.edge.back{stroke:var(--ok); stroke-width:2.8; stroke-dasharray:9 5}
.edge.back.off{stroke:var(--abst); opacity:.32}
.ah{fill:var(--ink-3)} .ah.done{fill:var(--accent); opacity:.9} .ah.live{fill:var(--accent)}
.ah.dead{fill:var(--abst); opacity:.55} .ah.back{fill:var(--ok)} .ah.back.off{fill:var(--abst); opacity:.32}
@keyframes dash{to{stroke-dashoffset:-26}}
@media (prefers-reduced-motion:reduce){.edge.live{animation:none}}
.elbl{font-size:10.5px; font-family:"IBM Plex Mono",monospace; fill:var(--ink-2); font-weight:500;
  paint-order:stroke; stroke:var(--ground); stroke-width:3.5px; stroke-linejoin:round}

/* ---------- noeud ---------- */
.node{position:absolute; width:150px; height:94px; overflow:hidden;
  background:var(--surface); border:2.2px solid var(--line-2);
  background-image:linear-gradient(160deg,var(--tint) 0%,transparent 62%);
  border-radius:3px; border-left-width:6px; box-shadow:var(--shadow); padding:9px 10px; cursor:pointer; text-align:left;
  transition:border-color .18s, box-shadow .18s, transform .18s}
.node:hover{transform:translateY(-1px)}
.node .top{display:flex; align-items:center; gap:6px; margin-bottom:3px}
.node .code{font-family:"IBM Plex Mono",monospace; font-size:9.5px; font-weight:700; color:var(--lc); letter-spacing:.06em}
.node .nm{font-size:12.5px; font-weight:600; line-height:1.25; display:block; color:var(--ink)}
.node .mt{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-2); margin-top:6px; display:block;
  min-height:15px; line-height:1.3; background:var(--surface-2); border-radius:3px; padding:2px 5px; margin-left:-2px; margin-right:-2px}
.node .st{margin-left:auto; width:11px; height:11px; border-radius:50%; background:var(--line-2); flex:none}

.node[data-s="idle"]{opacity:.82}
.node[data-s="wait"]{opacity:.72; border-style:dashed}
.node[data-s="run"]{border-top-color:var(--accent);border-right-color:var(--accent);border-bottom-color:var(--accent); box-shadow:var(--shadow),var(--glow); animation:pulse 1.15s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:var(--shadow),var(--glow)}50%{box-shadow:var(--shadow),0 0 0 7px transparent}}
@media (prefers-reduced-motion:reduce){.node[data-s="run"]{animation:none}}
.node[data-s="run"] .st{background:none; border:2px solid var(--accent-soft); border-top-color:var(--accent); animation:spin .62s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.node[data-s="run"] .st{animation:none; background:var(--accent); border:0}}
.node[data-s="ok"]{border-top-color:var(--ok);border-right-color:var(--ok);border-bottom-color:var(--ok)} .node[data-s="ok"] .st{background:var(--ok)}
.node[data-s="warn"]{border-top-color:var(--warn);border-right-color:var(--warn);border-bottom-color:var(--warn)} .node[data-s="warn"] .st{background:var(--warn)}
.node[data-s="crit"]{border-top-color:var(--crit);border-right-color:var(--crit);border-bottom-color:var(--crit)} .node[data-s="crit"] .st{background:var(--crit)}
.node[data-s="skip"]{border-style:dashed; border-top-color:var(--abst);border-right-color:var(--abst);border-bottom-color:var(--abst); opacity:.55}
.node[data-s="skip"] .st{background:var(--abst)}
.node[aria-pressed="true"]{outline:2px solid var(--accent); outline-offset:2px}

.node .tagabs{position:absolute; top:-8px; right:-6px; font-size:8.5px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; padding:2px 6px; border-radius:99px;
  background:var(--crit-soft); color:var(--crit); border:1px solid var(--crit)}
.node .tagsup{position:absolute; top:-8px; right:-6px; font-size:8.5px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; padding:2px 6px; border-radius:99px;
  background:var(--abst-soft); color:var(--abst); border:1px solid var(--abst)}

.grp{position:absolute; border:1px solid var(--line-2); border-radius:6px; pointer-events:none; z-index:0}
.node{z-index:2} .canvas svg.edges{z-index:1}
.grp span{position:absolute; top:-9px; left:12px; background:var(--ground); padding:0 8px; border-radius:3px;
  font-size:9.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}

/* ---------- bas ---------- */
.bottom{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:1px; background:var(--line)}
@media (max-width:960px){.bottom{grid-template-columns:1fr}}
.pane{background:var(--ground); padding:15px; min-width:0}
.card{background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow)}
.card .hd{padding:10px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.card .bd{padding:14px}
.badge{font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:99px}
.b-ok{background:var(--ok-soft); color:var(--ok)} .b-par{background:var(--warn-soft); color:var(--warn)}
.b-abs{background:var(--crit-soft); color:var(--crit)} .b-sup{background:var(--abst-soft); color:var(--abst)}
.b-con{background:var(--surface-3); color:var(--abst)}
.path{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--accent-ink); word-break:break-all}
.cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:17px}
.blk .lbl{display:block; margin-bottom:5px}
.blk ul{margin:0; padding-left:17px; font-size:12.5px; line-height:1.55; color:var(--ink-2)}
.blk li{margin-bottom:3px}
.blk p{margin:0; font-size:12.5px; color:var(--ink-2); line-height:1.55}
.refus{border-left:2px solid var(--crit); padding-left:10px}
.run-bilan{padding:11px 14px; background:var(--surface-2); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.run-bilan .sortie{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-2);
  background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:3px 8px}
.run-bilan .jrn{flex-basis:100%; margin:2px 0 0; padding-left:17px; font-size:12px;
  color:var(--ink-2); line-height:1.5}
.log{max-height:200px; overflow:auto; font-family:"IBM Plex Mono",monospace; font-size:11px; line-height:1.7}
.log div{white-space:pre-wrap; word-break:break-word}
.log .t{color:var(--ink-3)}
.log .ok{color:var(--ok)} .log .warn{color:var(--warn)} .log .crit{color:var(--crit)} .log .acc{color:var(--accent-ink)} .log .abst{color:var(--abst)}
.legend{display:flex; gap:6px 15px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-2); padding:9px 14px; border-top:1px solid var(--line); background:var(--surface-2)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px}
</style>

  });
  etiquettes.forEach(e=>{
    h+=`<text class="elbl" x="${e.lx}" y="${e.ly}" text-anchor="${e.anchor}"${e.k==="b"?' style="fill:var(--ok)"':''}>${e.l}</text>`;
  });
  sv.innerHTML=h;
}
function majAretes(){
  EDGES.forEach(([a,b,,k],i)=>{
    const e=document.getElementById("e-"+i), ah=document.getElementById("a-"+i);
    if(!e) return;
    const base = k==="b" ? "back" : k==="v" ? "side" : "";
    let etat="";
    if(k==="b"){ etat = boucleActive() ? "" : "off"; }
    else{
      const sa=etats[a], sb=etats[b];
      if(sa==="skip"||sb==="skip") etat="dead";
      else if(sb==="run") etat="live";
      else if(["ok","warn","crit"].includes(sa)) etat="done";
    }
    e.setAttribute("class", ("edge "+base+" "+etat).replace(/\s+/g," ").trim());
    ah.setAttribute("class", ("ah "+base+" "+etat).replace(/\s+/g," ").trim());
  });
}

/* ---- état ---- */
const cv=document.getElementById("canvas"), sv=document.getElementById("edges");
let sel=SCHEMA.blocs[0].id, etats={}, res=null, timer=null, wave=0, running=false, spd=1;
const pol={}; (SCHEMA.politiques||[]).forEach(p=>pol[p.id]=!!p.defaut);
let scnId = (SCHEMA.scenarios&&SCHEMA.scenarios[0]) ? SCHEMA.scenarios[0].id : null;
Object.keys(N).forEach(k=>etats[k]="idle");
const boucleActive = ()=> (SCHEMA.politiques||[]).length ? pol[SCHEMA.politiques[0].id] : true;

function cle(){ return (SCHEMA.politiques||[]).map(p=>`${p.id}:${pol[p.id]}`).join("|"); }
function calcule(){
  const s=(SCHEMA.scenarios||[]).find(x=>x.id===scnId);
  if(!s) return {out:Object.fromEntries(Object.keys(N).map(k=>[k,{st:"ok",mt:"—",log:[]}])), log:[]};
  const r = s.resultats[cle()] || s.resultats[Object.keys(s.resultats)[0]];
  return {out:r.blocs, log:r.verdict||[]};
}

/* ---- rendu ---- */
function bandes(){
  LAY.bandes.forEach(g=>{
    const t="L"+(g.teinte+1), d=document.createElement("div");
    d.className="grp";
    d.style.cssText=`left:${g.x}px; top:${g.y}px; width:${g.w}px; height:${g.h}px;
      background:var(--${t}b); border-color:var(--${t}e);`;
    d.innerHTML=`<span style="color:var(--${t})">${g.nom}</span>`;
    cv.appendChild(d);
  });
}
function noeuds(){
  SCHEMA.blocs.forEach(b=>{
    const t = ETIQ[b.couche] || "L1";
    const el=document.createElement("button");
    el.className="node"; el.id="n-"+b.id; el.style.left=b.x+"px"; el.style.top=b.y+"px";
    el.setAttribute("data-s","idle");
    el.style.borderLeftColor=`var(--${t})`;
    el.style.setProperty("--tint",`var(--${t}b)`); el.style.setProperty("--lc",`var(--${t})`);
    const tag = b.etat==="abs" ? '<span class="tagabs">absent</span>'
              : b.etat==="sup" ? '<span class="tagsup">supprimé</span>' : "";
    el.innerHTML=`${tag}<span class="top"><span class="code">${b.code}</span><span class="st"></span></span>
      <span class="nm">${b.nom}</span><span class="mt" id="mt-${b.id}">—</span>`;
    el.onclick=()=>{ if(pan.bouge>5) return; sel=b.id; fiche(); };
    cv.appendChild(el);
  });
}
const STL={ok:"b-ok",par:"b-par",abs:"b-abs",sup:"b-sup",con:"b-con"};
const ETQ={ok:["b-ok","terminé"],warn:["b-par","terminé avec réserves"],
           crit:["b-abs","refus ou blocage"],skip:["b-sup","non exécuté"]};
function bilan(k){
  if(!res || !res.out[k] || etats[k]==="idle" || etats[k]==="run") return "";
  const o=res.out[k], [cls,txt]=ETQ[o.st]||["b-con","—"];
  return `<div class="run-bilan"><span class="lbl">Dernière exécution</span>
    <span class="badge ${cls}">${txt}</span><span class="sortie">${o.mt}</span>
    ${(o.log||[]).length?`<ul class="jrn">${o.log.map(l=>`<li>${l}</li>`).join("")}</ul>`:""}</div>`;
}
function fiche(){
  const m=N[sel], f=FICHE[sel];
  const li=a=>(a||[]).map(x=>`<li>${x}</li>`).join("");
  document.getElementById("detail").innerHTML=`
    <div class="hd"><h3 style="font-size:15px">${m.c} · ${m.n}</h3>
      <span class="badge ${STL[m.st]||"b-con"}">${m.stl||""}</span>
      <span class="path" style="margin-left:auto">${m.f||""}</span></div>
    ${bilan(sel)}
    <div class="bd"><div class="cols">
      <div class="blk"><span class="lbl">Reçoit</span><ul>${li(f.recoit)}</ul></div>
      <div class="blk"><span class="lbl">Produit</span><ul>${li(f.produit)}</ul></div>
      <div class="blk"><span class="lbl">Refuse de produire</span><ul class="refus">${li(f.refuse)}</ul></div>
      <div class="blk"><span class="lbl">Ce qui manque</span><p>${f.manque||"—"}</p></div>
    </div></div>`;
  majNoeuds();
}
function majNoeuds(){
  Object.keys(N).forEach(k=>{
    const el=document.getElementById("n-"+k); if(!el) return;
    el.setAttribute("data-s", etats[k]);
    el.setAttribute("aria-pressed", k===sel);
    const mt=document.getElementById("mt-"+k);
    mt.textContent = etats[k]==="idle" ? "—" : etats[k]==="run" ? "en travail…"
      : (res && res.out[k] ? res.out[k].mt : "—");
  });
  majAretes();
}
function journal(sev,txt){
  const el=document.getElementById("log");
  el.insertAdjacentHTML("beforeend",
    `<div><span class="t">${new Date().toTimeString().slice(0,8)}</span>  <span class="${sev}">${txt}</span></div>`);
  el.scrollTop=el.scrollHeight;
}
function reset(){
  clearTimeout(timer); running=false; wave=0; res=null;
  Object.keys(N).forEach(k=>etats[k]="idle");
  document.getElementById("log").innerHTML=""; document.getElementById("clock").textContent="—";
  majNoeuds(); fiche(); btns();
}
function btns(){
  const p=document.getElementById("play");
  p.textContent = running ? "En cours…" : "Exécuter"; p.disabled = running;
  document.getElementById("step").disabled = running;
}
function jouerVague(auto){
  if(wave===0){ res=calcule(); journal("acc","▶ "+((SCHEMA.scenarios||[]).find(s=>s.id===scnId)||{}).nom||SCHEMA.titre); }
  if(wave>=WAVES.length){
    running=false; btns(); (res.log||[]).forEach(v=>journal(v[0],"◆ "+v[1]));
    document.getElementById("clock").textContent="terminé"; fiche(); return;
  }
  const grp=WAVES[wave];
  grp.forEach(k=>etats[k]="run"); majNoeuds();
  document.getElementById("clock").textContent=`vague ${wave+1}/${WAVES.length}${grp.length>1?` · ${grp.length} en parallèle`:""}`;
  timer=setTimeout(()=>{
    grp.forEach(k=>{
      const o=res.out[k]; etats[k]=o?o.st:"ok";
      if(o) (o.log||[]).forEach(l=>journal(o.st==="crit"?"crit":o.st==="warn"?"warn":o.st==="skip"?"abst":"ok",`  ${N[k].c} ${l}`));
    });
    majNoeuds(); fiche(); wave++;
    if(auto && running) jouerVague(true); else btns();
  }, (420+grp.length*110)*spd);
}

/* ---- barre : scénarios, politiques, légendes ---- */
if((SCHEMA.scenarios||[]).length){
  document.getElementById("ctl-scn").innerHTML =
    `<span class="lbl">Scénario</span><select id="scn">${SCHEMA.scenarios.map(s=>`<option value="${s.id}">${s.nom}</option>`).join("")}</select>`;
  document.getElementById("scn").onchange = e=>{ scnId=e.target.value; reset(); };
}
document.getElementById("ctl-pol").innerHTML = (SCHEMA.politiques||[]).map(p=>
  `<div class="ctl" title="${(p.aide||"").replace(/"/g,"&quot;")}"><span class="lbl">${p.nom}</span>
   <button class="sw" data-p="${p.id}" aria-pressed="${!!p.defaut}" aria-label="${p.nom}"></button></div>`).join("");
document.querySelectorAll(".sw[data-p]").forEach(b=>b.onclick=()=>{
  pol[b.dataset.p]=!pol[b.dataset.p]; b.setAttribute("aria-pressed",pol[b.dataset.p]); reset(); });
document.getElementById("soustitre").textContent = SCHEMA.sousTitre||"";
document.getElementById("leg-couches").innerHTML =
  `<span class="lbl" style="margin-right:2px">Couches</span>` + SCHEMA.couches.map((c,i)=>
   `<span><i style="background:var(--L${i+1});border-radius:2px"></i>${c.nom}</span>`).join("");
document.getElementById("leg-etats").innerHTML = `<span class="lbl" style="margin-right:2px">États</span>
  <span><i style="background:var(--line-2)"></i>en attente</span>
  <span><i style="background:var(--accent)"></i>en travail</span>
  <span><i style="background:var(--ok)"></i>terminé</span>
  <span><i style="background:var(--warn)"></i>terminé avec réserves</span>
  <span><i style="background:var(--crit)"></i>refus ou blocage</span>
  <span><i style="background:var(--abst)"></i>non exécuté</span>
  <span style="margin-left:auto"><svg width="34" height="10" style="vertical-align:-1px"><line x1="0" y1="5" x2="24" y2="5" stroke="var(--ink-3)" stroke-width="2"/><polygon points="24,1 24,9 32,5" fill="var(--ink-3)"/></svg> flux</span>
  <span><svg width="34" height="10" style="vertical-align:-1px"><line x1="0" y1="5" x2="24" y2="5" stroke="var(--ok)" stroke-width="2" stroke-dasharray="7 4"/><polygon points="24,1 24,9 32,5" fill="var(--ok)"/></svg> retour en arrière</span>`;

/* ---- navigation : saisir la feuille, molette pour zoomer ---- */
const wrap=document.querySelector(".canvas-wrap"), csize=document.getElementById("csize");
const BASE_W=LAY.canvasW, BASE_H=LAY.canvasH;
cv.style.width=BASE_W+"px"; cv.style.height=BASE_H+"px";
sv.setAttribute("viewBox",`0 0 ${BASE_W} ${BASE_H}`);
let z=1, pan={on:false,dx:0,dy:0,sl:0,st:0,bouge:0};
function zoom(v){
  z=Math.min(2.2,Math.max(.25,v));
  cv.style.transform=`scale(${z})`;
  csize.style.width=(BASE_W*z)+"px"; csize.style.height=(BASE_H*z)+"px";
  document.getElementById("zlbl").textContent=Math.round(z*100)+" %";
}
const ajuster=()=>zoom((wrap.clientWidth-24)/BASE_W);
/* Pas de setPointerCapture : l'élément qui capture reçoit aussi le clic à la place du bouton. */
wrap.addEventListener("pointerdown", e=>{
  if(e.button!==0) return;
  pan={on:true,dx:e.clientX,dy:e.clientY,sl:wrap.scrollLeft,st:wrap.scrollTop,bouge:0};
  wrap.classList.add("grabbing");
});
document.addEventListener("pointermove", e=>{
  if(!pan.on) return;
  const dx=e.clientX-pan.dx, dy=e.clientY-pan.dy;
  pan.bouge=Math.max(pan.bouge,Math.abs(dx)+Math.abs(dy));
  if(pan.bouge>4){ wrap.scrollLeft=pan.sl-dx; wrap.scrollTop=pan.st-dy; }
});
["pointerup","pointercancel"].forEach(ev=>document.addEventListener(ev,()=>{
  if(pan.on){ pan.on=false; wrap.classList.remove("grabbing"); } }));
wrap.addEventListener("wheel", e=>{
  if(!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  const av=z; zoom(z*(e.deltaY<0?1.12:0.89));
  const r=wrap.getBoundingClientRect(), px=e.clientX-r.left+wrap.scrollLeft, py=e.clientY-r.top+wrap.scrollTop;
  wrap.scrollLeft+=px*(z/av-1); wrap.scrollTop+=py*(z/av-1);
},{passive:false});
document.getElementById("zin").onclick=()=>zoom(z*1.15);
document.getElementById("zout").onclick=()=>zoom(z/1.15);
document.getElementById("zfit").onclick=ajuster;
addEventListener("keydown", e=>{
  if(["SELECT","INPUT","TEXTAREA"].includes(e.target.tagName)) return;
  const p=90, m={ArrowLeft:["scrollLeft",-p],ArrowRight:["scrollLeft",p],ArrowUp:["scrollTop",-p],ArrowDown:["scrollTop",p]}[e.key];
  if(m){ wrap[m[0]]+=m[1]; e.preventDefault(); }
});
document.getElementById("play").onclick=()=>{ reset(); running=true; btns(); jouerVague(true); };
document.getElementById("step").onclick=()=>{ if(wave===0) document.getElementById("log").innerHTML=""; jouerVague(false); };
document.getElementById("reset").onclick=reset;
document.getElementById("spd").onchange=e=>{ spd=parseFloat(e.target.value); };
document.getElementById("theme").onclick=()=>{
  const c=document.documentElement.getAttribute("data-theme");
  const n=c==="dark"?"light":c==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark");
  document.documentElement.setAttribute("data-theme",n);
  try{localStorage.setItem("bl",n)}catch(e){}
};
try{const t=localStorage.getItem("bl"); if(t) document.documentElement.setAttribute("data-theme",t);}catch(e){}

bandes(); noeuds(); aretes(); fiche(); majNoeuds(); btns();
</script>
