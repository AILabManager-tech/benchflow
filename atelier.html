let minuteurPain = null;
function pain(txt, cls){
  const p = $("pain");
  p.textContent = txt;
  p.className = "pain on " + (cls || "");
  clearTimeout(minuteurPain);
  minuteurPain = setTimeout(() => p.className = "pain " + (cls || ""), 2600);
}

function copiePressePapier(txt, msg){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(
      () => pain(msg || "copié", "ok"),
      () => secoursCopie(txt, msg));
  } else secoursCopie(txt, msg);
}
function secoursCopie(txt, msg){
  /* Le presse-papier peut être refusé (page ouverte en file://, permission
     absente). On ne fait pas semblant que ça a marché : on montre le texte. */
  const ta = document.createElement("textarea");
  ta.value = txt; ta.style.cssText = "position:fixed;left:-9999px";
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch(e){ ok = false; }
  ta.remove();
  if (ok) pain(msg || "copié", "ok");
  else ouvreBoite("Copie refusée par le navigateur",
    `<p class="vide">Sélectionne le texte ci-dessous et copie-le à la main.</p>
     <textarea class="code" style="width:100%;min-height:300px;white-space:pre">${ech(txt)}</textarea>`, "");
}

function telecharge(nom, contenu){
  const b = new Blob([contenu], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = nom;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  pain(`${nom} enregistré`, "ok");
}

function enregistreFichier(){
  telecharge((M.titre || "montage").replace(/[^\wÀ-ÿ]+/g, "-").toLowerCase() + ".atelier.json",
             JSON.stringify(M, null, 1));
}

$("fichier-in").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const l = new FileReader();
  l.onload = () => { importe(l.result); e.target.value = ""; };
  l.readAsText(f);
};

function importe(txt){
  try {
    const o = JSON.parse(txt);
    if (!o || !Array.isArray(o.blocs)) throw new Error("ce fichier ne contient pas de montage");
    M = Object.assign(montageVide(), o);
    M.zones ??= []; M.forges ??= []; M.scenarios ??= []; M.liens ??= [];
    chargeForges(M.forges);
    const remis = normaliseMontage(M);
    seq = Math.max(remis.seq, nb(o.seq, 0) + 1);
    if (remis.notes.length){
      setTimeout(() => ouvreBoite("Ce fichier a dû être remis d'aplomb",
        `<p class="vide" style="margin-bottom:11px">Le montage est chargé, mais il n'était pas cohérent.
          Voici tout ce qui a été touché — rien d'autre ne l'a été.</p>` +
        remis.notes.map(t => `<div class="carte warn"><div class="ds">${ech(t)}</div></div>`).join("") +
        `<p class="vide" style="margin-top:11px">Regarde l'onglet <b>Problèmes</b> avant de t'y fier.</p>`), 350);
    }
    deselectionne(); R = null; vueRun = { vals: {}, liens: {}, files: {}, actifs: [] };
    dessinePalette(); dessine(); inspecteur(); panneaux(); dessineJournal();
    HIST.pile = []; HIST.curseur = -1; pousseHist(); sauve();
    ajusteVue();
    pain(`« ${M.titre} » chargé — ${M.blocs.length} blocs`, "ok");
  } catch(err){
    pain("import refusé : " + err.message, "err");
  }
}

function collePressePapier(){
  if (navigator.clipboard && navigator.clipboard.readText){
    navigator.clipboard.readText().then(importe,
      () => ouvreBoite("Coller un montage",
        `<textarea id="coller-zone" class="code" style="width:100%;min-height:280px"
           placeholder="Colle ici le contenu d'un fichier .atelier.json"></textarea>`,
        `<div class="sp"></div><button class="btn sm primary" id="coller-ok">Charger</button>`,
        () => { $("coller-ok").onclick = () => { importe($("coller-zone").value); fermeVoiles(); }; }));
  } else ouvreBoite("Coller un montage",
    `<textarea id="coller-zone" class="code" style="width:100%;min-height:280px"></textarea>`,
    `<div class="sp"></div><button class="btn sm primary" id="coller-ok">Charger</button>`,
    () => { $("coller-ok").onclick = () => { importe($("coller-zone").value); fermeVoiles(); }; });
}

function renomme(){

function vide(){
  if (M.blocs.length && !confirm("Effacer tout le montage ? Les blocs forgés sont conservés.")) return;
  modifie(() => {
    const forges = M.forges;
    M = montageVide(); M.forges = forges;
    deselectionne(); R = null; vueRun = { vals: {}, liens: {}, files: {}, actifs: [] };
  });
  dessineJournal(); dessineMesures();
  pain("montage vidé");
}

function chargeExemple(nom){
  const f = EXEMPLES[nom];
  if (!f) return pain("exemple inconnu : " + nom, "err");
  M = f(); seq = M.seq || 100;
  chargeForges(M.forges);
  deselectionne(); R = null; vueRun = { vals: {}, liens: {}, files: {}, actifs: [] };
  dernierScen = null;
  dessinePalette(); dessine(); inspecteur(); panneaux(); dessineJournal(); dessineMesures();
  HIST.pile = []; HIST.curseur = -1; pousseHist(); sauve();
  ajusteVue();
  pain(`« ${nom} » chargé`, "ok");
}

       <div class="ds">Chaque valeur qui passe s'affiche sur son fil, chaque décision est journalisée

     <div class="carte info"><div class="tt">Reproductible</div>
       <div class="ds">Le hasard vient d'une graine. Même graine, même exécution, au millième de

     <div class="h2">Le temps</div>
     <p class="vide">Chaque bloc consomme des millisecondes simulées (réglage « temps de traitement »), peut
       coûter, peut limiter ses traitements simultanés, et peut casser au hasard. L'exécution se calcule
       d'un trait puis <b>s'enregistre</b> : la barre du bas rejoue cet enregistrement, en avant comme en
       arrière. Ce que tu regardes n'est jamais le calcul, c'est sa relecture.</p>

     <div class="h2">Ce qui sort d'ici</div>
     <p class="vide">L'onglet <b>Code engendré</b> produit un fichier JavaScript qui embarque le moteur et les

          : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");

/* ── persistance locale ──────────────────────────────────────────────────── */
function sauve(){
  try { localStorage.setItem("atelier2", JSON.stringify({ M, seq, vue })); } catch(e){}
}
function charge(){
  try {
    const s = JSON.parse(localStorage.getItem("atelier2") || "null");
    if (s && s.M && Array.isArray(s.M.blocs)){
      M = Object.assign(montageVide(), s.M);
      M.zones ??= []; M.forges ??= []; M.scenarios ??= [];
      seq = s.seq || 100;
      if (s.vue) vue = s.vue;
      return true;
    }
  } catch(e){}
  return false;
}

/* ── reprise d'un montage de la version précédente ────────────────────────
   L'esquisse enregistrait sous la clé « atelier ». Ne rien faire reviendrait à
   faire disparaître le travail de quelqu'un sans le dire. On convertit donc, et
   on annonce exactement ce qui a changé — l'ancienne clé n'est jamais effacée. */
const RENOMMES = { transformer: "fonction" };

function migreV1(v1){
  const N = montageVide();
  N.titre = "Montage repris de la version précédente";
  const notes = [];
  (v1.blocs || []).forEach(b => {
    const comp = RENOMMES[b.comp] || b.comp;
    if (!compDe(comp)){ notes.push(`« ${b.nom} » : comportement « ${b.comp} » disparu — bloc omis.`); return; }
    const params = Object.assign(defauts(comp), b.params || {});
    if (b.comp === "transformer") notes.push(`« ${b.nom} » : Transformer s'appelle désormais Fonction.`);
    if (b.comp === "aiguiller"){
      /* Une condition unique devient une table de voies d'une ligne. Les deux
         sorties gardent leur ordre : oui → voie 1, non → autre. */
      params.voies = (b.params && b.params.cond) || "x > 0";
      delete params.cond;
      notes.push(`« ${b.nom} » : Aiguiller prend maintenant une condition par ligne ; « oui/non » devient « voie 1/autre ».`);
    }
    N.blocs.push({ id: b.id, comp, nom: b.nom, x: b.x, y: b.y, params });
  });
  const vivants = new Set(N.blocs.map(b => b.id));
  (v1.liens || []).forEach(l => {
    if (!vivants.has(l.de.b) || !vivants.has(l.vers.b)){
      notes.push("Un fil a été coupé : il touchait un bloc omis."); return;
    }
    N.liens.push({ id: l.id, de: { b: l.de.b, i: l.de.i }, vers: { b: l.vers.b, i: l.vers.i } });
  });
  (v1.zones || []).forEach(z => N.zones.push(z));
  return { M: N, notes };
}

function tenteMigration(){
  let brut_;
  try { brut_ = localStorage.getItem("atelier"); } catch(e){ return false; }
  if (!brut_) return false;
  let v1;
  try { v1 = JSON.parse(brut_); } catch(e){ return false; }
  const src = v1 && v1.M ? v1.M : v1;
  if (!src || !Array.isArray(src.blocs) || !src.blocs.length) return false;

  const { M: N, notes } = migreV1(src);
  M = N;
  const remis = normaliseMontage(M);
  remis.notes.forEach(t => notes.push(t));
  seq = Math.max(remis.seq, nb(v1.seq, 0) + 1);
  setTimeout(() => ouvreBoite("Un montage de la version précédente a été retrouvé",
    `<p class="vide" style="margin-bottom:11px">Il a été converti : ${M.blocs.length} bloc(s),
      ${M.liens.length} lien(s). L'ancienne sauvegarde n'a pas été touchée — elle reste
      là où elle était, sous la clé <span class="mono">atelier</span>.</p>
     ${notes.length
       ? `<div class="h2">Ce qui a changé</div>` +
         [...new Set(notes)].map(t => `<div class="carte warn"><div class="ds">${ech(t)}</div></div>`).join("")
       : `<div class="carte ok"><div class="tt">✓ Rien n'a bougé</div>
          <div class="ds">Tous les blocs et tous les fils ont été repris à l'identique.</div></div>`}
     <p class="vide" style="margin-top:11px">Vérifie le résultat avant de t'y fier : exécute le
       montage et regarde l'onglet <b>Problèmes</b>.</p>`), 400);
  return true;
}

/* ── démarrage ───────────────────────────────────────────────────────────── */
(function demarre(){
  const repris = charge() || tenteMigration();
  if (!repris || !M.blocs.length){
    M = EXEMPLES["Contrôle et réparation"]();
    seq = M.seq || 100;
  }
  chargeForges(M.forges);
  dessinePalette();
  dessine();
  inspecteur();
  panneaux();
  dessineJournal();
  applique();
  pousseHist();
  if (!repris) setTimeout(ajusteVue, 30);
  setTimeout(() => { $("astuce").style.transition = "opacity .6s"; $("astuce").style.opacity = "0";
                     setTimeout(() => $("astuce").style.display = "none", 700); }, 9000);
})();
