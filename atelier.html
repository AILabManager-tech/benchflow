   ["limiteur",   "3 par seconde",    360, 240, { parSeconde: "3" }],
   ["attendre",   "Traitement lent",  640, 240, { duree: "200", _cap: "1" }],
   ["sonde",      "Observation",      920, 240],
   ["sortie",     "Traité",          1180, 240]],
  [[0,"valeur",1,"x"], [1,"x",2,"x"], [2,"x",3,"x"], [3,"x",4,"x"]],
  [["Le goulot se voit à la file qui gonfle", 320, 170, 600, 200, 5]],
  [{ nom: "Vingt arrivées, vingt sorties", graine: 1,
     attentes: [{ sujet: "compte", cible: "b5", op: "=", valeur: "20" },
                { sujet: "duree", op: "≥", valeur: "6000" }] }])
};

/* ───────────────────────────────────────────────────────────────────────────
   §11 · AUTO-TESTS DU MOTEUR
   Le noyau se vérifie lui-même. Les mêmes assertions tournent dans la page
   (onglet « Moteur ») et hors du navigateur (`node verifier.mjs`).
   ─────────────────────────────────────────────────────────────────────────── */

function lancerTests(){
  const res = [];
  let groupe = "";
  const G = t => groupe = t;
  const ok = (nom, cond, detail) => res.push({ groupe, nom, ok: !!cond, detail: detail || "" });
  const eq = (nom, a, b) => res.push({ groupe, nom, ok: Object.is(a, b) || String(a) === String(b),
                                       detail: Object.is(a, b) || String(a) === String(b) ? "" : `attendu ${b}, obtenu ${a}` });
  const pres = (nom, a, b, tol) => res.push({ groupe, nom, ok: Math.abs(a - b) <= (tol || 1e-9),
                                              detail: Math.abs(a - b) <= (tol || 1e-9) ? "" : `attendu ${b}, obtenu ${a}` });

  /* ── hasard et ordonnancement ─────────────────────────────────────── */
  G("Déterminisme");
  const r1 = alea(42), r2 = alea(42);
  eq("même graine, même suite", [r1(), r1(), r1()].join(","), [r2(), r2(), r2()].join(","));
  ok("graines différentes divergent", alea(1)() !== alea(2)());
  ok("tirage dans [0,1[", (() => { const r = alea(7); for (let i = 0; i < 200; i++){ const x = r(); if (x < 0 || x >= 1) return false; } return true; })());
  const moyN = (() => { const r = alea(3); let s = 0; for (let i = 0; i < 4000; i++) s += aleaNormal(r, 10, 2); return s / 4000; })();
  pres("loi normale centrée sur la moyenne", moyN, 10, 0.15);

  G("Tas d'événements");
  const T = new Tas();
  [[5,0],[1,1],[5,2],[3,3],[1,4]].forEach(([t, ord]) => T.pousse({ t, ord }));
  const sortis = []; while (T.taille) sortis.push(T.tire());
  eq("ordre (temps, arrivée)", sortis.map(x => x.t + ":" + x.ord).join(" "), "1:1 1:4 3:3 5:0 5:2");

  /* ── valeurs ──────────────────────────────────────────────────────── */
  G("Valeurs et types");
  eq("nombre reconnu", typeDe(val(3)), "nombre");
  eq("texte reconnu", typeDe(val("a")), "texte");
  eq("booléen reconnu", typeDe(val(true)), "booleen");
  eq("liste reconnue", typeDe(val([1,2])), "liste");
  eq("objet reconnu", typeDe(val({a:1})), "objet");
  eq("anomalie reconnue", typeDe(anomalie("x")), "anomalie");
  ok("estAnomalie", estAnomalie(anomalie("x")) && !estAnomalie(val(1)));
  eq("conversion vers nombre", convertir("12", "nombre").v, 12);
  eq("virgule décimale acceptée", convertir("3,5", "nombre").v, 3.5);
  ok("texte non numérique refusé", estAnomalie(convertir("douze", "nombre")));
  eq("le refus dit pourquoi", convertir("douze", "nombre").v.includes("n'est pas un nombre"), true);
  eq("booléen français", convertir("oui", "booleen").v, true);
  ok("booléen ambigu refusé", estAnomalie(convertir("peut-être", "booleen")));
  eq("objet refusé si liste", estAnomalie(convertir([1], "objet")), true);
  eq("affichage entier", aff(val(3)), "3");
  eq("affichage décimal arrondi", aff(val(3.14159)), "3.142");
  eq("affichage booléen", aff(val(true)), "vrai");
  eq("affichage liste", aff(val([1,2])), "[1, 2]");
  eq("affichage anomalie", aff(anomalie("bris")), "⚠ bris");
  eq("valeur déjà enveloppée non réenveloppée", val(val(5)).v, 5);

  G("Expressions");
  eq("expression simple", evalue("x * 2", val(21)), 42);
  eq("boîte à outils accessible", evalue("aide.arrondi(x, 1)", val(3.14159)), 3.1);
  ok("expression fautive lève", (() => { try { evalue("x *", val(1)); return false; } catch(e){ return /illisible/.test(e.message); } })());
  ok("erreur d'exécution lève aussi", (() => { try { evalue("x.y.z", val(null)); return false; } catch(e){ return true; } })());
  eq("compilation mise en cache", compileExpr("x+1", ["x"]) === compileExpr("x+1", ["x"]), true);

  /* ── comportements, un par un ─────────────────────────────────────── */
  G("Comportements");
  const ctxNu = (etat, temps) => ({ etat: etat || {}, temps: temps || 0, bloc: "b?",
    hasard: alea(1), note: () => {}, assertion: () => {} });
  const P_ = (comp, sur) => Object.assign(defauts(comp), sur || {});

  eq("Source émet la valeur convertie", COMP.source.fn(P_("source", { valeur: "7", type: "nombre" })).valeur.v, 7);
  ok("Source au type impossible produit une anomalie",
     estAnomalie(COMP.source.fn(P_("source", { valeur: "abc", type: "nombre" })).valeur));

  const gen = P_("generateur", { loi: "suite", n: "3", a: "10", b: "5", cadence: "50" });
  const eg = {};
  const g1 = COMP.generateur.fn(gen, {}, ctxNu(eg));
  const g2 = COMP.generateur.fn(gen, {}, ctxNu(eg));
  const g3 = COMP.generateur.fn(gen, {}, ctxNu(eg));
  const g4 = COMP.generateur.fn(gen, {}, ctxNu(eg));
  eq("Générateur suite : 1ʳᵉ valeur", g1.valeur.v, 10);
  eq("Générateur suite : 2ᵉ valeur", g2.valeur.v, 15);
  eq("Générateur rappelle tant qu'il reste", g1._encore, 50);
  eq("Générateur ne rappelle pas à la dernière", g3._encore, undefined);
  eq("Générateur épuisé n'émet plus rien", Object.keys(g4).length, 0);
  ok("Générateur liste vide devient anomalie",
     estAnomalie(COMP.generateur.fn(P_("generateur", { loi: "liste", liste: "  ", n: "1" }), {}, ctxNu({})).valeur));
  ok("Générateur à loi inconnue devient anomalie",
     estAnomalie(COMP.generateur.fn(P_("generateur", { loi: "poisson", n: "1" }), {}, ctxNu({})).valeur));

  const ej = {};
  const j1 = COMP.jeu.fn(P_("jeu", { donnees: "a, b\n1, 2\n3, 4" }), {}, ctxNu(ej));
  eq("Jeu CSV : en-têtes appliquées", JSON.stringify(j1.ligne.v), '{"a":1,"b":2}');
  eq("Jeu CSV : nombre de lignes", ej.lignes.length, 2);
  const j2 = COMP.jeu.fn(P_("jeu", { donnees: '[{"n":9}]' }), {}, ctxNu({}));
  eq("Jeu JSON accepté", j2.ligne.v.n, 9);
  ok("Jeu JSON illisible devient anomalie",
     estAnomalie(COMP.jeu.fn(P_("jeu", { donnees: "[{oups" }), {}, ctxNu({})).ligne));
  ok("Jeu vide devient anomalie",
     estAnomalie(COMP.jeu.fn(P_("jeu", { donnees: "   " }), {}, ctxNu({})).ligne));

  eq("Fonction applique l'expression", COMP.fonction.fn(P_("fonction", { expr: "x + 1" }), { x: val(41) }).y.v, 42);
  eq("Script exécute le corps", COMP.script.fn(P_("script", { corps: "return x * x;" }), { x: val(6) }, ctxNu({})).y.v, 36);
  eq("Script garde son état", (() => { const e = {}; const p = P_("script", { corps: "etat.n = (etat.n||0)+1; return etat.n;" });
      COMP.script.fn(p, { x: val(0) }, ctxNu(e)); return COMP.script.fn(p, { x: val(0) }, ctxNu(e)).y.v; })(), 2);
  eq("Convertir réussit", COMP.convertir.fn(P_("convertir", { vers: "texte" }), { x: val(5) }).y.v, "5");
  ok("Convertir refuse sur son propre port",
     estAnomalie(COMP.convertir.fn(P_("convertir", { vers: "nombre" }), { x: val("zzz") }).refus));
  eq("Formater remplace {x}", COMP.formater.fn(P_("formater", { gabarit: "n={x}" }), { x: val(4) }).texte.v, "n=4");
  eq("Formater lit un champ", COMP.formater.fn(P_("formater", { gabarit: "{x.q}" }), { x: val({ q: 8 }) }).texte.v, "8");

  eq("Valider laisse passer", COMP.valider.fn(P_("valider", { cond: "x > 0" }), { x: val(3) }).ok.v, 3);
  ok("Valider refuse en anomalie", estAnomalie(COMP.valider.fn(P_("valider", { cond: "x > 0", motif: "négatif" }), { x: val(-3) }).refus));
  ok("le refus porte la valeur fautive", COMP.valider.fn(P_("valider", { cond: "x>0", motif: "négatif" }), { x: val(-3) }).refus.cause === -3);

  const pa = P_("aiguiller", { voies: "x > 100\nx > 10" });
  eq("Aiguiller : trois voies pour deux conditions", portsDe("aiguiller", pa, "s").join("|"), "voie 1|voie 2|autre");
  eq("Aiguiller prend la 1ʳᵉ vraie", Object.keys(COMP.aiguiller.fn(pa, { x: val(500) }))[0], "voie 1");
  eq("Aiguiller descend l'échelle", Object.keys(COMP.aiguiller.fn(pa, { x: val(50) }))[0], "voie 2");
  eq("Aiguiller tombe sur autre", Object.keys(COMP.aiguiller.fn(pa, { x: val(1) }))[0], "autre");
  eq("Filtrer garde", Object.keys(COMP.filtrer.fn(P_("filtrer", { garder: "x > 0" }), { x: val(1) }))[0], "gardé");
  eq("Filtrer jette", Object.keys(COMP.filtrer.fn(P_("filtrer", { garder: "x > 0" }), { x: val(-1) }))[0], "jeté");

  eq("Attendre : la durée est la latence", COMP.attendre.latence(P_("attendre", { duree: "250", gigueMs: "0" }), ctxNu({})), 250);
  const eL = {};
  eq("Limiteur : premier passage immédiat", COMP.limiteur.latence(P_("limiteur", { parSeconde: "4" }), ctxNu(eL, 0)), 0);
  eq("Limiteur : le suivant attend son créneau", COMP.limiteur.latence(P_("limiteur", { parSeconde: "4" }), ctxNu(eL, 0)), 250);

  const pf = P_("fusionner", { voies: "2", mode: "somme" });
  eq("Fusionner somme", COMP.fusionner.fn(pf, { a: val(2), b: val(3) }).z.v, 5);
  eq("Fusionner moyenne", COMP.fusionner.fn(P_("fusionner", { mode: "moyenne" }), { a: val(2), b: val(4) }).z.v, 3);
  eq("Fusionner concatène", COMP.fusionner.fn(P_("fusionner", { mode: "concaténer" }), { a: val("a"), b: val("b") }).z.v, "a b");
  eq("Fusionner en liste", JSON.stringify(COMP.fusionner.fn(P_("fusionner", { mode: "liste" }), { a: val(1), b: val(2) }).z.v), "[1,2]");
  ok("Fusionner : mode inconnu = anomalie, jamais un repli",
     estAnomalie(COMP.fusionner.fn(P_("fusionner", { mode: "moyenne harmonique" }), { a: val(1), b: val(2) }).z));
  ok("Fusionner transmet une anomalie reçue",
     estAnomalie(COMP.fusionner.fn(pf, { a: anomalie("bris"), b: val(3) }).z));
  eq("Fusionner : 4 entrées si demandé", portsDe("fusionner", P_("fusionner", { voies: "4" }), "e").join(""), "abcd");
  eq("Fusionner attend tout sauf en « première arrivée »",
     [attendTout(COMP.fusionner, P_("fusionner", { mode: "somme" })),
      attendTout(COMP.fusionner, P_("fusionner", { mode: "première arrivée" }))].join(","), "true,false");

  const ew = {};
  const w1 = COMP.fenetre.fn(P_("fenetre", { taille: "3" }), { x: val(1) }, ctxNu(ew));
  COMP.fenetre.fn(P_("fenetre", { taille: "3" }), { x: val(2) }, ctxNu(ew));
  const w3 = COMP.fenetre.fn(P_("fenetre", { taille: "3" }), { x: val(3) }, ctxNu(ew));
  eq("Fenêtre retient avant le compte", Object.keys(w1).length, 0);
  eq("Fenêtre livre le lot", JSON.stringify(w3.lot.v), "[1,2,3]");
  eq("Fenêtre repart à vide", ew.tampon.length, 0);

  const eacc = {};
  COMP.accumuler.fn(P_("accumuler", { depart: "0", expr: "acc + x" }), { x: val(5) }, ctxNu(eacc));
  eq("Accumuler cumule", COMP.accumuler.fn(P_("accumuler", { depart: "0", expr: "acc + x" }), { x: val(7) }, ctxNu(eacc)).acc.v, 12);
  const ec = {};
  COMP.compter.fn({}, { x: val(1) }, ctxNu(ec));
  eq("Compter compte", COMP.compter.fn({}, { x: val(1) }, ctxNu(ec)).n.v, 2);

  const es = {};
  COMP.stats.fn({}, { x: val(2) }, ctxNu(es));
  const st = COMP.stats.fn({}, { x: val(4) }, ctxNu(es)).stats.v;
  eq("Statistiques : compte", st.n, 2);
  eq("Statistiques : moyenne", st.moyenne, 3);
  eq("Statistiques : minimum", st.min, 2);
  eq("Statistiques : écart-type", st.ecart, 1);
  ok("Statistiques refuse le non-numérique",
     estAnomalie(COMP.stats.fn({}, { x: val("bonjour") }, ctxNu({})).stats));

  const pr = P_("reparer", { budget: "3", reussite: "100", usure: "0", attente: "100", remis: "9" });
  const er = {};
  const cr = ctxNu(er);
  const latr = COMP.reparer.latence(pr, cr);
  const rr = COMP.reparer.fn(pr, { anomalie: anomalie("bris") }, cr);
  eq("Réparer réussit du premier coup à 100 %", rr["réparé"].v, 9);
  eq("Réparer facture une seule tentative", latr, 100);
  const pr0 = P_("reparer", { budget: "0" });
  const cr0 = ctxNu({});
  COMP.reparer.latence(pr0, cr0);
  ok("Réparer sans budget épuise", estAnomalie(COMP.reparer.fn(pr0, { anomalie: anomalie("bris") }, cr0)["épuisé"]));
  const prN = P_("reparer", { budget: "4", reussite: "0", attente: "50" });
  const crN = ctxNu({});
  eq("Réparer à 0 % consomme tout le budget", COMP.reparer.latence(prN, crN), 200);

  const ed = {}, pd = P_("disjoncteur", { seuil: "2", repos: "500" });
  COMP.disjoncteur.fn(pd, { x: anomalie("1") }, ctxNu(ed, 0));
  COMP.disjoncteur.fn(pd, { x: anomalie("2") }, ctxNu(ed, 10));
  const dc = COMP.disjoncteur.fn(pd, { x: val(1) }, ctxNu(ed, 20));
  ok("Disjoncteur coupe après le seuil", estAnomalie(dc["coupé"]));
  const dr = COMP.disjoncteur.fn(pd, { x: val(1) }, ctxNu(ed, 900));
  eq("Disjoncteur se referme après le repos", dr["passé"].v, 1);
  eq("Disjoncteur remet son compteur à zéro", ed.suite, 0);

  ok("Refuser échoue toujours", estAnomalie(COMP.refuser.fn(P_("refuser", { motif: "non" }), { x: val(1) }).anomalie));
  const epa = ctxNu({});
  eq("Panne à 0 % laisse passer", COMP.panne.fn(P_("panne", { taux: "0" }), { x: val(1) }, epa).x.v, 1);
  ok("Panne à 100 % casse", estAnomalie(COMP.panne.fn(P_("panne", { taux: "100" }), { x: val(1) }, ctxNu({})).panne));

  const eso = {};
  COMP.sortie.fn({}, { x: val(1) }, ctxNu(eso));
  COMP.sortie.fn({}, { x: anomalie("bris") }, ctxNu(eso));
  eq("Sortie retient tout, anomalies comprises", eso.recu.length, 2);
  let vues = [];
  const ctxA = Object.assign(ctxNu({}), { assertion: (n, o, v) => vues.push([n, o, v]) });
  COMP.assertion.fn(P_("assertion", { cond: "x > 0", nom: "positif" }), { x: val(5) }, ctxA);
  COMP.assertion.fn(P_("assertion", { cond: "x > 0", nom: "positif" }), { x: val(-5) }, ctxA);
  eq("Assertion note vrai puis faux", vues.map(v => v[1]).join(","), "true,false");
  eq("Assertion laisse passer la valeur",
     COMP.assertion.fn(P_("assertion", { cond: "x > 0" }), { x: val(3) }, ctxA).x.v, 3);
  const esd = {};
  COMP.sonde.fn({}, { x: val(4) }, ctxNu(esd, 10));
  eq("Sonde trace la série", esd.serie[0].v, 4);

  /* ── le moteur de bout en bout ────────────────────────────────────── */
  G("Moteur");
  const Msimple = monte("t", [["source","S",0,0,{valeur:"5",type:"nombre"}],
                              ["fonction","F",0,0,{expr:"x*3"}],
                              ["sortie","O",0,0]],
                        [[0,"valeur",1,"x"],[1,"y",2,"x"]]);
  const R1 = executer(Msimple, { graine: 1 });
  eq("chaîne simple : la sortie reçoit", aff(R1.puits[Msimple.blocs[2].id][0]), "15");
  eq("aucune anomalie", R1.nAnomalies, 0);
  eq("le temps a avancé", R1.duree > 0, true);
  eq("des images ont été enregistrées", R1.images.length > 0, true);
  eq("rien ne reste en file", Object.values(R1.blocs).every(s => Object.values(s.buf).every(q => !q.length)), true);

  const R1b = executer(Msimple, { graine: 1 });
  eq("deux exécutions de même graine sont identiques",
     JSON.stringify(R1.jrn.map(l => l.txt)), JSON.stringify(R1b.jrn.map(l => l.txt)));

  const Msans = monte("t", [["fonction","F",0,0]], []);
  eq("sans source, le moteur le dit", executer(Msans).arret, "aucune source");

  const Mano = monte("t", [["source","S",0,0,{valeur:"abc",type:"nombre"}],
                           ["fonction","F",0,0,{expr:"x*2"}],
                           ["sortie","O",0,0]],
                     [[0,"valeur",1,"x"],[1,"y",2,"x"]]);
  const Rano = executer(Mano);
  ok("une anomalie traverse un bloc qui ne sait pas la traiter",
     estAnomalie(Rano.puits[Mano.blocs[2].id][0]));
  eq("elle arrive intacte", Rano.puits[Mano.blocs[2].id][0].v.includes("n'est pas un nombre"), true);
  ok("le journal signale la transmission sans traitement",
     Rano.jrn.some(l => /transmise sans traitement/.test(l.txt)));

  const Mval = monte("t", [["source","S",0,0,{valeur:"-2",type:"nombre"}],
                           ["valider","V",0,0,{cond:"x > 0",motif:"négatif"}],
                           ["sortie","OK",0,0],["rebut","KO",0,0]],
                     [[0,"valeur",1,"x"],[1,"ok",2,"x"],[1,"refus",3,"x"]]);
  const Rval = executer(Mval);
  eq("le refus part du bon port", Rval.puits[Mval.blocs[3].id].length, 1);
  eq("et rien ne passe par ok", Rval.puits[Mval.blocs[2].id].length, 0);

  const Mlat = monte("t", [["source","S",0,0],["attendre","A",0,0,{duree:"400"}],["sortie","O",0,0]],
                     [[0,"valeur",1,"x"],[1,"x",2,"x"]]);
  pres("la latence se retrouve dans la durée totale", executer(Mlat).duree, 400, 1);

  const Mfile = monte("t", [["generateur","G",0,0,{loi:"suite",n:"6",cadence:"10"}],
                            ["attendre","A",0,0,{duree:"200",_cap:"1"}],
                            ["sortie","O",0,0]],
                      [[0,"valeur",1,"x"],[1,"x",2,"x"]]);
  const Rfile = executer(Mfile);
  eq("six valeurs entrées, six sorties", Rfile.puits[Mfile.blocs[2].id].length, 6);
  ok("une file s'est formée derrière le goulot", Rfile.blocs[Mfile.blocs[1].id].fileMax >= 4);
  ok("le goulot impose son rythme", Rfile.duree >= 1200);

  const Mlim = monte("t", [["generateur","G",0,0,{loi:"suite",n:"4",cadence:"0"}],
                           ["limiteur","L",0,0,{parSeconde:"2"}],["sortie","O",0,0]],
                     [[0,"valeur",1,"x"],[1,"x",2,"x"]]);
  pres("le limiteur étale le débit", executer(Mlim).duree, 1500, 1);

  const Mcout = monte("t", [["source","S",0,0],["fonction","F",0,0,{_cout:"2.5"}],["sortie","O",0,0]],
                      [[0,"valeur",1,"x"],[1,"y",2,"x"]]);
  pres("le coût s'additionne", executer(Mcout).cout, 2.5, 1e-9);

  const Mperdu = monte("t", [["source","S",0,0],["valider","V",0,0,{cond:"x>0"}],["sortie","O",0,0]],
                       [[0,"valeur",1,"x"],[1,"ok",2,"x"]]);
  const Rperdu = executer(Mperdu);
  ok("un port non relié est signalé, pas ignoré",
     Rperdu.jrn.some(l => /n'est relié à rien/.test(l.txt)) || Rperdu.perdus === 0);

  const Mboucle = monte("t", [["source","S",0,0,{valeur:"1",type:"nombre"}],
                              ["fonction","F",0,0,{expr:"x+1",_lat:"0"}]],
                        [[0,"valeur",1,"x"],[1,"y",1,"x"]]);
  const Rb = executer(Mboucle, { limites: { evenements: 400 } });
  eq("une boucle sans fin est coupée", Rb.arret, "limite d'événements atteinte");
  ok("et le journal l'explique", Rb.jrn.some(l => /boucle probablement sans fin/.test(l.txt)));

  const Minc = { version: 2, blocs: [{ id:"x1", comp:"licorne", nom:"?", x:0, y:0, params:{} }],
                 liens: [], zones: [], forges: [], scenarios: [] };
  ok("un comportement inconnu est dénoncé", executer(Minc).jrn.some(l => /comportement inconnu/.test(l.txt)));

  const Mfus = monte("t", [["source","A",0,0,{valeur:"2",type:"nombre"}],
                           ["source","B",0,0,{valeur:"3",type:"nombre"}],
                           ["fusionner","F",0,0,{mode:"somme",voies:"2"}],
                           ["sortie","O",0,0]],
                     [[0,"valeur",2,"a"],[1,"valeur",2,"b"],[2,"z",3,"x"]]);
  eq("la fusion attend ses deux entrées", aff(executer(Mfus).puits[Mfus.blocs[3].id][0]), "5");

  const Mpan = monte("t", [["source","S",0,0],["fonction","F",0,0,{_panne:"100"}],["sortie","O",0,0]],
                     [[0,"valeur",1,"x"],[1,"y",2,"x"]]);
  ok("une panne universelle casse n'importe quel bloc",

const P_BLOC = { w: 184 };
function hauteurBloc(b){
  const n = Math.max(portsDe(b.comp, b.params, "e").length, portsDe(b.comp, b.params, "s").length, 1);
  return Math.max(74, 34 + n * 19);
}
function posPort(b, sens, i){
  const l = portsDe(b.comp, b.params, sens), n = l.length || 1, h = hauteurBloc(b);
  return { x: b.x + (sens === "s" ? P_BLOC.w : 0), y: b.y + 26 + (i + 1) * (h - 22) / (n + 1) };
}
const bloc = id => M.blocs.find(b => b.id === id);
const zone = id => (M.zones || []).find(z => z.id === id);

function idNeuf(p){ return p + (++seq); }

function nouveauBloc(comp, x, y){
  const b = { id: idNeuf("b"), comp, nom: (compDe(comp) || { nom: comp }).nom,
              x: Math.round(x), y: Math.round(y), params: defauts(comp) };
  M.blocs.push(b); return b;
}
function nouvelleZone(x, y){
  const z = { id: idNeuf("z"), nom: "Section", x: Math.round(x), y: Math.round(y),
              w: 440, h: 300, teinte: (M.zones || []).length % 6 };
  (M.zones ??= []).push(z); return z;
}

/* ───────────────────────────────────────────────────────────────────────────
   §13 · HISTORIQUE
   Chaque modification pousse une image du montage. Rien n'est jamais perdu
   par inadvertance.
   ─────────────────────────────────────────────────────────────────────────── */

const HIST = { pile: [], curseur: -1, max: 120 };

function instantane(){ return JSON.stringify({ M, seq }); }
function pousseHist(){
  const s = instantane();
  if (HIST.pile[HIST.curseur] === s) return;
  HIST.pile = HIST.pile.slice(0, HIST.curseur + 1);
  HIST.pile.push(s);
  if (HIST.pile.length > HIST.max) HIST.pile.shift();
  HIST.curseur = HIST.pile.length - 1;
  majBoutonsHist();
}
function restaure(s){
  const o = JSON.parse(s);
  M = o.M; seq = o.seq;
  chargeForges(M.forges);
  sel.clear(); selLien = null; selZone = null;
  dessine(); inspecteur(); panneaux();
}
function annuler(){ if (HIST.curseur > 0){ HIST.curseur--; restaure(HIST.pile[HIST.curseur]); majBoutonsHist(); pain("annulé"); } }
function retablir(){ if (HIST.curseur < HIST.pile.length - 1){ HIST.curseur++; restaure(HIST.pile[HIST.curseur]); majBoutonsHist(); pain("rétabli"); } }
function majBoutonsHist(){
  $("b-annuler").disabled = HIST.curseur <= 0;
  $("b-retablir").disabled = HIST.curseur >= HIST.pile.length - 1;
}
/** Enveloppe une modification : elle s'exécute, puis devient annulable. */
function modifie(f, redessine){
  const r = f();
  if (redessine !== false){ dessine(); inspecteur(); }
  panneaux();
  pousseHist(); sauve();
  return r;
}

const scene = $("scene"), svg = $("fils"), filsG = $("fils-g"), wrap = $("wrap");
let tirage = null;

function dessine(){
  scene.querySelectorAll(".bloc,.zone-s").forEach(e => e.remove());

  (M.zones || []).forEach(z => {

function corpsBloc(b, c){
  const v = vueRun.vals[b.id];
  const t = v ? typeDe(v) : null;
  return `<div class="tt"><span class="cmp" style="color:${c.coul}">${ech(c.nom)}</span>
      <span class="pastille"></span></div>
    <div class="nm" title="${ech(b.nom)}">${ech(b.nom)}</div>
    <div class="val ${t ? "c-" + t : ""}">${v ? ech(aff(v)) : "—"}</div>`;
}

function elPort(b, sens, i, nom){
  const q = posPort(b, sens, i);
  const d = document.createElement("div");
  const relie = M.liens.some(l => sens === "s"
    ? (l.de.b === b.id && indicePort(b, "s", l.de) === i)
    : (l.vers.b === b.id && indicePort(b, "e", l.vers) === i));
  d.className = "port " + sens + (relie ? " lie" : "");
  d.dataset.b = b.id; d.dataset.sens = sens; d.dataset.i = i;
  d.style.top = (q.y - b.y - 6) + "px";
  d.innerHTML = `<span class="etq">${ech(nom)}</span>`;
  return d;
}

/* ── routage orthogonal des fils ──────────────────────────────────────────
   Segments horizontaux et verticaux seulement. Deux cas : la cible est à
   droite (trajet en Z), ou à gauche — on contourne alors par le dessus ou par
   le dessous, en évitant les blocs. */
function boite(b){ return { x1: b.x - 14, y1: b.y - 14, x2: b.x + P_BLOC.w + 14, y2: b.y + hauteurBloc(b) + 14 }; }
function coupe(pts, exclus){
  const bs = M.blocs.filter(b => !exclus.includes(b.id)).map(boite);
  for (let i = 0; i < pts.length - 1; i++){
    const ax = Math.min(pts[i][0], pts[i+1][0]), bx = Math.max(pts[i][0], pts[i+1][0]);
    const ay = Math.min(pts[i][1], pts[i+1][1]), by = Math.max(pts[i][1], pts[i+1][1]);
    for (const r of bs) if (ax <= r.x2 && bx >= r.x1 && ay <= r.y2 && by >= r.y1) return true;
  }
  return false;
}
function route(a, z, bd, bv){
  const ex = bd ? [bd.id, bv.id] : [];
  if (z.x > a.x + 40){
    const mid = Math.round((a.x + z.x) / 2);
    const p = [[a.x, a.y], [mid, a.y], [mid, z.y], [z.x, z.y]];
    if (!bd || !coupe(p, ex)) return p;
  }
  const sortie = a.x + 30, entree = z.x - 30;
  const hauts = [bd ? bd.y : a.y, bv ? bv.y : z.y];
  const bas = [(bd ? bd.y + hauteurBloc(bd) : a.y), (bv ? bv.y + hauteurBloc(bv) : z.y)];
  const parHaut = Math.min(...hauts) - 34, parBas = Math.max(...bas) + 34;
  for (const y of (Math.abs(parHaut - a.y) <= Math.abs(parBas - a.y) ? [parHaut, parBas] : [parBas, parHaut])){
    const p = [[a.x, a.y], [sortie, a.y], [sortie, y], [entree, y], [entree, z.y], [z.x, z.y]];
    if (!bd || !coupe(p, ex)) return p;
  }
  return [[a.x, a.y], [sortie, a.y], [sortie, parBas], [entree, parBas], [entree, z.y], [z.x, z.y]];
}
/** Coins adoucis : chaque angle devient un petit arc. */
function chemin(pts, r){
  if (pts.length < 2) return "";
  const rr = r === undefined ? 7 : r;
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++){
    const [px, py] = pts[i-1], [cx, cy] = pts[i], [nx, ny] = pts[i+1];
    const d1 = Math.hypot(cx - px, cy - py), d2 = Math.hypot(nx - cx, ny - cy);
    const k = Math.min(rr, d1 / 2, d2 / 2);
    if (k < 1){ d += ` L${cx},${cy}`; continue; }
    const ax = cx - (cx - px) / (d1 || 1) * k, ay = cy - (cy - py) / (d1 || 1) * k;
    const bx = cx + (nx - cx) / (d2 || 1) * k, by = cy + (ny - cy) / (d2 || 1) * k;
    d += ` L${ax},${ay} Q${cx},${cy} ${bx},${by}`;
  }
  const f = pts[pts.length - 1];
  return d + ` L${f[0]},${f[1]}`;
}

function dessineFils(){
  let h = "";
  M.liens.forEach(L => {
    const bd = bloc(L.de.b), bv = bloc(L.vers.b);
    if (!bd || !bv) return;
    const is = indicePort(bd, "s", L.de), ie = indicePort(bv, "e", L.vers);
    if (is < 0 || ie < 0) return;
    const a = posPort(bd, "s", is), z = posPort(bv, "e", ie);
    const pts = route(a, z, bd, bv);
    const d = chemin(pts);
    const v = vueRun.liens[L.id];
    const cl = v !== undefined ? "passe" : "";
    const s = selLien === L.id ? " sel" : "";
    const t = v !== undefined ? typeDe(v) : null;
    h += `<path class="fil ${cl}${s}" d="${d}" id="F${L.id}"/>`;
    h += `<polygon class="tete ${cl}" points="${z.x-10},${z.y-4.5} ${z.x-10},${z.y+4.5} ${z.x-1},${z.y}"/>`;
    h += `<path class="fil zone" data-l="${L.id}" d="${d}"/>`;
    if (v !== undefined){
      const mi = pts[Math.floor(pts.length / 2)];
      const txt = aff(v);
      const court = txt.length > 22 ? txt.slice(0, 21) + "…" : txt;
      h += `<text class="jeton-txt c-${t}" x="${mi[0]}" y="${mi[1] - 8}" text-anchor="middle">${ech(court)}<title>${ech(txt)}</title></text>`;
    }
  });
  if (tirage){
    const pts = [[tirage.a.x, tirage.a.y], [tirage.b.x, tirage.b.y]];
    h += `<path class="fil fantome" d="${chemin(pts, 0)}"/>`;
  }
  filsG.innerHTML = h;
  filsG.querySelectorAll("[data-l]").forEach(p => p.onclick = e => {
    e.stopPropagation();
    selLien = p.dataset.l; sel.clear(); selZone = null;
    dessine(); inspecteur();
  });
}

/** Mise à jour légère pendant la lecture : pas de reconstruction du DOM. */
function rafraichitValeurs(){
  M.blocs.forEach(b => {
    const el = $("B" + b.id); if (!el) return;
    const v = vueRun.vals[b.id];
    const cell = el.querySelector(".val");
    if (cell){
      cell.textContent = v ? aff(v) : "—";
      cell.className = "val " + (v ? "c-" + typeDe(v) : "");
    }
    el.classList.toggle("court", vueRun.actifs.includes(b.id));
    let badge = el.querySelector(".file-n");
    const n = vueRun.files[b.id] || 0;
    if (n && !badge){ badge = document.createElement("div"); badge.className = "file-n"; el.appendChild(badge); }
    if (badge){ badge.textContent = n; badge.style.display = n ? "grid" : "none"; }
  });
}

function majEtatDoc(){
  const nz = (M.zones || []).length, nf = (M.forges || []).length;
  $("etat-doc").textContent = `« ${M.titre} »  ·  ` +
    `${M.blocs.length} bloc${M.blocs.length > 1 ? "s" : ""} · ${M.liens.length} lien${M.liens.length > 1 ? "s" : ""}`
    + (nz ? ` · ${nz} section${nz > 1 ? "s" : ""}` : "")
    + (nf ? ` · ${nf} forgé${nf > 1 ? "s" : ""}` : "");
}

function applique(){
  scene.style.transform = `translate(${vue.x}px,${vue.y}px) scale(${vue.z})`;
  /* Sous 80 % les noms de port deviennent illisibles et encombrent : on les retire. */
  scene.classList.toggle("muet", vue.z < 0.8);
  minicarte();
}

/* ── minicarte ───────────────────────────────────────────────────────────── */
function etendue(){
  if (!M.blocs.length && !(M.zones || []).length) return { x1:0, y1:0, x2:800, y2:500 };
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  M.blocs.forEach(b => { x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y);
                         x2 = Math.max(x2, b.x + P_BLOC.w); y2 = Math.max(y2, b.y + hauteurBloc(b)); });
  (M.zones || []).forEach(z => { x1 = Math.min(x1, z.x); y1 = Math.min(y1, z.y);
                                 x2 = Math.max(x2, z.x + z.w); y2 = Math.max(y2, z.y + z.h); });
  return { x1: x1 - 60, y1: y1 - 60, x2: x2 + 60, y2: y2 + 60 };
}
function minicarte(){
  const cv = $("mc"); if (!cv) return;
  const g = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  const st = getComputedStyle(document.documentElement);
  g.clearRect(0, 0, W, H);
  g.fillStyle = st.getPropertyValue("--surface-2") || "#eee";
  g.fillRect(0, 0, W, H);
  const e = etendue();
  const k = Math.min(W / (e.x2 - e.x1), H / (e.y2 - e.y1));
  const px = x => (x - e.x1) * k, py = y => (y - e.y1) * k;
  g.strokeStyle = st.getPropertyValue("--line-2") || "#ccc"; g.lineWidth = 1;
  M.liens.forEach(L => {
    const bd = bloc(L.de.b), bv = bloc(L.vers.b); if (!bd || !bv) return;
    g.beginPath();
    g.moveTo(px(bd.x + P_BLOC.w), py(bd.y + hauteurBloc(bd) / 2));
    g.lineTo(px(bv.x), py(bv.y + hauteurBloc(bv) / 2));
    g.stroke();
  });
  (M.zones || []).forEach(z => {
    g.strokeStyle = teinte(z.teinte) + "88";
    g.strokeRect(px(z.x), py(z.y), z.w * k, z.h * k);
  });
  M.blocs.forEach(b => {
    const c = compDe(b.comp) || { coul: "#B33A34" };
    g.fillStyle = c.coul.startsWith("var(") ? (st.getPropertyValue(c.coul.slice(4, -1)) || "#888") : c.coul;
    g.fillRect(px(b.x), py(b.y), Math.max(3, P_BLOC.w * k), Math.max(2, hauteurBloc(b) * k));
    if (sel.has(b.id)){
      g.strokeStyle = st.getPropertyValue("--accent") || "#0E7C86"; g.lineWidth = 1.5;
      g.strokeRect(px(b.x) - 1, py(b.y) - 1, P_BLOC.w * k + 2, hauteurBloc(b) * k + 2);
    }
  });
  const r = wrap.getBoundingClientRect();
  const vx1 = (-vue.x) / vue.z, vy1 = (-vue.y) / vue.z;
  const vx2 = vx1 + r.width / vue.z, vy2 = vy1 + r.height / vue.z;
  g.strokeStyle = st.getPropertyValue("--accent") || "#0E7C86"; g.lineWidth = 2;
  g.strokeRect(px(vx1), py(vy1), (vx2 - vx1) * k, (vy2 - vy1) * k);
}
$("mc").onpointerdown = e => {
  const cv = $("mc"), r = cv.getBoundingClientRect(), ee = etendue();
  const k = Math.min(cv.width / (ee.x2 - ee.x1), cv.height / (ee.y2 - ee.y1));
  const mx = (e.clientX - r.left) * (cv.width / r.width) / k + ee.x1;
  const my = (e.clientY - r.top) * (cv.height / r.height) / k + ee.y1;
  const w = wrap.getBoundingClientRect();
  vue.x = w.width / 2 - mx * vue.z; vue.y = w.height / 2 - my * vue.z;
  applique();
};

function ajusteVue(){
  const e = etendue(), r = wrap.getBoundingClientRect();
  /* Plancher volontaire : au-delà, les blocs deviennent des confettis. Mieux
     vaut ne pas tout voir et rester lisible — la minicarte sert à naviguer. */
  vue.z = Math.min(1.6, Math.max(.38, Math.min(r.width / (e.x2 - e.x1), r.height / (e.y2 - e.y1))));
  vue.x = (r.width - (e.x2 - e.x1) * vue.z) / 2 - e.x1 * vue.z;
  vue.y = (r.height - (e.y2 - e.y1) * vue.z) / 2 - e.y1 * vue.z;
  applique();
}
function centreSur(id){
  const b = bloc(id); if (!b) return;
  const r = wrap.getBoundingClientRect();
  vue.x = r.width / 2 - (b.x + P_BLOC.w / 2) * vue.z;
  vue.y = r.height / 2 - (b.y + hauteurBloc(b) / 2) * vue.z;
  applique();
}

/* ───────────────────────────────────────────────────────────────────────────
   §15 · INTERACTIONS
   ─────────────────────────────────────────────────────────────────────────── */

let glisse = null, cadrant = null;
const GRILLE = 12;
const aligne = v => Math.round(v / GRILLE) * GRILLE;

function pos(e){
  const r = wrap.getBoundingClientRect();
  return { x: (e.clientX - r.left - vue.x) / vue.z, y: (e.clientY - r.top - vue.y) / vue.z };
}
function deselectionne(){ sel.clear(); selLien = null; selZone = null; }

wrap.addEventListener("pointerdown", e => {
  if (e.button === 2) return;
  const port = e.target.closest(".port");
  if (port){
    e.preventDefault();
    const b = bloc(port.dataset.b), i = +port.dataset.i;
    if (port.dataset.sens === "s") tirage = { de: { b: b.id, i }, a: posPort(b, "s", i), b: pos(e) };
    else                           tirage = { vers: { b: b.id, i }, a: pos(e), b: posPort(b, "e", i) };
    wrap.classList.add("linking");
    wrap.setPointerCapture(e.pointerId);
    return;
  }

  const el = e.target.closest(".bloc");
  if (el){
    const b = bloc(el.id.slice(1));
    if (e.shiftKey || e.ctrlKey){ sel.has(b.id) ? sel.delete(b.id) : sel.add(b.id); }
    else if (!sel.has(b.id)){ sel.clear(); sel.add(b.id); }
    selLien = null; selZone = null;
    const p = pos(e);
    glisse = { type: "blocs", depart: p, bouge: 0,
               liste: [...sel].map(id => { const x = bloc(id); return { b: x, dx: p.x - x.x, dy: p.y - x.y }; }) };
    dessine(); inspecteur();
    return;
  }

  const ez = e.target.closest(".zone-s");
  if (ez){
    const z = zone(ez.id.slice(1));
    selZone = z.id; sel.clear(); selLien = null;
    const p = pos(e);
    glisse = e.target.classList.contains("poi")
      ? { type: "zone-redim", z, x0: p.x, y0: p.y, w0: z.w, h0: z.h, bouge: 0 }
      : { type: "zone", z, dx: p.x - z.x, dy: p.y - z.y, bouge: 0,
          blocs: M.blocs.filter(b => b.x >= z.x && b.y >= z.y &&
                 b.x + P_BLOC.w <= z.x + z.w && b.y + hauteurBloc(b) <= z.y + z.h)
                 .map(b => ({ b, dx: p.x - b.x, dy: p.y - b.y })) };
    dessine(); inspecteur();
    return;
  }

  if (e.shiftKey){
    cadrant = { x0: pos(e).x, y0: pos(e).y, x1: pos(e).x, y1: pos(e).y };
    wrap.classList.add("cadrant");
    wrap.setPointerCapture(e.pointerId);
    return;
  }

  glisse = { type: "pan", sx: e.clientX, sy: e.clientY, vx: vue.x, vy: vue.y, bouge: 0 };
  wrap.classList.add("grabbing");
});

document.addEventListener("pointermove", e => {
  if (tirage){
    const p = pos(e);
    if (tirage.de) tirage.b = p; else tirage.a = p;
    document.querySelectorAll(".port.cible").forEach(x => x.classList.remove("cible"));
    const c = document.elementFromPoint(e.clientX, e.clientY);
    const cp = c && c.closest ? c.closest(".port") : null;
    if (cp) cp.classList.add("cible");
    dessineFils();
    return;
  }
  if (cadrant){
    const p = pos(e); cadrant.x1 = p.x; cadrant.y1 = p.y;
    const c = $("cadre");
    const x = Math.min(cadrant.x0, cadrant.x1), y = Math.min(cadrant.y0, cadrant.y1);
    const w = Math.abs(cadrant.x1 - cadrant.x0), h = Math.abs(cadrant.y1 - cadrant.y0);
    c.style.display = "block";
    c.style.left = (x * vue.z + vue.x) + "px"; c.style.top = (y * vue.z + vue.y) + "px";
    c.style.width = (w * vue.z) + "px"; c.style.height = (h * vue.z) + "px";
    return;
  }
  if (!glisse) return;

  if (glisse.type === "pan"){
    glisse.bouge += Math.abs(e.movementX) + Math.abs(e.movementY);
    vue.x = glisse.vx + (e.clientX - glisse.sx); vue.y = glisse.vy + (e.clientY - glisse.sy);
    applique();
  } else if (glisse.type === "blocs"){
    const p = pos(e); glisse.bouge++;
    glisse.liste.forEach(({ b, dx, dy }) => {
      b.x = aligne(p.x - dx); b.y = aligne(p.y - dy);
      const el = $("B" + b.id);
      if (el){ el.style.left = b.x + "px"; el.style.top = b.y + "px"; }
    });
    dessineFils();
  } else if (glisse.type === "zone"){
    const p = pos(e); glisse.bouge++;
    const z = glisse.z;
    z.x = aligne(p.x - glisse.dx); z.y = aligne(p.y - glisse.dy);
    const el = $("Z" + z.id);
    if (el){ el.style.left = z.x + "px"; el.style.top = z.y + "px"; }
    glisse.blocs.forEach(({ b, dx, dy }) => {
      b.x = aligne(p.x - dx); b.y = aligne(p.y - dy);
      const eb = $("B" + b.id);
      if (eb){ eb.style.left = b.x + "px"; eb.style.top = b.y + "px"; }
    });
    dessineFils();
  } else if (glisse.type === "zone-redim"){
    const p = pos(e); glisse.bouge++;
    const z = glisse.z;
    z.w = Math.max(150, aligne(glisse.w0 + p.x - glisse.x0));
    z.h = Math.max(120, aligne(glisse.h0 + p.y - glisse.y0));
    const el = $("Z" + z.id);
    if (el){ el.style.width = z.w + "px"; el.style.height = z.h + "px"; }
  }
});

document.addEventListener("pointerup", e => {
  if (tirage){
    const c = document.elementFromPoint(e.clientX, e.clientY);
    const cp = c && c.closest ? c.closest(".port") : null;
    if (cp){
      const autre = { b: cp.dataset.b, i: +cp.dataset.i, sens: cp.dataset.sens };
      const de   = tirage.de   || (autre.sens === "s" ? { b: autre.b, i: autre.i } : null);
      const vers = tirage.vers || (autre.sens === "e" ? { b: autre.b, i: autre.i } : null);
      if (de && vers && de.b !== vers.b){
        const bd = bloc(de.b), bv = bloc(vers.b);
        de.p = portsDe(bd.comp, bd.params, "s")[de.i];
        vers.p = portsDe(bv.comp, bv.params, "e")[vers.i];
        const doublon = M.liens.some(l => l.de.b === de.b && l.de.i === de.i &&
                                          l.vers.b === vers.b && l.vers.i === vers.i);
        if (doublon) pain("ce lien existe déjà");
        else modifie(() => { M.liens.push({ id: idNeuf("l"), de, vers });
                             pain(`${bd.nom} → ${bv.nom}`, "ok"); });
      } else if (de && vers && de.b === vers.b){
        pain("un bloc ne peut pas se relier à lui-même", "err");
      }
    }
    tirage = null; wrap.classList.remove("linking");
    document.querySelectorAll(".port.cible").forEach(x => x.classList.remove("cible"));
    dessine();
    return;
  }
  if (cadrant){
    const x1 = Math.min(cadrant.x0, cadrant.x1), y1 = Math.min(cadrant.y0, cadrant.y1);
    const x2 = Math.max(cadrant.x0, cadrant.x1), y2 = Math.max(cadrant.y0, cadrant.y1);
    if (!e.ctrlKey) sel.clear();
    M.blocs.forEach(b => {
      if (b.x + P_BLOC.w > x1 && b.x < x2 && b.y + hauteurBloc(b) > y1 && b.y < y2) sel.add(b.id);
    });
    cadrant = null; wrap.classList.remove("cadrant"); $("cadre").style.display = "none";
    dessine(); inspecteur();
    return;
  }
  if (glisse){
    if (glisse.type === "pan" && glisse.bouge < 4){ deselectionne(); dessine(); inspecteur(); }
    else if (glisse.bouge > 0 && glisse.type !== "pan"){ pousseHist(); sauve(); }
    glisse = null; wrap.classList.remove("grabbing");
    dessine();
  }
});

wrap.addEventListener("wheel", e => {
  e.preventDefault();
  const r = wrap.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const av = vue.z;
  vue.z = Math.min(2.4, Math.max(.18, vue.z * (e.deltaY < 0 ? 1.12 : 0.893)));
  vue.x = mx - (mx - vue.x) * (vue.z / av);
  vue.y = my - (my - vue.y) * (vue.z / av);
  applique();
}, { passive: false });

/* ── clavier ─────────────────────────────────────────────────────────────── */
const dansChamp = e => ["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName) || e.target.isContentEditable;

addEventListener("keydown", e => {
  /* Raccourcis actifs même dans un champ */
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); ouvreCommandes(); return; }
  if (e.key === "Escape"){
    if (fermeVoiles()) { e.preventDefault(); return; }
    if (tirage){ tirage = null; wrap.classList.remove("linking"); dessineFils(); return; }
  }
  if (dansChamp(e)) return;

  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && e.key.toLowerCase() === "z" && !e.shiftKey){ e.preventDefault(); annuler(); return; }
  if (ctrl && (e.key.toLowerCase() === "y" || (e.key.toLowerCase() === "z" && e.shiftKey))){ e.preventDefault(); retablir(); return; }
  if (ctrl && e.key.toLowerCase() === "a"){ e.preventDefault(); sel = new Set(M.blocs.map(b => b.id)); dessine(); inspecteur(); return; }
  if (ctrl && e.key.toLowerCase() === "c"){ copie(); return; }
  if (ctrl && e.key.toLowerCase() === "v"){ colle(); return; }
  if (ctrl && e.key.toLowerCase() === "d"){ e.preventDefault(); duplique(); return; }
  if (ctrl && e.key.toLowerCase() === "r"){ e.preventDefault(); range(); return; }
  if (ctrl && e.key.toLowerCase() === "s"){ e.preventDefault(); enregistreFichier(); return; }
  if (ctrl && e.key === "0"){ e.preventDefault(); ajusteVue(); return; }
  if (ctrl && e.key === "Enter"){ e.preventDefault(); execute(true); return; }
  if (e.shiftKey && e.key === "Enter"){ e.preventDefault(); execute(false); return; }

  if (e.key === "Delete" || e.key === "Backspace"){ e.preventDefault(); supprimeSelection(); return; }
  if (e.key === " "){ e.preventDefault(); basculeLecture(); return; }
  if (e.key === "ArrowRight" && R){ e.preventDefault(); vaEtape(lecture.i + 1); return; }
  if (e.key === "ArrowLeft" && R){ e.preventDefault(); vaEtape(lecture.i - 1); return; }
  if (e.key === "?" || (e.shiftKey && e.key === "/")){ e.preventDefault(); ouvreAide(); return; }

  /* Déplacement au clavier des blocs sélectionnés */
  const fleches = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0] };
  if (fleches[e.key] && sel.size){
    e.preventDefault();
    const [dx, dy] = fleches[e.key], pas = e.shiftKey ? GRILLE * 4 : GRILLE;
    modifie(() => sel.forEach(id => { const b = bloc(id); b.x += dx * pas; b.y += dy * pas; }));
  }
});

function supprimeSelection(){
  if (selZone){ modifie(() => { M.zones = M.zones.filter(x => x.id !== selZone); selZone = null; }); return; }
  if (selLien){ modifie(() => { M.liens = M.liens.filter(x => x.id !== selLien); selLien = null; }); return; }
  if (sel.size){
    const n = sel.size;
    modifie(() => {
      M.liens = M.liens.filter(l => !sel.has(l.de.b) && !sel.has(l.vers.b));
      M.blocs = M.blocs.filter(b => !sel.has(b.id));
      sel.clear();
    });
    pain(`${n} bloc(s) supprimé(s)`);
  }
}

function copie(){
  if (!sel.size) return;
  const blocs = M.blocs.filter(b => sel.has(b.id));
  const liens = M.liens.filter(l => sel.has(l.de.b) && sel.has(l.vers.b));
  presse = JSON.parse(JSON.stringify({ blocs, liens }));
  pain(`${blocs.length} bloc(s) copié(s)`);
}
function colle(){
  if (!presse) return;
  modifie(() => {
    const carte = {};
    deselectionne();
    presse.blocs.forEach(b => {
      const n = { id: idNeuf("b"), comp: b.comp, nom: b.nom, x: b.x + 40, y: b.y + 40,
                  params: Object.assign({}, b.params) };
      carte[b.id] = n.id; M.blocs.push(n); sel.add(n.id);
    });
    presse.liens.forEach(l => M.liens.push({ id: idNeuf("l"),
      de: { b: carte[l.de.b], i: l.de.i, p: l.de.p }, vers: { b: carte[l.vers.b], i: l.vers.i, p: l.vers.p } }));
  });
  pain("collé");
}
function duplique(){ copie(); colle(); }

/* ── rangement automatique : par vagues, colonne par colonne ─────────────── */
function range(){
  if (!M.blocs.length) return;
  modifie(() => {
    const rang = vagues(M);
    const colonnes = {};
    M.blocs.forEach(b => (colonnes[rang[b.id]] ??= []).push(b));
    const cles = Object.keys(colonnes).map(Number).sort((a, b) => a - b);
    let x = 80;
    cles.forEach(c => {
      const l = colonnes[c];
      /* Dans une colonne, on garde l'ordre vertical existant : le rangement
         ne doit pas mélanger ce que l'utilisateur a déjà organisé. */
      l.sort((a, b) => a.y - b.y);
      let y = 120;
      l.forEach(b => { b.x = x; b.y = y; y += hauteurBloc(b) + 46; });
      x += P_BLOC.w + 110;
    });
  });
  ajusteVue();
  pain("montage rangé par vagues");
}

function dessinePalette(){
  const q = ($("rech-pal").value || "").trim().toLowerCase();
  const corr = (cle, c) => !q || (c.nom + " " + c.aide + " " + cle + " " + c.cat).toLowerCase().includes(q);
  const tous = Object.keys(COMP).map(k => [k, COMP[k]])
    .concat([...FORGES.keys()].map(k => [k, FORGES.get(k)]));
  const parCat = {};
  tous.forEach(([k, c]) => { if (corr(k, c)) (parCat[c.cat] ??= []).push([k, c]); });

  let h = "";
  CAT.concat(["Forgés"]).forEach(cat => {
    const l = parCat[cat]; if (!l || !l.length) return;
    h += `<div class="pal-groupe">${cat}</div>`;
    l.forEach(([k, c]) => {
      h += `<button class="item" data-c="${ech(k)}" draggable="true" title="${ech(c.aide)}">
        <span class="ic" style="background:${c.coul}">${ech(c.ic)}</span>
        <span>${ech(c.nom)}<small>${ech(c.aide)}</small></span></button>`;
    });
  });
  if (!q){
    h += `<div class="pal-groupe">Documenter</div>
      <button class="item" data-c="__zone" draggable="true">
        <span class="ic" style="background:var(--abst)">▭</span>
        <span>Encadré de section<small>Regroupe des blocs pour expliquer. N'influe pas sur l'exécution.</small></span></button>
      <button class="item" data-c="__forge">
        <span class="ic" style="background:var(--texte)">✎</span>
        <span>Forger un bloc<small>Écrire son propre comportement : ports, réglages, code.</small></span></button>`;
  }
  if (!h) h = `<p class="vide" style="padding:8px">Aucun bloc ne correspond à « ${ech(q)} ».</p>`;
  $("pal").innerHTML = h;

  $("pal").querySelectorAll("button.item").forEach(b => {
    const c = b.dataset.c;
    b.onclick = () => {
      if (c === "__forge") return ouvreForge(null);
      const r = wrap.getBoundingClientRect();
      const x = (r.width / 2 - vue.x) / vue.z, y = (r.height / 2 - vue.y) / vue.z;
      modifie(() => {
        deselectionne();
        if (c === "__zone"){ selZone = nouvelleZone(x - 220, y - 150).id; }
        else {
          const nb_ = nouveauBloc(c, aligne(x - P_BLOC.w / 2 + (Math.random() * 60 - 30)),
                                     aligne(y - 36 + (Math.random() * 60 - 30)));
          sel.add(nb_.id);
        }
      });
    };
    b.ondragstart = e => { e.dataTransfer.setData("text/atelier", c); e.dataTransfer.effectAllowed = "copy"; };
  });
}
$("rech-pal").oninput = dessinePalette;

/* ── inspecteur ──────────────────────────────────────────────────────────── */
function inspecteur(){
  const f = $("v-bloc");

  if (selLien){
    const L = M.liens.find(x => x.id === selLien);
    if (!L){ selLien = null; return inspecteur(); }
    const bd = bloc(L.de.b), bv = bloc(L.vers.b);
    const ps = bd ? portsDe(bd.comp, bd.params, "s")[indicePort(bd, "s", L.de)] : "?";
    const pe = bv ? portsDe(bv.comp, bv.params, "e")[indicePort(bv, "e", L.vers)] : "?";
    const T = typesStatiques(M);
    const t = bd ? (T.sortie[bd.id + "|" + ps] || "quelconque") : "quelconque";
    const passe = R && R.liens[L.id] ? R.liens[L.id] : null;
    f.innerHTML = `
      <div class="enttete"><span class="ic" style="background:var(--ink-3)">→</span>
        <div><div class="t">Un fil</div><div class="s">${ech(bd ? bd.nom : "?")} → ${ech(bv ? bv.nom : "?")}</div></div></div>
      <table class="tb">
        <tr><th>Part de</th><td class="mono">${ech(ps)}</td></tr>
        <tr><th>Arrive sur</th><td class="mono">${ech(pe)}</td></tr>
        <tr><th>Type porté</th><td><span class="puce c-${t}">${t}</span></td></tr>
        ${passe ? `<tr><th>Passages</th><td class="mono">${passe.n}</td></tr>
                   <tr><th>Dernière valeur</th><td class="mono">${ech(passe.dernier ? aff(passe.dernier) : "—")}</td></tr>` : ""}
      </table>
      <button class="btn sm danger" id="del-lien" style="width:100%;margin-top:11px">Couper ce fil</button>`;
    $("del-lien").onclick = () => modifie(() => { M.liens = M.liens.filter(x => x.id !== selLien); selLien = null; });
    return;
  }

  if (selZone){
    const z = zone(selZone);
    if (!z){ selZone = null; return inspecteur(); }
    f.innerHTML = `
      <div class="enttete"><span class="ic" style="background:${teinte(z.teinte)}">▭</span>
        <div><div class="t">Encadré de section</div><div class="s">Purement documentaire</div></div></div>
      <div class="champ"><label>Titre</label><input id="z-nom" value="${ech(z.nom)}"></div>
      <div class="champ"><label>Couleur</label>
        <div style="display:flex;gap:5px">${TEINTES.map((_, i) =>
          `<button data-t="${i}" style="flex:1;height:26px;border-radius:5px;cursor:pointer;
            border:2px solid ${i === z.teinte ? "var(--accent)" : "transparent"};background:${teinte(i)}"></button>`).join("")}</div></div>
      <div class="grille2">
        <div class="champ"><label>Largeur</label><input id="z-w" type="number" value="${z.w}"></div>
        <div class="champ"><label>Hauteur</label><input id="z-h" type="number" value="${z.h}"></div>
      </div>
      <p class="vide">Déplacer l'encadré déplace les blocs qu'il contient. Il n'entre jamais dans l'exécution : il explique.</p>
      <button class="btn sm danger" id="z-del" style="width:100%;margin-top:9px">Supprimer la section</button>`;
    $("z-nom").oninput = e => { z.nom = e.target.value; dessine(); sauve(); };
    $("z-w").oninput = e => { z.w = Math.max(150, nb(e.target.value, z.w)); dessine(); sauve(); };
    $("z-h").oninput = e => { z.h = Math.max(120, nb(e.target.value, z.h)); dessine(); sauve(); };
    f.querySelectorAll("[data-t]").forEach(b => b.onclick = () => modifie(() => z.teinte = +b.dataset.t));
    $("z-del").onclick = () => modifie(() => { M.zones = M.zones.filter(x => x.id !== selZone); selZone = null; });
    return;
  }

  if (sel.size > 1){
    f.innerHTML = `<div class="enttete"><span class="ic" style="background:var(--accent)">${sel.size}</span>
        <div><div class="t">${sel.size} blocs sélectionnés</div><div class="s">Actions groupées</div></div></div>
      <div class="rang"><button class="btn sm" id="m-dup">Dupliquer</button>
        <button class="btn sm" id="m-zone">Encadrer</button>
        <button class="btn sm danger" id="m-del">Supprimer</button></div>
      <p class="vide" style="margin-top:10px">Les flèches déplacent la sélection d'un pas de grille ;
        <span class="k">Maj</span> + flèche pour quatre pas.</p>`;
    $("m-dup").onclick = duplique;
    $("m-del").onclick = supprimeSelection;
    $("m-zone").onclick = () => modifie(() => {
      const bs = M.blocs.filter(b => sel.has(b.id));
      const x1 = Math.min(...bs.map(b => b.x)) - 34, y1 = Math.min(...bs.map(b => b.y)) - 42;
      const x2 = Math.max(...bs.map(b => b.x + P_BLOC.w)) + 34;
      const y2 = Math.max(...bs.map(b => b.y + hauteurBloc(b))) + 34;
      const z = nouvelleZone(x1, y1); z.w = x2 - x1; z.h = y2 - y1;
      deselectionne(); selZone = z.id;
    });
    return;
  }

  const id = [...sel][0];
  if (!id){ vueMontage(f); return; }
  const b = bloc(id);
  if (!b){ sel.clear(); return inspecteur(); }
  const c = compDe(b.comp);
  if (!c){
    f.innerHTML = `<div class="carte err"><div class="tt">Comportement inconnu</div>
      <div class="ds">Ce bloc utilise « <span class="mono">${ech(b.comp)}</span> », qui n'existe pas ici.
      Il vient sans doute d'un montage qui contenait un bloc forgé.</div></div>
      <button class="btn sm danger" id="del" style="width:100%">Supprimer ce bloc</button>`;
    $("del").onclick = supprimeSelection;
    return;
  }

  const st = R && R.blocs[b.id] ? R.blocs[b.id] : null;
  const T = typesStatiques(M);
  const soucis = verifieCode(b);

  let h = `<div class="enttete"><span class="ic" style="background:${c.coul}">${ech(c.ic)}</span>
      <div><div class="t">${ech(c.nom)}</div><div class="s">${ech(c.cat)}${c.forge ? " · forgé" : ""}</div></div>
      ${c.forge ? `<button class="btn sm plat" id="edite-forge" title="Modifier ce bloc forgé">✎</button>` : ""}</div>
    <div class="champ"><label>Nom sur le canevas</label><input id="p-nom" value="${ech(b.nom)}"></div>
    <p class="vide" style="margin:-4px 0 12px">${c.aide}</p>`;

  (c.params || []).forEach(p => {
    const v = b.params[p.k] ?? p.d;
    const err = soucis.find(s => s.k === p.k);
    h += champHTML(p, v, err);
  });

  h += `<details class="repli"><summary>Temps, coût, capacité, panne</summary><div class="dedans">
    ${PARAMS_AVANCES.map(p => {
      const d = p.k === "_lat" ? String(c.lat ?? 0) : p.d;
      return champHTML(Object.assign({}, p, { d }), b.params[p.k] ?? d, null);
    }).join("")}
    </div></details>`;

  const pe = portsDe(b.comp, b.params, "e"), ps = portsDe(b.comp, b.params, "s");
  h += `<div class="h2">Ports</div><table class="tb">
    ${pe.map(p => `<tr><th>entrée</th><td class="mono">${ech(p)}</td>
      <td><span class="puce c-${T.entree[b.id + "|" + p] || "quelconque"}">${T.entree[b.id + "|" + p] || "quelconque"}</span></td></tr>`).join("")}
    ${ps.map(p => `<tr><th>sortie</th><td class="mono">${ech(p)}</td>
      <td><span class="puce c-${T.sortie[b.id + "|" + p] || "quelconque"}">${T.sortie[b.id + "|" + p] || "quelconque"}</span></td></tr>`).join("")}
    ${!pe.length && !ps.length ? `<tr><td class="vide">aucun port</td></tr>` : ""}</table>`;

  if (st){
    const occ = R.duree ? Math.round(st.tOccupe / R.duree * 100) : 0;
    h += `<div class="h2">Dernière exécution</div>
      <div class="tuiles">
        <div class="tuile"><div class="v">${st.n}</div><div class="l">passages</div></div>
        <div class="tuile"><div class="v">${st.nAno}</div><div class="l">anomalies</div></div>
        <div class="tuile"><div class="v">${occ} %</div><div class="l">occupation</div></div>
        <div class="tuile"><div class="v">${st.fileMax}</div><div class="l">file max</div></div>
        ${st.cout ? `<div class="tuile"><div class="v">${Math.round(st.cout * 100) / 100}</div><div class="l">coût</div></div>` : ""}
      </div>`;
    if (st.etat.serie && st.etat.serie.length) h += sparkline(st.etat.serie);
    if (st.etat.recu && st.etat.recu.length)
      h += `<div class="carte info"><div class="tt">Reçu (${st.etat.recu.length})</div>
        <div class="ds mono">${st.etat.recu.slice(-14).map(v => ech(aff(v))).join("<br>")}</div></div>`;
  }

  h += `<div class="rang" style="margin-top:12px">
      <button class="btn sm" id="dup">Dupliquer</button>
      <button class="btn sm danger" id="del">Supprimer</button></div>`;
  f.innerHTML = h;

  $("p-nom").oninput = e => { b.nom = e.target.value; const el = $("B" + b.id);
    if (el) el.querySelector(".nm").textContent = b.nom; majEtatDoc(); sauve(); };
  f.querySelectorAll("[data-k]").forEach(el => {
    const maj = () => {
      b.params[el.dataset.k] = el.type === "checkbox" ? String(el.checked) : el.value;
      /* Certains réglages changent le nombre de ports : il faut redessiner. */
      const structurel = ["voies", "mode"].includes(el.dataset.k);
      if (structurel){ dessine(); inspecteur(); }
      else { dessineFils(); }
      panneaux(); sauve();
    };
    el.oninput = maj;
    el.onchange = maj;
    el.onblur = () => pousseHist();
  });
  const ef = $("edite-forge"); if (ef) ef.onclick = () => ouvreForge(c.def);
  $("dup").onclick = duplique;
  $("del").onclick = supprimeSelection;
}

/** Quand rien n'est sélectionné, l'inspecteur montre le montage lui-même :
 *  ce qu'il contient, par où ça entre, par où ça sort, et ce qu'a donné la
 *  dernière exécution. Un panneau vide serait une occasion perdue. */
function vueMontage(f){
  const sources = M.blocs.filter(b => compDe(b.comp) && !portsDe(b.comp, b.params, "e").length);
  const puits = M.blocs.filter(b => (compDe(b.comp) || {}).puits);
  const parCat = {};
  M.blocs.forEach(b => { const c = compDe(b.comp); if (c) (parCat[c.cat] ??= []).push(b); });
  const D = diagnostics(M);
  const nErr = D.filter(d => d.niveau === "err").length;
  const nWarn = D.filter(d => d.niveau === "warn").length;

  f.innerHTML = `
    <div class="enttete"><span class="ic" style="background:var(--accent)">◧</span>
      <div style="flex:1"><div class="t">${ech(M.titre)}</div>
        <div class="s">${M.blocs.length} blocs · ${M.liens.length} liens</div></div>
      <button class="btn sm plat" id="vm-nom" title="Renommer">✐</button></div>

    <div class="tuiles">
      <div class="tuile"><div class="v">${sources.length}</div><div class="l">source${sources.length > 1 ? "s" : ""}</div></div>
      <div class="tuile"><div class="v">${puits.length}</div><div class="l">puits</div></div>
      <div class="tuile"><div class="v" style="color:${nErr ? "var(--crit)" : nWarn ? "var(--warn)" : "var(--ok)"}">${nErr || nWarn || "✓"}</div>
        <div class="l">${nErr ? "à corriger" : nWarn ? "à surveiller" : "rien à signaler"}</div></div>
    </div>

    ${R ? `<div class="h2">Dernière exécution</div>
      <div class="tuiles">
        <div class="tuile"><div class="v">${Math.round(R.duree)}</div><div class="l">ms simulées</div></div>
        <div class="tuile"><div class="v">${R.nJetons}</div><div class="l">valeurs</div></div>
        <div class="tuile"><div class="v" style="color:${R.nAnomalies ? "var(--crit)" : "inherit"}">${R.nAnomalies}</div><div class="l">anomalies</div></div>

function champHTML(p, v, err){

/** Petite courbe des valeurs vues par une sonde. */
function sparkline(serie){
  const pts = serie.filter(s => s.v !== null);
  if (pts.length < 2) return "";
  const xs = pts.map(s => s.t), ys = pts.map(s => s.v);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const W = 280, H = 56;
  const px = x => (x1 === x0 ? W / 2 : (x - x0) / (x1 - x0) * (W - 8) + 4);
  const py = y => (y1 === y0 ? H / 2 : H - 6 - (y - y0) / (y1 - y0) * (H - 14));
  const d = pts.map((s, i) => (i ? "L" : "M") + px(s.t).toFixed(1) + "," + py(s.v).toFixed(1)).join(" ");
  return `<div class="carte info"><div class="tt">Série observée</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;margin-top:5px">
      <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.8"/>
      ${pts.map(s => `<circle cx="${px(s.t).toFixed(1)}" cy="${py(s.v).toFixed(1)}" r="2" fill="var(--accent)"/>`).join("")}
    </svg>
    <div class="ds mono">min ${affBrut(y0)} · max ${affBrut(y1)} · ${pts.length} valeurs</div></div>`;
}

function verifieScenarios(){
  if (!(M.scenarios || []).length){ pain("aucun scénario à vérifier", "err"); return; }
  const r = verifieTous(M);
  dernierScen = {};
  r.resultats.forEach(x => dernierScen[x.id] = x);
  dessineScenarios();
  vaOnglet("v-scen");
  const vides = r.resultats.filter(x => x.vide).length;
  const juges = r.total - vides;
  pain(`${r.reussis}/${juges} scénario(s) vert(s)` + (vides ? ` · ${vides} sans aucune attente` : ""),
       vides === r.total ? "" : r.reussis === juges ? "ok" : "err");
}

      <div class="ds">Occupé ${Math.round(goulot.occ * 100)} % du temps, file jusqu'à ${goulot.s.fileMax}.

let jrnNiveau = "tout", jrnJusqua;
function dessineJournal(jusqua){
  const j = $("jrn");
  if (arguments.length) jrnJusqua = jusqua;
  if (!R){ j.innerHTML = `<div class="gris">Prêt. Appuie sur ▶ Exécuter.</div>`;
           $("jrn-n").textContent = ""; return; }
  const n = jrnJusqua === undefined ? R.jrn.length : jrnJusqua;
  const q = ($("jrn-filtre").value || "").trim().toLowerCase();
  const garde = l =>
    (jrnNiveau === "tout" || (jrnNiveau === "err" ? l.cls === "err" || l.cls === "warn"
                                                  : l.cls === "ok" || l.cls === "err" || l.cls === "warn"))
    && (!q || l.txt.toLowerCase().includes(q));
  const lignes = R.jrn.slice(0, n).filter(garde);
  /* Une seule ligne par entrée : « white-space:pre-wrap » rendrait visible le
     moindre retour à la ligne du gabarit. */
  j.innerHTML = lignes.length
    ? lignes.map(l => `<div class="${l.cls}${l.bloc ? " clic" : ""}"${l.bloc ? ` data-b="${l.bloc}"` : ""}>` +
        `<span class="t">${String(Math.round(l.t)).padStart(6)} ms</span>  ${surligne(l.txt, q)}</div>`).join("")
    : `<div class="gris">Aucune ligne ne correspond.</div>`;
  $("jrn-n").textContent = `${lignes.length}/${n} ligne(s)`;
  j.querySelectorAll("[data-b]").forEach(el => el.onclick = () => {
    deselectionne(); sel.add(el.dataset.b); dessine(); inspecteur(); centreSur(el.dataset.b); });
  if (q === "" && jrnNiveau === "tout") j.scrollTop = j.scrollHeight;
}
function surligne(txt, q){
  if (!q) return ech(txt);
  const i = txt.toLowerCase().indexOf(q);
  if (i < 0) return ech(txt);
  return ech(txt.slice(0, i)) + "<mark>" + ech(txt.slice(i, i + q.length)) + "</mark>" + ech(txt.slice(i + q.length));
}
$("jrn-filtre").oninput = () => dessineJournal();
$("jrn-copie").onclick = () => copiePressePapier(
  R ? R.jrn.map(l => String(Math.round(l.t)).padStart(6) + " ms  " + l.txt).join("\n") : "",
  "journal copié");
document.querySelectorAll("[data-niv]").forEach(b => b.onclick = () => {
  jrnNiveau = b.dataset.niv;
  document.querySelectorAll("[data-niv]").forEach(x => x.classList.toggle("active", x === b));
  dessineJournal();
});

/* ── chronologie ─────────────────────────────────────────────────────────── */
function dessineChrono(){
  const c = $("chrono");
  if (!R || !R.taches.length){ c.innerHTML = `<p class="vide" style="padding:10px">
    Exécute le montage : chaque bloc laissera ici la trace de ses traitements dans le temps.</p>`; return; }
  const ids = [...new Set(R.taches.map(t => t.bloc))];
  const hL = 21, marge = 168, W = Math.max(560, c.clientWidth - 30), H = ids.length * hL + 34;
  const tmax = Math.max(1, R.duree);
  const px = t => marge + t / tmax * (W - marge - 16);
  let h = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for (let i = 0; i <= 6; i++){
    const t = tmax * i / 6;
    h += `<line class="ax" x1="${px(t)}" y1="18" x2="${px(t)}" y2="${H - 12}"/>
          <text class="axt" x="${px(t)}" y="12" text-anchor="middle">${Math.round(t)} ms</text>`;
  }
  ids.forEach((id, i) => {
    const b = bloc(id), cc = compDe(b ? b.comp : "") || { coul: "var(--ink-3)" };
    const y = 22 + i * hL;
    h += `<rect class="fond" x="${marge}" y="${y}" width="${W - marge - 16}" height="${hL - 4}" rx="2"/>`;
    h += `<text class="lig" x="4" y="${y + hL / 2 + 1}">${ech((b ? b.nom : id).slice(0, 24))}</text>`;
    R.taches.filter(t => t.bloc === id).forEach(t => {
      const x1 = px(t.t0), x2 = Math.max(px(t.t1), px(t.t0) + 2.5);
      h += `<rect class="barre" x="${x1.toFixed(1)}" y="${y + 1}" width="${(x2 - x1).toFixed(1)}"
              height="${hL - 6}" fill="${cc.coul}" opacity=".82"><title>${ech(b ? b.nom : id)} · ${Math.round(t.t0)}→${Math.round(t.t1)} ms</title></rect>`;
    });
  });
  h += `</svg>`;
  c.innerHTML = h;
}

/* ───────────────────────────────────────────────────────────────────────────
   §18 · EXÉCUTION ET LECTURE
   L'exécution se fait d'un trait et s'enregistre. Ce qu'on regarde ensuite
   n'est pas le calcul : c'est sa relecture. D'où le retour en arrière, le pas
   à pas et la vitesse réglable, sans rien changer au moteur.
   ─────────────────────────────────────────────────────────────────────────── */

function execute(anime){
  arreteLecture();
  const graine = nb($("t-graine").value, 1);
  const t0 = performance.now();
  R = executer(M, { graine, trace: true });
  const ms = performance.now() - t0;
  dernierScen = null;
  $("t-scrub").max = Math.max(0, R.images.length - 1);
  vaOnglet("v-jrn");
  if (anime){ vaEtape(0); demarreLecture(); }
  else {
    vaEtape(R.images.length - 1);
    pain(`${R.nJetons} valeur(s) · ${R.nAnomalies} anomalie(s) · ${Math.round(R.duree)} ms simulées ` +
         `(calculé en ${ms.toFixed(1)} ms)`, R.nAnomalies ? "" : "ok");
  }
  dessineMesures();
  inspecteur();
  if (R.arret === "aucune source"){ vaOnglet("v-probs"); pain("aucune source : rien à exécuter", "err"); }
}

/** Reconstitue l'état visible à l'étape i en cumulant les différences. */
function reconstruit(i){
  vueRun = { vals: {}, liens: {}, files: {}, actifs: [] };
  if (!R) return;
  const n = Math.max(-1, Math.min(i, R.images.length - 1));
  for (let k = 0; k <= n; k++){
    const im = R.images[k];
    Object.assign(vueRun.vals, im.maj);
    Object.assign(vueRun.liens, im.majL);
  }
  if (n >= 0){
    vueRun.files = R.images[n].files;
    vueRun.actifs = R.images[n].actifs;
  }
}

function vaEtape(i, sansAnim){
  if (!R) return;
  const n = Math.max(0, Math.min(i, R.images.length - 1));
  const avant = lecture.i;
  lecture.i = n;
  reconstruit(n);
  rafraichitValeurs();
  dessineFils();
  const im = R.images[n];
  /* À la dernière image, on montre tout : le bilan de fin est journalisé après
     le dernier événement, il n'appartient à aucune image. */
  dessineJournal(n >= R.images.length - 1 ? undefined : (im ? im.jrnN : undefined));
  $("t-scrub").value = n;
  $("t-etape").textContent = R.images.length ? `${n + 1}/${R.images.length}` : "0/0";
  $("t-horloge").textContent = `${Math.round(im ? im.t : 0)} ms`;
  if (!sansAnim && im && im.vols && im.vols.length && n === avant + 1) animeVols(im.vols);
}

/** Un jeton qui glisse le long de son fil. Pur agrément : le moteur a déjà
 *  tout calculé, on ne fait que le rendre visible. */
function animeVols(vols){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const duree = Math.max(120, 620 / nb($("t-vit").value, 6));
  vols.forEach(v => {
    const p = $("F" + v.lien); if (!p || !p.getTotalLength) return;
    let L = 0;
    try { L = p.getTotalLength(); } catch(e){ return; }
    const t = typeDe(v.val);
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.innerHTML = `<circle r="5.5" class="jeton-vol" fill="var(--${t})"/>
      <text class="jeton-txt c-${t}" y="-11" text-anchor="middle">${ech(aff(v.val))}</text>`;
    filsG.appendChild(g);
    const t0 = performance.now();
    (function pas(){
      const k = Math.min(1, (performance.now() - t0) / duree);
      let q; try { q = p.getPointAtLength(L * k); } catch(e){ g.remove(); return; }
      g.setAttribute("transform", `translate(${q.x},${q.y})`);
      if (k < 1) requestAnimationFrame(pas); else g.remove();
    })();
  });
}

function demarreLecture(){
  if (!R || !R.images.length) return;
  lecture.joue = true;
  $("t-jouer").textContent = "⏸";
  const pas = () => {
    if (!lecture.joue) return;
    if (lecture.i >= R.images.length - 1){ arreteLecture(); pain("lecture terminée"); return; }
    vaEtape(lecture.i + 1);
    lecture.minuteur = setTimeout(pas, Math.max(30, 700 / nb($("t-vit").value, 6)));
  };
  lecture.minuteur = setTimeout(pas, 60);
}
function arreteLecture(){
  lecture.joue = false;
  clearTimeout(lecture.minuteur);
  $("t-jouer").textContent = "▶";
}
function basculeLecture(){
  if (!R) return execute(true);
  if (lecture.joue) arreteLecture();
  else { if (lecture.i >= R.images.length - 1) vaEtape(0); demarreLecture(); }
}

$("t-jouer").onclick = basculeLecture;

function histogramme(l, titre){
  if (!l.length) return "";
  const n = 18, min = Math.min(...l), max = Math.max(...l);
  const pas = (max - min) / n || 1;
  const seaux = new Array(n).fill(0);
  l.forEach(x => seaux[Math.min(n - 1, Math.floor((x - min) / pas))]++);
  const hmax = Math.max(...seaux) || 1;
  const W = 340, H = 74;
  return `<div class="carte info"><div class="tt">${ech(titre)}</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;margin-top:5px">
      ${seaux.map((s, i) => {
        const h = s / hmax * (H - 18), x = i * (W / n);
        return `<rect x="${x + 1}" y="${H - 14 - h}" width="${W / n - 2}" height="${h}"
          fill="var(--accent)" opacity="${s ? .85 : .15}"><title>${s} exécution(s)</title></rect>`;
      }).join("")}
      <text x="2" y="${H - 3}" class="axt" style="font-size:9px;fill:var(--ink-3)">${affBrut(min)}</text>
      <text x="${W - 2}" y="${H - 3}" text-anchor="end" class="axt" style="font-size:9px;fill:var(--ink-3)">${affBrut(max)}</text>
    </svg></div>`;
}

/** Correspondance souple : les lettres tapées doivent apparaître dans l'ordre. */
function score(q, texte){
  if (!q) return 1;
  const t = texte.toLowerCase(), s = q.toLowerCase();
  if (t.includes(s)) return 1000 - t.indexOf(s);
  let i = 0, pts = 0;
  for (const ch of s){
    const j = t.indexOf(ch, i);
    if (j < 0) return 0;
    pts += (j === i ? 3 : 1); i = j + 1;
  }
  return pts;
}

let cmdListe = [], cmdIdx = 0;
function ouvreCommandes(){
  $("voile-cmd").classList.add("on");
  $("cmd-input").value = ""; $("cmd-input").focus();
  filtreCommandes();
}
function filtreCommandes(){
  const q = $("cmd-input").value.trim();
  cmdListe = COMMANDES().map(c => ({ c, s: score(q, c.nom + " " + c.g) }))
    .filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 60).map(x => x.c);
  cmdIdx = 0;
  rendCommandes();
}
function rendCommandes(){
  $("cmd-liste").innerHTML = cmdListe.length
    ? cmdListe.map((c, i) => `<div class="cmd-item ${i === cmdIdx ? "on" : ""}" data-i="${i}">
        <span class="ic">${ech(c.ic)}</span>
        <span style="flex:1">${ech(c.nom)}<div class="gr">${ech(c.g)}</div></span>
        ${c.cle ? `<span class="k">${ech(c.cle)}</span>` : ""}</div>`).join("")
    : `<p class="vide" style="padding:14px">Aucune commande ne correspond.</p>`;
  $("cmd-liste").querySelectorAll("[data-i]").forEach(el => {
    el.onclick = () => lanceCommande(+el.dataset.i);
    el.onmouseenter = () => { cmdIdx = +el.dataset.i; rendCommandes(); };
  });
  const on = $("cmd-liste").querySelector(".cmd-item.on");
  if (on) on.scrollIntoView({ block: "nearest" });
}
function lanceCommande(i){
  const c = cmdListe[i]; if (!c) return;
  fermeVoiles();
  setTimeout(() => { try { c.f(); } catch(err){ pain("échec : " + err.message, "err"); } }, 10);
}
$("cmd-input").oninput = filtreCommandes;
$("cmd-input").onkeydown = e => {
  if (e.key === "ArrowDown"){ e.preventDefault(); cmdIdx = Math.min(cmdListe.length - 1, cmdIdx + 1); rendCommandes(); }
  if (e.key === "ArrowUp"){ e.preventDefault(); cmdIdx = Math.max(0, cmdIdx - 1); rendCommandes(); }
  if (e.key === "Enter"){ e.preventDefault(); lanceCommande(cmdIdx); }
};

function fermeVoiles(){

  ["voile-cmd","voile-forge","voile-boite"].forEach(v => {

/* ───────────────────────────────────────────────────────────────────────────
   §21 · LA FORGE
   Écrire son propre bloc : des ports, des réglages, du code. Une fois forgé,
   il se comporte exactement comme les autres — et il voyage dans le montage.
   ─────────────────────────────────────────────────────────────────────────── */

let forgeEnCours = null;

const FORGE_MODELE = {
  nom: "Mon bloc", ic: "★", coul: "var(--texte)", aide: "Ce que fait ce bloc, en une phrase.",
  entrees: ["x"], sorties: ["y"], lat: 30, mangeAnomalie: false, attendTout: true,
  params: [{ k: "facteur", l: "Facteur", t: "nombre", d: "2" }],
  corps: `// Variables disponibles :
//   x         la valeur reçue sur le port « x » (brute, pas enveloppée)
//   facteur   le réglage déclaré ci-dessus
//   etat      mémoire du bloc, conservée entre deux valeurs
//   aide      boîte à outils (somme, moyenne, arrondi, borne, argent…)
//   hasard()  tirage reproductible, entre 0 et 1
//   note(t)   écrit une ligne dans le journal
//   anomalie(motif)   fabrique une anomalie qui voyagera sur le fil
//
// Renvoie un objet { port: valeur }. Une valeur nue part par le premier port.

etat.vus = (etat.vus || 0) + 1;
note("valeur n° " + etat.vus);

if (typeof x !== "number") return { y: anomalie("attendu un nombre, reçu " + typeof x) };
return { y: x * facteur };`
};

function ouvreForge(def){
  forgeEnCours = JSON.parse(JSON.stringify(def || FORGE_MODELE));
  if (!def){
    /* Date.now() seul suffirait presque — mais deux forges dans la même
       milliseconde écraseraient la première sans prévenir. */
    let id;
    do { id = "f:" + Date.now().toString(36) + (++seq).toString(36); }
    while ((M.forges || []).some(f => f.id === id));
    forgeEnCours.id = id;
  }
  $("forge-titre").textContent = def ? `Bloc forgé : ${def.nom}` : "Forger un bloc";
  $("forge-suppr").style.display = def ? "" : "none";
  $("forge-res").textContent = "";
  rendForge();
  $("voile-forge").classList.add("on");
}

function rendForge(){
  const d = forgeEnCours;
  const couleurs = ["var(--texte)","var(--accent)","var(--ok)","var(--warn)","var(--crit)","var(--nombre)","var(--abst)"];
  $("forge-corps").innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 84px;gap:10px">
      <div class="champ"><label>Nom du bloc</label><input id="fg-nom" value="${ech(d.nom)}"></div>
      <div class="champ"><label>Signe</label><input id="fg-ic" value="${ech(d.ic)}" maxlength="2" style="text-align:center"></div>
    </div>

    <div class="champ"><label>Couleur</label>
      <div style="display:flex;gap:5px">${couleurs.map(c =>
        `<button data-coul="${c}" style="flex:1;height:24px;border-radius:5px;cursor:pointer;
          border:2px solid ${c === d.coul ? "var(--ink)" : "transparent"};background:${c}"></button>`).join("")}</div></div>
    <div class="grille2">
      <div class="champ"><label>Ports d'entrée</label><input id="fg-e" value="${ech(d.entrees.join(", "))}"
        placeholder="x, y"><div class="aide">Séparés par des virgules. Ces noms deviennent des variables dans le code.</div></div>
      <div class="champ"><label>Ports de sortie</label><input id="fg-s" value="${ech(d.sorties.join(", "))}"
        placeholder="y, refus"></div>
    </div>
    <div class="grille2">
      <div class="champ"><label>Temps de traitement (ms)</label><input id="fg-lat" type="number" value="${ech(d.lat)}"></div>
      <div class="champ"><label>Déclenchement</label>
        <select id="fg-attend">
          <option value="1"${d.attendTout ? " selected" : ""}>attendre toutes les entrées</option>
          <option value="0"${!d.attendTout ? " selected" : ""}>partir dès qu'une entrée arrive</option>
        </select></div>
    </div>
    <div class="champ"><label>Anomalies reçues</label>
      <select id="fg-mange">
        <option value="0"${!d.mangeAnomalie ? " selected" : ""}>les laisser passer sans exécuter le code (règle générale)</option>
        <option value="1"${d.mangeAnomalie ? " selected" : ""}>les traiter moi-même dans le code</option>
      </select></div>

    <div class="h2">Réglages du bloc</div>
    <div id="fg-params">${d.params.map((p, i) => `
      <div style="display:flex;gap:5px;margin-bottom:5px;align-items:center">
        <input data-p="${i}|k" value="${ech(p.k)}" placeholder="clé" class="mono"
          style="flex:1;padding:4px 6px;border-radius:5px;border:1px solid var(--line-2);background:var(--surface-2);font-size:11.5px">
        <input data-p="${i}|l" value="${ech(p.l)}" placeholder="libellé"
          style="flex:1.4;padding:4px 6px;border-radius:5px;border:1px solid var(--line-2);background:var(--surface-2);font-size:11.5px">
        <select data-p="${i}|t" style="width:82px;padding:4px;border-radius:5px;border:1px solid var(--line-2);background:var(--surface-2);font-size:11.5px">
          ${["texte","nombre","code"].map(t => `<option${t === p.t ? " selected" : ""}>${t}</option>`).join("")}</select>
        <input data-p="${i}|d" value="${ech(p.d)}" placeholder="défaut" class="mono"
          style="width:74px;padding:4px 6px;border-radius:5px;border:1px solid var(--line-2);background:var(--surface-2);font-size:11.5px">
        <button class="btn sm plat" data-p-del="${i}">✕</button>
      </div>`).join("")}</div>
    <button class="btn sm" id="fg-p-neuf">+ réglage</button>

    <div class="h2">Code</div>
    <div class="champ"><textarea id="fg-corps" spellcheck="false" style="min-height:230px;font-size:11.5px">${ech(d.corps)}</textarea></div>
    <div class="champ"><label>Valeurs d'essai (une par port d'entrée, séparées par des virgules)</label>
      <input id="fg-essai-val" value="${ech(d.essai || "7")}" class="mono"></div>`;

  $("forge-corps").querySelectorAll("[data-coul]").forEach(b => b.onclick = () => {
    d.coul = b.dataset.coul; rendForge(); });
  const lie = (id, champ, f) => { const el = $(id); if (el) el.oninput = el.onchange = () => d[champ] = f ? f(el.value) : el.value; };
  lie("fg-nom", "nom"); lie("fg-ic", "ic"); lie("fg-aide", "aide"); lie("fg-corps", "corps");
  lie("fg-lat", "lat", v => nb(v, 30));
  lie("fg-essai-val", "essai");
  $("fg-e").oninput = () => d.entrees = $("fg-e").value.split(",").map(s => s.trim()).filter(Boolean);
  $("fg-s").oninput = () => d.sorties = $("fg-s").value.split(",").map(s => s.trim()).filter(Boolean);
  $("fg-attend").onchange = () => d.attendTout = $("fg-attend").value === "1";
  $("fg-mange").onchange = () => d.mangeAnomalie = $("fg-mange").value === "1";
  $("forge-corps").querySelectorAll("[data-p]").forEach(el => el.oninput = el.onchange = () => {
    const [i, k] = el.dataset.p.split("|"); d.params[+i][k] = el.value; });
  $("forge-corps").querySelectorAll("[data-p-del]").forEach(el => el.onclick = () => {
    d.params.splice(+el.dataset.pDel, 1); rendForge(); });
  $("fg-p-neuf").onclick = () => { d.params.push({ k: "reglage" + (d.params.length + 1), l: "Réglage", t: "texte", d: "" }); rendForge(); };
}

function valideForge(d){
  const mauvais = [];
  d.entrees.concat(d.sorties).forEach(p => { if (!NOM_PORT.test(p)) mauvais.push(p); });
  d.params.forEach(p => { if (!NOM_PORT.test(p.k)) mauvais.push(p.k); });
  if (mauvais.length)
    return `nom impossible : ${mauvais.join(", ")} — un nom de port ou de réglage doit commencer par une lettre et ne contenir ni espace ni signe.`;
  if (!d.sorties.length) return "un bloc sans port de sortie ne peut rien transmettre.";
  const doublons = [...d.entrees, ...d.sorties].filter((x, i, l) => l.indexOf(x) !== i);
  if (doublons.length) return `port en double : ${doublons.join(", ")}`;
  try { compileForge(d).fn; compileCorps(d.corps, d.entrees.concat(d.params.map(p => p.k),
        ["etat","aide","hasard","note","anomalie","temps","p","e"])); }
  catch(err){ return err.message; }
  return null;
}

$("forge-essai").onclick = () => {
  const d = forgeEnCours;
  const souci = valideForge(d);
  if (souci){ $("forge-res").innerHTML = `<span style="color:var(--crit)">${ech(souci)}</span>`; return; }
  const c = compileForge(d);
  const vals = String(d.essai || "").split(",").map(s => {
    const t = s.trim(); const n = Number(t.replace(",", "."));
    return Number.isFinite(n) && t !== "" ? val(n, "nombre") : val(t, "texte");
  });
  const e = {}; d.entrees.forEach((p, i) => e[p] = vals[i] !== undefined ? vals[i] : val(0, "nombre"));
  const p = {}; d.params.forEach(x => p[x.k] = x.d);
  const notes = [];
  try {
    const r = c.fn(p, e, { etat: {}, temps: 0, hasard: alea(1),
      note: t => notes.push(t), assertion: () => {} });
    const sortie = Object.keys(r).filter(k => k !== "_encore")
      .map(k => `${k} : ${aff(r[k])}`).join("   ");
    $("forge-res").innerHTML = `<span style="color:var(--ok)">${ech(sortie || "aucune sortie")}</span>` +
      (notes.length ? ` <span style="color:var(--ink-3)">· ${ech(notes.join(" · "))}</span>` : "");
  } catch(err){
    $("forge-res").innerHTML = `<span style="color:var(--crit)">${ech(err.message)}</span>`;
  }
};

$("forge-ok").onclick = () => {
  const d = forgeEnCours;
  const souci = valideForge(d);
  if (souci){ $("forge-res").innerHTML = `<span style="color:var(--crit)">${ech(souci)}</span>`; return; }
  modifie(() => {
    M.forges ??= [];
    const i = M.forges.findIndex(f => f.id === d.id);
    if (i >= 0) M.forges[i] = d; else M.forges.push(d);
    chargeForges(M.forges);
  });
  dessinePalette();
  fermeVoiles();
  pain(`bloc « ${d.nom} » forgé`, "ok");
};

$("forge-suppr").onclick = () => {
  const d = forgeEnCours;
  const usages = M.blocs.filter(b => b.comp === d.id).length;
  if (usages && !confirm(`${usages} bloc(s) du montage utilisent « ${d.nom} ». Les supprimer aussi ?`)) return;
  modifie(() => {
    M.liens = M.liens.filter(l => {
      const bd = bloc(l.de.b), bv = bloc(l.vers.b);
      return !(bd && bd.comp === d.id) && !(bv && bv.comp === d.id);
    });
    M.blocs = M.blocs.filter(b => b.comp !== d.id);
    M.forges = (M.forges || []).filter(f => f.id !== d.id);
    chargeForges(M.forges);
  });
  dessinePalette();
  fermeVoiles();
  pain("bloc forgé supprimé");
};
