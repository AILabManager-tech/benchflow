/* Paramètres avancés greffés sur TOUS les blocs. Un pipeline sans temps ni
   coût ni capacité n'est qu'un dessin ; avec eux, c'est un modèle. */
const PARAMS_AVANCES = [
  {k:"_lat",   l:"Temps de traitement (ms)", t:"nombre", av:true},
  {k:"_gigue", l:"Variation du temps (± %)", t:"nombre", d:"0", av:true},
  {k:"_cout",  l:"Coût par valeur traitée", t:"nombre", d:"0", av:true},
  {k:"_cap",   l:"Traitements simultanés (0 = sans limite)", t:"nombre", d:"0", av:true},
  {k:"_panne", l:"Panne aléatoire (%)", t:"nombre", d:"0", av:true,
   aide:"Casse le bloc au hasard, quel que soit son rôle. Le taux s'applique à chaque valeur."}
];

/** Liste des ports d'un bloc : constante, ou calculée d'après ses paramètres. */
function portsDe(comp, params, sens){
  const c = compDe(comp);
  if (!c) return [];
  const l = sens === "e" ? c.entrees : c.sorties;
  const r = typeof l === "function" ? l(params || {}) : l;
  return Array.isArray(r) ? r : [];
}

/** Le bloc attend-il toutes ses entrées avant de se déclencher ? */
function attendTout(c, p){
  return typeof c.attendTout === "function" ? !!c.attendTout(p) : !!c.attendTout;
}

/** Paramètres complets d'un comportement, avancés compris. */
function paramsDe(comp){
  const c = compDe(comp);
  if (!c) return [];
  const av = PARAMS_AVANCES.map(x => x.k === "_lat" ? Object.assign({}, x, { d: String(c.lat ?? 0) }) : x);
  return (c.params || []).concat(av);
}

/** Valeurs par défaut d'un comportement. */
function defauts(comp){
  const o = {};
  paramsDe(comp).forEach(p => o[p.k] = p.d);
  return o;
}

/* ───────────────────────────────────────────────────────────────────────────
   §3 · BLOCS FORGÉS
   Un bloc forgé est un comportement écrit par l'utilisateur : ses ports, ses
   paramètres, son code. Il vit dans le montage (donc il s'exporte et se
   partage avec lui) et se comporte ensuite comme n'importe quel bloc.
   ─────────────────────────────────────────────────────────────────────────── */

const FORGES = new Map();   // clé "f:xxx" → comportement compilé
const NOM_PORT = /^[A-Za-zÀ-ÖØ-öø-ÿ_][A-Za-zÀ-ÖØ-öø-ÿ0-9_]*$/;

/** Compile une définition forgée en comportement utilisable par le moteur. */
function compileForge(def){
  /* Un nom de port devient une variable dans le code du bloc : il ne peut pas
     contenir d'espace ni commencer par un chiffre. La forge l'interdit à la
     saisie — mais un montage reçu d'ailleurs ne passe pas par la forge. Écarter
     ces noms sans le dire ferait disparaître des ports d'un bloc, et les fils
     qui s'y rattachaient avec eux. On écarte, et on garde la liste. */
  const rejetes = [];
  const nomValide = x => { if (NOM_PORT.test(x)) return true; rejetes.push(x); return false; };
  const entrees = (def.entrees || []).filter(nomValide);
  const sorties = (def.sorties || []).filter(nomValide);
  const params  = (def.params  || []).filter(p => nomValide(p.k));
  const noms = entrees.concat(params.map(p => p.k), ["etat","aide","hasard","note","anomalie","temps","p","e"]);
  /* Les descriptions des blocs livrés contiennent du balisage volontaire ; celles
     d'un bloc forgé viennent d'ailleurs — parfois d'un fichier reçu. Elles sont
     ramenées à du texte avant d'atteindre l'interface. */
  const texte = x => String(x === undefined || x === null ? "" : x).replace(/[<>&]/g, c =>
    ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" })[c]);
  return {
    forge: true, def, rejetes,
    nom: def.nom || "Bloc forgé", ic: def.ic || "★", coul: def.coul || "var(--texte)",
    cat: "Forgés", lat: nb(def.lat, 30),
    aide: texte(def.aide) || "Bloc forgé sur mesure.",
    entrees, sorties,
    params: params.map(x => Object.assign({}, x, { l: texte(x.l), aide: x.aide ? texte(x.aide) : undefined })),
    mangeAnomalie: !!def.mangeAnomalie,
    attendTout: !!def.attendTout,
    fn(p, e, ctx){
      const f = compileCorps(def.corps || "return {};", noms);
      const args = entrees.map(k => brut(e[k]))
        .concat(params.map(x => {
          const v = p[x.k];
          if (x.t === "nombre") return nb(v, 0);
          if (x.t === "booleen") return !(v === false || v === "false" || v === "" || v === "0");
          return v;
        }))
        .concat([ctx.etat, AIDE, ctx.hasard, ctx.note, anomalie, ctx.temps, p, e]);
      const r = f(...args);
      if (r === undefined) return {};
      // Une valeur nue part par le premier port de sortie ; sans port, c'est une
      // anomalie — mieux vaut le dire que perdre la valeur en silence.
      if (r === null || typeof r !== "object" || Array.isArray(r) || ("t" in r && "v" in r)){
        if (!sorties.length) return {};
        return { [sorties[0]]: val(r, "auto") };
      }
      const o = {};
      Object.keys(r).forEach(k => {
        if (k === "_encore"){ o._encore = nb(r._encore, 0); return; }
        o[k] = val(r[k], "auto");
      });
      return o;
    },
    tsortie(){ const o = {}; sorties.forEach(s => o[s] = "quelconque"); return o; },
    py: () => `raise RuntimeError("« ${(def.nom || "bloc forgé").replace(/"/g, "'")} » est un bloc forgé : `
      + `son corps est du JavaScript, non traduit en Python. Réécris-le ici, ou garde ce bloc dans l'atelier.")`
  };
}

/** Recharge le registre des blocs forgés à partir d'un montage. */
function chargeForges(liste){
  FORGES.clear();
  (liste || []).forEach(def => { if (def && def.id) FORGES.set(def.id, compileForge(def)); });
}

/** Résout un comportement par sa clé, standard ou forgé. */
function compDe(comp){
  if (COMP[comp]) return COMP[comp];
  if (FORGES.has(comp)) return FORGES.get(comp);
  return null;
}

/* ───────────────────────────────────────────────────────────────────────────
   §4 · LE MONTAGE
   ─────────────────────────────────────────────────────────────────────────── */

const VERSION_FORMAT = 2;

function montageVide(){
  return { version: VERSION_FORMAT, titre: "Montage sans titre",
           blocs: [], liens: [], zones: [], forges: [], scenarios: [] };
}

/** Remet d'aplomb un montage venu d'ailleurs : identifiants uniques, fils dont
 *  les deux extrémités existent. Rien n'est corrigé en douce — chaque retouche
 *  revient dans `notes`, pour être montrée à qui ouvre le fichier.
 *
 *  Deux blocs partageant un identifiant, c'est une ambiguïté qu'on ne peut pas
 *  lever : l'atelier n'en verrait qu'un, les fils s'attacheraient au premier, et
 *  déplacer l'un bougerait l'autre. On renumérote donc, et on le dit. */
function normaliseMontage(M){
  const notes = [];
  const vus = new Set();
  let compteur = 0;
  const neuf = prefixe => { let id; do { id = prefixe + "r" + (++compteur); } while (vus.has(id)); return id; };

  const dedoublonne = (liste, prefixe, quoi) => {
    (liste || []).forEach(x => {
      if (!x || x.id === undefined || x.id === null) x.id = neuf(prefixe);
      if (vus.has(x.id)){
        const ancien = x.id;
        x.id = neuf(prefixe);
        x.__renomme = ancien;
        notes.push(`${quoi} « ${x.nom || ancien} » portait l'identifiant « ${ancien} », déjà pris : renuméroté en « ${x.id} ».`);
      }
      vus.add(x.id);
    });
  };
  dedoublonne(M.blocs, "b", "Le bloc");
  dedoublonne(M.zones, "z", "La section");
  dedoublonne(M.scenarios, "s", "Le scénario");
  dedoublonne(M.liens, "l", "Le fil");

  if (M.blocs.some(b => b.__renomme))
    notes.push("Les fils qui touchaient un identifiant en double sont restés sur le premier bloc portant ce nom : impossible de deviner lequel des deux ils visaient. À vérifier.");

  (M.forges || []).forEach(def => {
    const mauvais = (def.entrees || []).concat(def.sorties || [])
      .concat((def.params || []).map(p => p && p.k))
      .filter(x => x !== undefined && !NOM_PORT.test(String(x)));
    if (mauvais.length)
      notes.push(`Le bloc forgé « ${def.nom || def.id} » déclare des noms impossibles : « ${mauvais.join(" », « ")} ». ` +
                 `Ils sont écartés — le bloc aura moins de ports que prévu.`);
  });

  const existe = new Set(M.blocs.map(b => b.id));
  const avant = M.liens.length;
  M.liens = M.liens.filter(l => l && l.de && l.vers && existe.has(l.de.b) && existe.has(l.vers.b));
  if (M.liens.length !== avant)
    notes.push(`${avant - M.liens.length} fil(s) retiré(s) : une de leurs extrémités n'existe pas dans ce fichier.`);

  M.blocs.forEach(b => delete b.__renomme);
  M.zones.forEach(z => delete z.__renomme);

  /* Le compteur doit repartir au-dessus de tout ce qui existe, sinon le prochain
     bloc créé récupérerait un identifiant déjà en service. */
  let seq = 0;
  vus.forEach(id => {
    const k = parseInt(String(id).replace(/^\D+/, ""), 10);
    if (Number.isFinite(k)) seq = Math.max(seq, k);
  });
  return { notes, seq: seq + 1 };
}

/** Résout l'indice d'un port : par nom d'abord (robuste aux ports réglables),
 *  par position ensuite. Renvoie -1 si le port a disparu. */
function indicePort(bloc, sens, ref){
  const l = portsDe(bloc.comp, bloc.params, sens);
  if (ref && ref.p !== undefined){
    const i = l.indexOf(ref.p);
    if (i >= 0) return i;
  }
  return (ref && ref.i < l.length) ? ref.i : -1;
}

/** Ordre topologique en vagues : la vague d'un bloc est 1 + la plus grande
 *  vague de ses prédécesseurs. Les cycles sont coupés (le bloc reste à sa
 *  première estimation) — un cycle n'est pas une erreur ici, c'est une boucle. */
function vagues(M){
  const rang = {}, entrant = {};
  M.blocs.forEach(b => { rang[b.id] = 1; entrant[b.id] = 0; });
  M.liens.forEach(l => { if (entrant[l.vers.b] !== undefined) entrant[l.vers.b]++; });
  let front = M.blocs.filter(b => entrant[b.id] === 0).map(b => b.id);
  if (!front.length && M.blocs.length) front = [M.blocs[0].id];
  const vus = new Set(front);
  const reste = Object.assign({}, entrant);
  let garde = M.blocs.length + 2;
  while (front.length && garde-- > 0){
    const suivant = [];
    front.forEach(id => {
      M.liens.filter(l => l.de.b === id).forEach(l => {
        const c = l.vers.b;
        if (rang[c] === undefined) return;
        rang[c] = Math.max(rang[c], rang[id] + 1);
        if (--reste[c] <= 0 && !vus.has(c)){ vus.add(c); suivant.push(c); }
      });
    });
    front = suivant;
  }
  // Blocs jamais atteints (dans un cycle isolé) : on les place après leur amont connu.
  M.blocs.forEach(b => { if (!vus.has(b.id)) rang[b.id] = Math.max(rang[b.id], 1); });
  return rang;
}

/** Détecte les cycles (retour arrière dans le graphe). */
function cycles(M){
  const sortants = {}; M.blocs.forEach(b => sortants[b.id] = []);
  M.liens.forEach(l => { if (sortants[l.de.b]) sortants[l.de.b].push(l.vers.b); });
  const etat = {}, trouves = [];
  const pile = [];
  function marche(id){
    etat[id] = 1; pile.push(id);
    (sortants[id] || []).forEach(v => {
      if (etat[v] === 1){ trouves.push(pile.slice(pile.indexOf(v)).concat([v])); }
      else if (!etat[v]) marche(v);
    });
    pile.pop(); etat[id] = 2;
  }
  M.blocs.forEach(b => { if (!etat[b.id]) marche(b.id); });
  return trouves;
}

/** Propagation statique des types, du haut vers le bas du graphe. Sans
 *  exécuter quoi que ce soit : c'est ce qui permet d'annoncer une
 *  incompatibilité avant même d'appuyer sur « Exécuter ». */
function typesStatiques(M){
  const sortie = {};   // "blocId|port" → type
  const entree = {};   // "blocId|port" → type
  const rang = vagues(M);
  const ordre = M.blocs.slice().sort((a, b) => rang[a.id] - rang[b.id]);
  for (let tour = 0; tour < 2; tour++){
    ordre.forEach(b => {
      const c = compDe(b.comp); if (!c) return;
      const tin = {};
      portsDe(b.comp, b.params, "e").forEach(p => {
        const cle = b.id + "|" + p;
        tin[p] = entree[cle] || "quelconque";
      });
      let ts = {};
      try { ts = c.tsortie ? c.tsortie(Object.assign({}, defauts(b.comp), b.params), tin) : {}; }
      catch(err){ ts = {}; }
      portsDe(b.comp, b.params, "s").forEach(p => sortie[b.id + "|" + p] = ts[p] || "quelconque");
    });
    M.liens.forEach(l => {
      const bd = M.blocs.find(x => x.id === l.de.b), bv = M.blocs.find(x => x.id === l.vers.b);
      if (!bd || !bv) return;
      const ps = portsDe(bd.comp, bd.params, "s")[indicePort(bd, "s", l.de)];
      const pe = portsDe(bv.comp, bv.params, "e")[indicePort(bv, "e", l.vers)];
      if (ps === undefined || pe === undefined) return;
      const t = sortie[bd.id + "|" + ps] || "quelconque";
      const cle = bv.id + "|" + pe;
      entree[cle] = entree[cle] && entree[cle] !== t ? "quelconque" : t;
    });
  }
  return { sortie, entree };
}

/* ───────────────────────────────────────────────────────────────────────────
   §5 · LE MOTEUR
   Simulation à événements discrets. Une horloge simulée avance d'événement en
   événement ; les blocs occupent du temps, les files se forment, les valeurs
   voyagent. Rien n'est concurrent pour de vrai : tout est ordonné par
   (instant, rang d'arrivée), donc deux exécutions de même graine sont
   rigoureusement identiques.

   Le tout tourne d'un trait, sans animation, et enregistre chaque étape.
   L'interface rejoue ensuite cet enregistrement à la vitesse qu'elle veut —
   ce qui donne gratuitement la lecture pas à pas et le retour en arrière.
   ─────────────────────────────────────────────────────────────────────────── */

const LIMITES = { evenements: 20000, temps: 600000, images: 4000, jetons: 20000 };

function executer(M, opts){
  const o = Object.assign({ graine: 1, trace: true, surcharges: {} , limites: {} }, opts || {});
  const lim = Object.assign({}, LIMITES, o.limites);
  const rng = alea(nb(o.graine, 1));

  chargeForges(M.forges);

  const R = {
    graine: nb(o.graine, 1), temps: 0, arret: null, nEvts: 0,
    blocs: {}, liens: {}, jrn: [], taches: [], images: [], assertions: [],
    nJetons: 0, nAnomalies: 0, cout: 0, perdus: 0, ordre: 0
  };

  const indexBloc = {};
  M.blocs.forEach(b => indexBloc[b.id] = b);

  /* Paramètres effectifs d'un bloc : défauts du comportement, réglages du
     bloc, puis surcharges du scénario. */
  const cacheP = {};
  function P(b){
    if (cacheP[b.id]) return cacheP[b.id];
    return cacheP[b.id] = Object.assign({}, defauts(b.comp), b.params || {}, o.surcharges[b.id] || {});
  }

  const E = {};
  M.blocs.forEach(b => {
    const c = compDe(b.comp);
    if (!c){
      jrn("err", b.id, `comportement inconnu : « ${b.comp} » — ce bloc ne fera rien`);
      return;
    }
    E[b.id] = { etat: {}, buf: {}, occupe: 0, n: 0, nAno: 0, cout: 0,
                fileMax: 0, tOccupe: 0, dernier: null, sansSuite: {} };
    portsDe(b.comp, b.params, "e").forEach(p => E[b.id].buf[p] = []);
    R.blocs[b.id] = E[b.id];
  });
  M.liens.forEach(l => R.liens[l.id] = { n: 0, dernier: null });

  const fe = new Tas();
  let ordre = 0;
  const planifie = (t, k, extra) => fe.pousse(Object.assign({ t, ord: ordre++, k }, extra));

  function jrn(cls, bloc, txt){
    R.jrn.push({ t: R.temps, cls, bloc: bloc || null, txt });
  }

  /* ── image : une différence par événement, pour remonter le temps ────── */
  const majV = {}, majL = {};
  function image(ev, vols){
    if (!o.trace) return;
    /* Passé la limite, on cesse d'ajouter des étapes — mais on continue de tenir
       la dernière à jour. Sinon la lecture s'arrêterait sur un état périmé pendant
       que le journal, lui, montrerait la fin réelle : deux vérités contradictoires
       à l'écran. */
    const tronque = R.images.length >= lim.images;
    if (tronque && !R.traceTronquee){
      R.traceTronquee = true;
      jrn("warn", null, `⚠ ${lim.images} étapes enregistrées : la lecture pas à pas s'arrête ici. ` +
                        `L'exécution, elle, continue — le journal et les mesures restent complets.`);
    }
    const files = {}, actifs = [];
    Object.keys(E).forEach(id => {
      const s = E[id];
      const n = Object.values(s.buf).reduce((a, q) => a + q.length, 0);
      if (n) files[id] = n;
      if (s.occupe) actifs.push(id);
    });
    const im = { t: R.temps, k: ev.k, bloc: ev.bloc || null, jrnN: R.jrn.length,
                 maj: Object.assign({}, majV), majL: Object.assign({}, majL),
                 files, actifs, vols: vols || [], tronquee: tronque };
    if (tronque){
      /* On fusionne dans la dernière étape au lieu d'en ajouter une. */
      const d = R.images[R.images.length - 1];
      Object.assign(d.maj, im.maj); Object.assign(d.majL, im.majL);
      d.t = im.t; d.jrnN = im.jrnN; d.files = im.files; d.actifs = im.actifs;
      d.vols = []; d.tronquee = true;
    } else {
      R.images.push(im);
    }
    for (const k in majV) delete majV[k];
    for (const k in majL) delete majL[k];
  }

  /* ── contexte offert à la fonction d'un bloc ────────────────────────── */
  function contexte(b, s){
    return {
      etat: s.etat,
      temps: R.temps,
      bloc: b.id,
      hasard: rng,
      note: txt => jrn("gris", b.id, `${b.nom} · ${txt}`),
      assertion: (nom, ok, valeur, err) =>
        R.assertions.push({ bloc: b.id, nomBloc: b.nom, nom, ok, valeur, err: err || null, t: R.temps })
    };
  }

  /* ── déclenchement d'un bloc ─────────────────────────────────────────── */
  function peutTirer(b){
    const s = E[b.id]; if (!s) return false;
    const c = compDe(b.comp), p = P(b);
    const cap = Math.floor(nb(p._cap, 0));
    if (cap > 0 && s.occupe >= cap) return false;
    const ports = portsDe(b.comp, b.params, "e");
    if (!ports.length) return false;
    return attendTout(c, p)
      ? ports.every(x => s.buf[x] && s.buf[x].length)
      : ports.some(x => s.buf[x] && s.buf[x].length);
  }

  function tenter(b){
    let garde = 200;
    while (peutTirer(b) && garde-- > 0) demarre(b, null);
  }

  function demarre(b, amorce){
    const c = compDe(b.comp), s = E[b.id], p = P(b);
    const e = {};
    if (!amorce){
      const ports = portsDe(b.comp, b.params, "e");
      if (attendTout(c, p)){
        ports.forEach(x => { if (s.buf[x] && s.buf[x].length) e[x] = s.buf[x].shift(); });
      } else {
        const x = ports.find(x => s.buf[x] && s.buf[x].length);
        e[x] = s.buf[x].shift();
      }
      const enFile = Object.values(s.buf).reduce((a, q) => a + q.length, 0);
      s.fileMax = Math.max(s.fileMax, enFile);
    }
    const ctx = contexte(b, s);
    s.occupe++;
    s.n++; s.cout += nb(p._cout, 0); R.cout += nb(p._cout, 0);

    /* Un puits n'émet rien : sans ça, il n'afficherait jamais ce qu'il reçoit. */
    if (!portsDe(b.comp, b.params, "s").length){
      const v0 = Object.values(e)[0];
      if (v0 !== undefined){ s.dernier = v0; majV[b.id] = v0; }
    }

    /* Une anomalie reçue par un bloc qui ne sait pas la traiter n'est pas
       consommée : elle repart telle quelle. C'est la règle « une anomalie
       voyage » — sans elle, une division par une anomalie donnerait NaN et
       le pipeline mentirait sur son résultat. */
    const recue = Object.values(e).find(estAnomalie);
    const sorties = portsDe(b.comp, b.params, "s");
    if (recue && !c.mangeAnomalie){
      const port = (c.portAnomalie && sorties.includes(c.portAnomalie))
                 ? c.portAnomalie : sorties[sorties.length - 1];
      s.nAno++;
      if (port === undefined){
        jrn("err", b.id, `${b.nom} · anomalie reçue, aucun port pour la transmettre — elle s'arrête ici`);
        planifie(R.temps, "fin", { bloc: b.id, sorties: {}, tDebut: R.temps });
      } else {
        jrn("warn", b.id, `${b.nom} · anomalie transmise sans traitement → « ${port} »`);
        planifie(R.temps, "fin", { bloc: b.id, sorties: { [port]: recue }, tDebut: R.temps });
      }
      return;
    }

    /* Panne aléatoire universelle : n'importe quel bloc peut casser. */
    const tauxPanne = Math.max(0, Math.min(100, nb(p._panne, 0)));
    if (tauxPanne > 0 && rng() < tauxPanne / 100){
      const port = sorties[sorties.length - 1];
      jrn("err", b.id, `${b.nom} · panne aléatoire (${tauxPanne} %)`);
      const a = anomalie(`panne du bloc « ${b.nom} »`);
      planifie(R.temps, "fin",
        { bloc: b.id, sorties: port === undefined ? {} : { [port]: a }, tDebut: R.temps });
      return;
    }

    /* Durée de traitement : propre au comportement, ou paramètre général. */
    let lat = 0;
    try {
      lat = c.latence ? c.latence(p, ctx) : nb(p._lat, c.lat || 0);
      const g = nb(p._gigue, 0);
      if (g) lat = Math.max(0, lat * (1 + (rng() * 2 - 1) * g / 100));
    } catch(err){ lat = nb(p._lat, c.lat || 0); }

    let res = {};
    try {
      res = c.fn(p, e, ctx) || {};
    } catch(err){
      const port = sorties[sorties.length - 1];
      jrn("err", b.id, `${b.nom} · ${err.message}`);
      res = port === undefined ? {} : { [port]: anomalie(err.message) };
    }
    planifie(R.temps + lat, "fin", { bloc: b.id, sorties: res, tDebut: R.temps });
  }

  /* ── fin de traitement : les valeurs partent sur les fils ────────────── */
  function termine(ev){
    const b = indexBloc[ev.bloc], s = E[ev.bloc];
    if (!b || !s) return [];
    s.occupe = Math.max(0, s.occupe - 1);
    s.tOccupe += R.temps - ev.tDebut;
    R.taches.push({ bloc: b.id, t0: ev.tDebut, t1: R.temps });

    const c = compDe(b.comp), sorties = portsDe(b.comp, b.params, "s");
    const vols = [];
    Object.keys(ev.sorties || {}).forEach(port => {
      if (port === "_encore") return;
      const v = ev.sorties[port];
      if (v === undefined || v === null) return;
      const i = sorties.indexOf(port);
      if (i < 0){
        jrn("err", b.id, `${b.nom} · port de sortie inconnu : « ${port} » — valeur perdue : ${aff(v)}`);
        return;
      }
      const ano = estAnomalie(v);
      if (ano){ R.nAnomalies++; s.nAno++; }
      R.nJetons++;
      s.dernier = v; majV[b.id] = v;
      jrn(ano ? "err" : "ok", b.id, `${b.nom} → ${port} : ${aff(v)}`);

      const sortants = M.liens.filter(l => l.de.b === b.id && indicePort(b, "s", l.de) === i);
      if (!sortants.length){
        const cle = port;
        s.sansSuite[cle] = (s.sansSuite[cle] || 0) + 1;
        if (s.sansSuite[cle] <= 2)
          jrn("warn", b.id, `${b.nom} · le port « ${port} » n'est relié à rien — ${aff(v)} s'arrête là`);
        R.perdus++;
        return;
      }
      sortants.forEach(l => {
        const cible = indexBloc[l.vers.b];
        if (!cible){
          jrn("err", b.id, `${b.nom} · le fil partant de « ${port} » vise un bloc absent du montage — ${aff(v)} est perdue`);
          R.perdus++; return;
        }
        if (!E[cible.id]){
          jrn("err", b.id, `${b.nom} · « ${cible.nom} » ne sait rien faire (comportement inconnu) — ${aff(v)} s'arrête là`);
          R.perdus++; return;
        }
        const pe = portsDe(cible.comp, cible.params, "e")[indicePort(cible, "e", l.vers)];
        if (pe === undefined){
          jrn("err", b.id, `${b.nom} · le port d'entrée visé n'existe plus sur « ${cible.nom} » — ${aff(v)} est perdue`);
          R.perdus++; return;
        }
        R.liens[l.id].n++; R.liens[l.id].dernier = v; majL[l.id] = v;
        vols.push({ lien: l.id, val: v });
        planifie(R.temps, "arrive", { bloc: cible.id, port: pe, v });
      });
    });

    if (typeof (ev.sorties || {})._encore === "number"){
      if (R.nJetons < lim.jetons)
        planifie(R.temps + Math.max(0, ev.sorties._encore), "amorce", { bloc: b.id });
      else if (!R.arret){
        /* Couper un générateur sans le dire ferait passer une exécution tronquée
           pour une exécution terminée. */
        R.arret = "limite de valeurs atteinte";
        jrn("err", b.id, `⛔ ${lim.jetons} valeurs émises — « ${b.nom} » est arrêté net. Le résultat est tronqué.`);
      }
    }

    tenter(b);
    return vols;
  }

  /* ── amorçage ────────────────────────────────────────────────────────── */
  const sources = M.blocs.filter(b => E[b.id] && !portsDe(b.comp, b.params, "e").length);
  if (!sources.length){
    jrn("err", null, "Aucune source : ajoute un bloc qui n'a pas d'entrée (Source, Générateur, Jeu de données) pour amorcer le flux.");
    R.arret = "aucune source";
    R.puits = {}; R.duree = 0;
    return R;
  }
  jrn("acc", null, `▶ ${M.blocs.length} bloc(s) · ${sources.length} source(s) · graine ${R.graine}`);
  sources.forEach(b => planifie(0, "amorce", { bloc: b.id }));

  /* ── boucle principale ───────────────────────────────────────────────── */
  while (fe.taille){
    if (++R.nEvts > lim.evenements){
      R.arret = "limite d'événements atteinte";
      jrn("err", null, `⛔ ${lim.evenements} événements — le montage boucle probablement sans fin.`);
      break;
    }
    const ev = fe.tire();
    if (ev.t > lim.temps){
      R.arret = "limite de temps atteinte";
      jrn("err", null, `⛔ ${lim.temps} ms simulées — arrêt.`);
      break;
    }
    R.temps = ev.t;
    let vols = [];
    if (ev.k === "amorce"){
      const b = indexBloc[ev.bloc];
      if (b && E[b.id]) demarre(b, true);
    } else if (ev.k === "arrive"){
      const s = E[ev.bloc];
      if (s){
        (s.buf[ev.port] ??= []).push(ev.v);
        const enFile = Object.values(s.buf).reduce((a, q) => a + q.length, 0);
        s.fileMax = Math.max(s.fileMax, enFile);
        tenter(indexBloc[ev.bloc]);
      }
    } else if (ev.k === "fin"){
      vols = termine(ev);
    }
    image(ev, vols);
  }

  /* ── bilan ───────────────────────────────────────────────────────────── */
  R.duree = R.temps;
  R.puits = {};
  M.blocs.forEach(b => {
    const c = compDe(b.comp);
    if (c && c.puits && E[b.id]) R.puits[b.id] = (E[b.id].etat.recu || []).slice();
  });
  /* Deux façons pour une valeur de rester coincée : dans la file d'entrée d'un
     bloc, ou dans la mémoire du bloc lui-même (une fenêtre qui ne s'est jamais
     complétée). Les deux doivent se dire, sinon des valeurs disparaissent. */
  let restants = 0;
  M.blocs.forEach(b => {
    const s = E[b.id]; if (!s) return;
    const n = Object.values(s.buf).reduce((x, q) => x + q.length, 0);
    if (n){ restants += n; jrn("warn", b.id, `${b.nom} · ${n} valeur(s) encore en file d'attente`); }
    const c = compDe(b.comp);
    if (c && c.reste){
      const r = c.reste(s.etat, P(b));
      if (r){ restants += r.n; jrn("warn", b.id, `${b.nom} · ${r.txt}`); }
    }
  });
  R.restants = restants;
  if (restants) jrn("warn", null, `${restants} valeur(s) n'ont jamais atteint de puits.`);
  jrn("acc", null, `■ terminé à ${Math.round(R.temps)} ms · ${R.nJetons} valeur(s) · ${R.nAnomalies} anomalie(s)` +
                   (R.cout ? ` · coût ${Math.round(R.cout * 100) / 100}` : ""));
  M.blocs.forEach(b => {
    if (!E[b.id]) return;
    const c = compDe(b.comp);
    if (c && c.puits){
      const r = R.puits[b.id] || [];
      jrn(r.length ? "ok" : "gris", b.id, `  ${b.nom} : ${r.length ? r.map(aff).join(" · ") : "rien reçu"}`);
    }
  });
  return R;
}

/* ───────────────────────────────────────────────────────────────────────────
   §6 · SIMULATION RÉPÉTÉE
   Une exécution ne dit rien d'un montage qui contient du hasard. On rejoue
   N fois avec N graines et on regarde la forme de la distribution.
   ─────────────────────────────────────────────────────────────────────────── */

function quantile(tri, q){
  if (!tri.length) return 0;
  const i = (tri.length - 1) * q, b = Math.floor(i), r = i - b;
  return tri[b] + (tri[Math.min(tri.length - 1, b + 1)] - tri[b]) * r;
}

function resume(l){
  if (!l.length) return { n:0, moy:0, min:0, max:0, ecart:0, p50:0, p95:0 };
  const tri = l.slice().sort((a, b) => a - b);
  const moy = l.reduce((a, b) => a + b, 0) / l.length;
  const varc = l.reduce((a, b) => a + (b - moy) * (b - moy), 0) / l.length;
  return { n: l.length, moy, min: tri[0], max: tri[tri.length - 1],
           ecart: Math.sqrt(varc), p50: quantile(tri, .5), p95: quantile(tri, .95) };
}

function simuler(M, n, graineBase, surcharges){
  const N = Math.max(1, Math.min(2000, Math.floor(n)));
  const base = nb(graineBase, 1);
  const durees = [], couts = [], jetons = [], anomalies = [];
  const puits = {}, arrets = {};
  let assertOk = 0, assertTotal = 0;
  for (let i = 0; i < N; i++){
    const R = executer(M, { graine: base + i, trace: false, surcharges: surcharges || {} });
    durees.push(R.duree); couts.push(R.cout);
    jetons.push(R.nJetons); anomalies.push(R.nAnomalies);
    if (R.arret) arrets[R.arret] = (arrets[R.arret] || 0) + 1;
    Object.keys(R.puits || {}).forEach(id => {
      const p = (puits[id] ??= { n: [], anomalies: [], exemples: [] });
      const l = R.puits[id];
      p.n.push(l.length);
      p.anomalies.push(l.filter(estAnomalie).length);
      if (p.exemples.length < 6 && l.length) p.exemples.push(aff(l[l.length - 1]));
    });
    R.assertions.forEach(a => { assertTotal++; if (a.ok) assertOk++; });
  }
  const parPuits = {};
  Object.keys(puits).forEach(id => {
    parPuits[id] = { compte: resume(puits[id].n), anomalies: resume(puits[id].anomalies),
                     exemples: puits[id].exemples };
  });
  return { N, base, duree: resume(durees), cout: resume(couts), jetons: resume(jetons),
           anomalies: resume(anomalies), puits: parPuits, arrets,
           assertions: { ok: assertOk, total: assertTotal },
           brutes: { durees, couts, anomalies } };
}

/* ───────────────────────────────────────────────────────────────────────────
   §7 · SCÉNARIOS
   Un scénario fige des entrées et une graine, puis énonce ce qu'on attend.
   C'est le test unitaire du montage : on peut le rejouer après chaque
   modification et savoir tout de suite ce qu'on a cassé.
   ─────────────────────────────────────────────────────────────────────────── */

const SUJETS = {
  "recu":       { l:"Ce qu'un puits a reçu",        cible:true  },
  "compte":     { l:"Combien un puits a reçu",      cible:true  },
  "anomalies":  { l:"Nombre d'anomalies produites", cible:false },
  "jetons":     { l:"Nombre de valeurs émises",     cible:false },
  "duree":      { l:"Durée totale (ms)",            cible:false },
  "cout":       { l:"Coût total",                   cible:false },
  "assertions": { l:"Toutes les assertions passent", cible:false, booleen:true }
};
const OPS = ["=", "≠", "≥", "≤", "contient"];

function compare(op, obtenu, attendu){
  if (op === "contient") return String(obtenu).includes(String(attendu));
  const a = Number(String(attendu).replace(",", ".")), b = Number(obtenu);
  const numerique = Number.isFinite(a) && Number.isFinite(b);
  switch(op){
    case "=":  return numerique ? Math.abs(a - b) < 1e-9 : String(obtenu) === String(attendu);
    case "≠":  return numerique ? Math.abs(a - b) >= 1e-9 : String(obtenu) !== String(attendu);
    case "≥":  return numerique ? b >= a : String(obtenu) >= String(attendu);
    case "≤":  return numerique ? b <= a : String(obtenu) <= String(attendu);
  }
  return false;
}

function valeurSujet(R, at, M){
  switch(at.sujet){
    case "recu":   return (R.puits[at.cible] || []).map(aff).join(" · ");
    case "compte": return (R.puits[at.cible] || []).length;
    case "anomalies": return R.nAnomalies;
    case "jetons": return R.nJetons;
    case "duree":  return Math.round(R.duree);
    case "cout":   return Math.round(R.cout * 1000) / 1000;
    case "assertions": return R.assertions.length ? (R.assertions.every(a => a.ok) ? "oui" : "non") : "oui";
  }
  return anomalie("sujet d'attente inconnu : " + at.sujet);
}

function verifieScenario(M, sc){
  const R = executer(M, { graine: nb(sc.graine, 1), trace: false, surcharges: sc.surcharges || {} });
  const lignes = (sc.attentes || []).map(at => {
    const obtenu = valeurSujet(R, at, M);
    if (estAnomalie(obtenu))
      return { ok: false, texte: obtenu.v, attendu: at.valeur, obtenu: "—" };
    const nomCible = at.cible ? (M.blocs.find(b => b.id === at.cible) || {}).nom || at.cible : "";
    const ok = compare(at.op, obtenu, at.valeur);
    return { ok, attendu: at.valeur, obtenu: String(obtenu),
             texte: `${(SUJETS[at.sujet] || {}).l || at.sujet}${nomCible ? ` — ${nomCible}` : ""} ${at.op} ${at.valeur}` };
  });
  const auto = R.assertions.map(a => ({
    ok: a.ok, texte: `assertion « ${a.nom} » sur ${a.nomBloc}`,
    attendu: "vraie", obtenu: a.err ? a.err : (a.ok ? "vraie" : `fausse sur ${a.valeur}`) }));
  const toutes = lignes.concat(auto);
  return { nom: sc.nom || "scénario", id: sc.id, ok: toutes.length > 0 && toutes.every(x => x.ok),
           vide: toutes.length === 0, lignes: toutes, R };
}

function verifieTous(M){
  const l = (M.scenarios || []).map(sc => verifieScenario(M, sc));
  return { total: l.length, reussis: l.filter(x => x.ok).length, resultats: l };
}

/* ───────────────────────────────────────────────────────────────────────────
   §8 · DIAGNOSTICS
   Ce qui se voit sans exécuter. Rien n'est corrigé d'office : on signale, on
   explique, et on laisse la main.
   ─────────────────────────────────────────────────────────────────────────── */

/* Quels paramètres contiennent du code, et sous quelle forme. */
const VERIFS = {
  fonction:   [{ k:"expr",   genre:"expr",   args:["x","aide"] }],
  script:     [{ k:"corps",  genre:"corps",  args:["x","etat","aide","hasard"] }],
  valider:    [{ k:"cond",   genre:"expr",   args:["x","aide"] }],
  aiguiller:  [{ k:"voies",  genre:"lignes", args:["x","aide"] }],
  filtrer:    [{ k:"garder", genre:"expr",   args:["x","aide"] }],
  accumuler:  [{ k:"expr",   genre:"expr",   args:["acc","x","aide"] }],
  assertion:  [{ k:"cond",   genre:"expr",   args:["x","aide"] }]
};

function verifieCode(b){
  const c = compDe(b.comp);
  const soucis = [];
  const p = Object.assign({}, defauts(b.comp), b.params || {});
  const liste = (c && c.forge) ? [{ k:"__corps", genre:"corps", args:[] }] : (VERIFS[b.comp] || []);
  liste.forEach(v => {
    const src = v.k === "__corps" ? (c.def.corps || "") : String(p[v.k] ?? "");
    try {
      if (v.genre === "expr") compileExpr(src, v.args);
      else if (v.genre === "corps") compileCorps(src, v.args.length ? v.args : ["e","p","ctx"]);
      else if (v.genre === "lignes")
        src.split("\n").map(s => s.trim()).filter(Boolean).forEach(l => compileExpr(l, v.args));
    } catch(err){ soucis.push({ k: v.k, msg: err.message }); }
  });
  return soucis;
}

function diagnostics(M){
  const d = [];
  const ajoute = (niveau, bloc, titre, detail) => d.push({ niveau, bloc, titre, detail });

  const sources = M.blocs.filter(b => compDe(b.comp) && !portsDe(b.comp, b.params, "e").length);
  if (M.blocs.length && !sources.length)
    ajoute("err", null, "Aucune source", "Rien n'amorce le flux. Ajoute une Source, un Générateur ou un Jeu de données.");

  M.blocs.forEach(b => {
    const c = compDe(b.comp);
    if (!c){ ajoute("err", b.id, `Comportement inconnu : ${b.comp}`,
                    "Ce bloc vient d'un montage qui utilisait un bloc forgé absent d'ici."); return; }
    const p = Object.assign({}, defauts(b.comp), b.params || {});

    verifieCode(b).forEach(s =>
      ajoute("err", b.id, `${b.nom} — code fautif`, `${s.k} : ${s.msg}`));

    portsDe(b.comp, b.params, "e").forEach((port, i) => {
      const relie = M.liens.some(l => l.vers.b === b.id && indicePort(b, "e", l.vers) === i);
      if (!relie) ajoute("warn", b.id, `${b.nom} — entrée « ${port} » sans fil`,
                         "Ce port ne recevra jamais rien ; le bloc ne se déclenchera pas de ce côté.");
    });
    portsDe(b.comp, b.params, "s").forEach((port, i) => {
      const relie = M.liens.some(l => l.de.b === b.id && indicePort(b, "s", l.de) === i);
      if (!relie) ajoute("info", b.id, `${b.nom} — sortie « ${port} » sans fil`,
                         "Ce que ce port produit s'arrêtera là. Volontaire ? Sinon, un Rebut évite de perdre la trace.");
    });
    if (nb(p._panne, 0) > 0)
      ajoute("info", b.id, `${b.nom} — panne aléatoire active (${p._panne} %)`,
             "Ce bloc casse au hasard. À ne pas oublier avant de conclure sur des mesures.");
    if (!M.liens.some(l => l.de.b === b.id || l.vers.b === b.id) && M.blocs.length > 1)
      ajoute("warn", b.id, `${b.nom} — bloc isolé`, "Aucun fil ne le relie au reste du montage.");
  });

  /* Un bloc forgé venu d'un fichier peut déclarer des noms de port impossibles.
     Ils sont écartés à la compilation ; sans ce diagnostic, le bloc paraîtrait
     simplement avoir moins de ports qu'annoncé. */
  (M.forges || []).forEach(def => {
    const c = compDe(def.id);
    if (!c || !c.rejetes || !c.rejetes.length) return;
    ajoute("err", (M.blocs.find(b => b.comp === def.id) || {}).id || null,
      `${def.nom || def.id} — noms impossibles écartés`,
      `« ${c.rejetes.join(" », « ")} » : un nom de port ou de réglage doit commencer par une lettre et ` +
      `ne contenir ni espace ni signe. Ces ports n'existent pas dans le bloc, et les fils qui les visaient sont perdus.`);
  });

  /* Un fil dont une extrémité a disparu ne se voit pas sur le canevas : il n'est
     pas dessiné. Sans ce diagnostic, il serait parfaitement invisible — et il
     avalerait des valeurs à chaque exécution. */
  M.liens.forEach(l => {
    const bd = M.blocs.find(x => x.id === l.de.b), bv = M.blocs.find(x => x.id === l.vers.b);
    if (!bd && !bv){ ajoute("err", null, "Fil orphelin", "Ses deux extrémités ont disparu du montage."); return; }
    if (!bd){ ajoute("err", bv.id, `${bv.nom} — fil venant d'un bloc absent`,
      "Le bloc d'origine n'existe plus. Ce fil ne peut rien apporter."); return; }
    if (!bv){ ajoute("err", bd.id, `${bd.nom} — fil vers un bloc absent`,
      "Le bloc visé n'existe plus : tout ce qui part par ce fil est perdu à l'exécution."); return; }
    const listeS = portsDe(bd.comp, bd.params, "s"), listeE = portsDe(bv.comp, bv.params, "e");
    const ps = listeS[indicePort(bd, "s", l.de)], pe = listeE[indicePort(bv, "e", l.vers)];
    if (ps === undefined) ajoute("err", bd.id, `${bd.nom} — port de sortie disparu`,
      `Un fil part d'un port qui n'existe plus, et rien ne le remplace. Il visait « ${bv.nom} ».`);
    if (pe === undefined) ajoute("err", bv.id, `${bv.nom} — port d'entrée disparu`,
      `Un fil arrive sur un port qui n'existe plus. Depuis « ${bd.nom} ».`);
    /* Changer le nombre de voies d'un bloc peut faire disparaître le port d'où
       partait un fil. On le rattache par position pour ne pas casser le montage —
       mais un fil qui change de sens sans le dire ferait mentir le schéma. */
    if (l.de.p !== undefined && ps !== undefined && ps !== l.de.p && !listeS.includes(l.de.p))
      ajoute("warn", bd.id, `${bd.nom} — un fil a changé de port`,
        `Il partait de « ${l.de.p} », qui n'existe plus. Il est maintenant rattaché à « ${ps} », vers « ${bv.nom} ». Rebranche-le si ce n'est pas ce que tu veux.`);
    if (l.vers.p !== undefined && pe !== undefined && pe !== l.vers.p && !listeE.includes(l.vers.p))
      ajoute("warn", bv.id, `${bv.nom} — un fil a changé de port`,
        `Il arrivait sur « ${l.vers.p} », qui n'existe plus. Il aboutit maintenant sur « ${pe} », depuis « ${bd.nom} ».`);
  });

  /* Une anomalie qui arrive sur un bloc incapable de la traiter est transmise
     telle quelle. Ce n'est pas une faute — mais mieux vaut l'avoir voulu. */
  const T = typesStatiques(M);
  M.liens.forEach(l => {
    const bd = M.blocs.find(x => x.id === l.de.b), bv = M.blocs.find(x => x.id === l.vers.b);
    if (!bd || !bv) return;
    const cv = compDe(bv.comp); if (!cv) return;
    const ps = portsDe(bd.comp, bd.params, "s")[indicePort(bd, "s", l.de)];
    if (ps === undefined) return;
    if (T.sortie[bd.id + "|" + ps] === "anomalie" && !cv.mangeAnomalie){
      const sorties = portsDe(bv.comp, bv.params, "s");
      const port = (cv.portAnomalie && sorties.includes(cv.portAnomalie)) ? cv.portAnomalie : sorties[sorties.length - 1];
      ajoute("info", bv.id, `${bv.nom} — reçoit une anomalie qu'il ne traite pas`,
        port ? `Elle repartira telle quelle par « ${port} », sans passer par la fonction du bloc.`
             : "Aucun port de sortie pour la transmettre : elle s'arrêtera ici.");
    }
  });

  cycles(M).forEach(c => {
    const noms = c.map(id => (M.blocs.find(b => b.id === id) || {}).nom || id);
    ajoute("info", c[0], "Boucle dans le montage", noms.join(" → ") +
      ` · autorisé, mais l'exécution s'arrête d'office après ${LIMITES.evenements} événements.`);
  });

  /* Blocs jamais atteignables depuis une source. */
  const atteints = new Set(sources.map(b => b.id));
  let bouge = true, garde = M.blocs.length + 2;
  while (bouge && garde-- > 0){
    bouge = false;
    M.liens.forEach(l => { if (atteints.has(l.de.b) && !atteints.has(l.vers.b)){ atteints.add(l.vers.b); bouge = true; } });
  }
  M.blocs.forEach(b => {
    if (!atteints.has(b.id) && compDe(b.comp))
      ajoute("warn", b.id, `${b.nom} — hors d'atteinte`, "Aucun chemin ne mène ici depuis une source.");
  });

  const ordre = { err: 0, warn: 1, info: 2 };
  return d.sort((a, b) => ordre[a.niveau] - ordre[b.niveau]);
}

/* ───────────────────────────────────────────────────────────────────────────
   §9 · ENGENDREMENT DE CODE
   Le montage sort d'ici sous forme de programme. La version JavaScript n'est
   pas une approximation : elle embarque le moteur et les fonctions que
   l'atelier vient d'exécuter, mot pour mot, obtenus par `Function.toString`.
   Ce qui tourne dans la page et ce qui tourne dans le fichier sont le même
   code — il ne peut donc pas y avoir de dérive entre les deux.
   ─────────────────────────────────────────────────────────────────────────── */

/** Source d'une fonction, ramenée à une forme utilisable dans un objet. */
function srcFn(cle, f){
  const s = f.toString().trim();
  if (/^[A-Za-zÀ-ÖØ-öø-ÿ_$][\wÀ-ÖØ-öø-ÿ$]*\s*\(/.test(s) && !/^function\b/.test(s)
      && !/^(async|new)\b/.test(s)){
    return JSON.stringify(cle) + ": function " + s.slice(s.indexOf("("));
  }
  return JSON.stringify(cle) + ": " + s;
}

/** Sérialise une valeur quelconque en source JavaScript (fonctions comprises). */
function srcVal(v, cle){
  if (typeof v === "function") return srcFn(cle, v);
  if (v === undefined) return JSON.stringify(cle) + ": undefined";
  if (Array.isArray(v)) return JSON.stringify(cle) + ": [" + v.map((x, i) => srcVal(x, String(i)).replace(/^"[^"]*":\s*/, "")).join(", ") + "]";
  if (v !== null && typeof v === "object")
    return JSON.stringify(cle) + ": {" + Object.keys(v).map(k => srcVal(v[k], k)).join(", ") + "}";
  return JSON.stringify(cle) + ": " + JSON.stringify(v);
}

function srcObjet(o){
  return "{\n" + Object.keys(o).map(k => "  " + srcVal(o[k], k)).join(",\n") + "\n}";
}

/** Le noyau, reconstruit à partir de lui-même. */
function sourceNoyau(){
  const bouts = [];
  bouts.push(`const TYPES = ${JSON.stringify(TYPES)};`);
  bouts.push(`const TYPES_SIMPLES = ${JSON.stringify(TYPES_SIMPLES)};`);
  bouts.push(`const NOM_PORT = ${NOM_PORT.toString()};`);
  bouts.push(`const LIMITES = ${JSON.stringify(LIMITES)};`);
  bouts.push(`const CACHE_MAX = ${CACHE_MAX};`);
  bouts.push(`const _cacheExpr = new Map();`);
  bouts.push(`const _cacheCorps = new Map();`);
  bouts.push(`const FORGES = new Map();`);
  [alea, aleaNormal, nb, anomalie, typeBrut, typeDe, val, convertir, affBrut, aff,
   compileExpr, compileCorps, evalue, portsDe, attendTout, paramsDe, defauts,
   compileForge, chargeForges, compDe, indicePort, executer]
    .forEach(f => bouts.push(f.toString()));
  bouts.push(`const estAnomalie = ${estAnomalie.toString()};`);
  bouts.push(`const brut = ${brut.toString()};`);
  bouts.push(Tas.toString());
  bouts.push(`const AIDE = {\n${Object.keys(AIDE).map(k => "  " + srcVal(AIDE[k], k)).join(",\n")}\n};`);
  bouts.push(`const PARAMS_AVANCES = ${JSON.stringify(PARAMS_AVANCES)};`);
  bouts.push(`const COMP = ${srcObjet(COMP)};`);
  return bouts.join("\n\n");
}

function engendreJS(M, opts){
  const o = Object.assign({ graine: 1 }, opts || {});
  const montage = { version: VERSION_FORMAT, titre: M.titre || "Montage",
                    blocs: M.blocs, liens: M.liens, forges: M.forges || [] };
  return `#!/usr/bin/env node
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   « ${(M.titre || "Montage").replace(/\*\//g, "*∕")} »
   Engendré par l'Atelier de blocs.

   Ce fichier n'est pas une esquisse : il contient le moteur d'exécution et les
   fonctions de chaque comportement, repris tels quels de l'atelier. Lance-le :

       node ce-fichier.js            exécute le montage avec la graine ${o.graine}
       node ce-fichier.js 7          … avec la graine 7

   Il s'importe aussi : module.exports = { MONTAGE, executer, COMP }.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── noyau ─────────────────────────────────────────────────────────────── */
${sourceNoyau()}

/* ── le montage ────────────────────────────────────────────────────────── */
const MONTAGE = ${JSON.stringify(montage, null, 2)};

/* ── exécution ─────────────────────────────────────────────────────────── */
function principal(graine){
  const R = executer(MONTAGE, { graine: graine, trace: false });
  R.jrn.forEach(l => console.log(String(Math.round(l.t)).padStart(7) + " ms  " + l.txt));
  console.log("");
  console.log("── bilan ──");
  console.log("durée simulée : " + Math.round(R.duree) + " ms");
  console.log("valeurs émises : " + R.nJetons + "   anomalies : " + R.nAnomalies +
              (R.cout ? "   coût : " + (Math.round(R.cout * 100) / 100) : ""));
  Object.keys(R.puits).forEach(id => {
    const b = MONTAGE.blocs.find(x => x.id === id);
    console.log("  " + (b ? b.nom : id) + " : " +
      (R.puits[id].length ? R.puits[id].map(aff).join(" · ") : "rien reçu"));
  });
  return R;
}

if (typeof module !== "undefined" && require.main === module){
  principal(Number(process.argv[2] || ${o.graine}));
}
if (typeof module !== "undefined") module.exports = { MONTAGE, executer, COMP, principal };
`;
}

/* ── Python ──────────────────────────────────────────────────────────────
   La traduction Python est fidèle au flux mais pas au chronomètre : elle
   déroule le montage sans horloge simulée. Les expressions écrites par
   l'utilisateur restent du JavaScript ; un traducteur restreint les rend
   évaluables (opérateurs, ternaire, Math, String, Number). Ce qui sort de ce
   périmètre lève une erreur explicite — jamais un résultat inventé.
   ────────────────────────────────────────────────────────────────────────── */

const RUNTIME_PY = String.raw`import json, math, random, re, sys

# ── valeurs ────────────────────────────────────────────────────────────────
def val(x, t=None):
    if isinstance(x, dict) and "t" in x and "v" in x: return x
    return {"t": t or type_brut(x), "v": x}

def ano(motif, cause=None):
    return {"t": "anomalie", "v": str(motif), "cause": cause}

def type_brut(x):
    if isinstance(x, bool): return "booleen"
    if isinstance(x, (int, float)): return "nombre"
    if isinstance(x, list): return "liste"
    if isinstance(x, dict): return "objet"
    return "texte"

def brut(v):
    return None if v is None else v["v"]

def aff(v):
    if v is None: return "—"
    if v["t"] == "anomalie": return "⚠ " + str(v["v"])
    return aff_brut(v["v"])

def aff_brut(x):
    if x is None: return "—"
    if isinstance(x, bool): return "vrai" if x else "faux"
    if isinstance(x, float): return str(int(x)) if x == int(x) else str(round(x, 3))
    if isinstance(x, int): return str(x)
    if isinstance(x, list): return "[" + ", ".join(aff_brut(i) for i in x) + "]"
    if isinstance(x, dict): return json.dumps(x, ensure_ascii=False)
    return str(x)

def _f(x, d=0.0):
    try: return float(x)
    except (TypeError, ValueError): return d

def _num(s):
    s = str(s).strip()
    try: return float(s) if ("." in s or "e" in s.lower()) else int(s)
    except ValueError: return s

def conv(x, t):
    b = x["v"] if isinstance(x, dict) and "v" in x else x
    if t == "nombre":
        if isinstance(b, bool): return val(1 if b else 0, "nombre")
        try: return val(_num(str(b).replace(",", ".")) * 1.0, "nombre")
        except ValueError: return ano("« %s » n'est pas un nombre" % aff_brut(b), b)
    if t == "booleen":
        if isinstance(b, bool): return val(b, "booleen")
        s = str(b).strip().lower()
        if s in ("true", "vrai", "oui", "1"): return val(True, "booleen")
        if s in ("false", "faux", "non", "0", ""): return val(False, "booleen")
        return ano("« %s » n'est ni vrai ni faux" % aff_brut(b), b)
    if t == "texte": return val(str(b), "texte")
    if t == "liste": return val(b if isinstance(b, list) else [b], "liste")
    if t == "objet":
        if isinstance(b, dict): return val(b, "objet")
        return ano("« %s » n'est pas un objet" % aff_brut(b), b)
    return ano("type de conversion inconnu : %s" % t)

def gabarit(g, x):
    def rem(m):
        champ = m.group(1)
        if champ: return aff_brut(x.get(champ) if isinstance(x, dict) else None)
        return aff_brut(x)
    return re.sub(r"\{x(?:\.([A-Za-z_][A-Za-z0-9_]*))?\}", rem, str(g))

# ── traduction restreinte des expressions JavaScript ───────────────────────
# Couvert : opérateurs de comparaison et logiques, ternaire, littéraux,
# Math.*, String(), Number(), .length, accès aux champs. Le reste lève.
class _Math:
    round = staticmethod(lambda x, n=0: round(float(x), int(n)))
    floor = staticmethod(lambda x: math.floor(float(x)))
    ceil  = staticmethod(lambda x: math.ceil(float(x)))
    abs   = staticmethod(lambda x: abs(float(x)))
    sqrt  = staticmethod(lambda x: math.sqrt(float(x)))
    pow   = staticmethod(lambda a, b: float(a) ** float(b))
    log   = staticmethod(lambda x: math.log(float(x)))
    min   = staticmethod(lambda *a: min(float(x) for x in a))
    max   = staticmethod(lambda *a: max(float(x) for x in a))
    PI    = math.pi
    E     = math.e

def _ternaire(src):
    """Transforme A ? B : C en (B) if (A) else (C), imbrications comprises."""
    prof = 0; guillemet = None
    for i, ch in enumerate(src):
        if guillemet:
            if ch == guillemet: guillemet = None
            continue
        if ch in "\"'": guillemet = ch; continue
        if ch in "([{": prof += 1
        elif ch in ")]}": prof -= 1
        elif ch == "?" and prof == 0:
            reste = src[i+1:]; p2 = 0; q2 = None; niveau = 0
            for j, c2 in enumerate(reste):
                if q2:
                    if c2 == q2: q2 = None
                    continue
                if c2 in "\"'": q2 = c2; continue
                if c2 in "([{": p2 += 1
                elif c2 in ")]}": p2 -= 1
                elif c2 == "?" and p2 == 0: niveau += 1
                elif c2 == ":" and p2 == 0:
                    if niveau: niveau -= 1; continue
                    return "((%s) if (%s) else (%s))" % (
                        _ternaire(reste[:j]), _ternaire(src[:i]), _ternaire(reste[j+1:]))
            break
    return src

_REMPL = [(r"===", "=="), (r"!==", "!="), (r"&&", " and "), (r"\|\|", " or "),
          (r"\btrue\b", "True"), (r"\bfalse\b", "False"),
          (r"\bnull\b", "None"), (r"\bundefined\b", "None"),
          (r"\bString\(", "str("), (r"\bNumber\(", "_f("),
          (r"\.length\b", "_len"), (r"!(?![=])", " not ")]

def js_py(src):
    out = _ternaire(str(src))
    for motif, rem in _REMPL:
        out = re.sub(motif, rem, out)
    return out.replace("_len", ".__len__()")

def js_eval(src, variables):
    """Évalue une expression écrite en JavaScript. Échoue bruyamment."""
    py = js_py(src)
    env = {"Math": _Math, "math": math, "str": str, "_f": _f, "len": len,
           "abs": abs, "min": min, "max": max, "round": round, "aide": _Aide}
    env.update(variables)
    try:
        return eval(py, {"__builtins__": {}}, env)
    except Exception as err:
        raise RuntimeError("expression non traduisible « %s » → %s : %s" % (src, py, err))

class _Aide:
    somme   = staticmethod(lambda l: sum(_f(x) for x in (l or [])))
    moyenne = staticmethod(lambda l: (sum(_f(x) for x in l) / len(l)) if l else 0)
    min     = staticmethod(lambda l: min(l or [0]))
    max     = staticmethod(lambda l: max(l or [0]))
    arrondi = staticmethod(lambda x, n=0: round(_f(x), int(n)))
    borne   = staticmethod(lambda x, a, b: min(b, max(a, x)))
    pourcent= staticmethod(lambda x, n=1: ("%." + str(n) + "f %%") % (x * 100))

def js_corps(src, variables):
    raise RuntimeError("bloc Script / bloc forgé : corps JavaScript non traduit en Python "
                       "(« %s »). Réécris-le en Python ou garde ce bloc dans l'atelier." % src[:40])

# ── contexte ───────────────────────────────────────────────────────────────
class Ctx:
    def __init__(self, rng, journal, assertions):
        self._rng = rng; self.temps = 0.0
        self.journal = journal; self._assertions = assertions
    def hasard(self): return self._rng.random()
    def normal(self, moy, ecart): return self._rng.gauss(moy, ecart)
    def note(self, txt): self.journal.append(("gris", txt))
    def assertion(self, nom, ok, valeur):
        self._assertions.append({"nom": nom, "ok": ok, "valeur": valeur})
`;

function engendrePython(M){
  const blocs = M.blocs.filter(b => compDe(b.comp));
  const inconnus = M.blocs.filter(b => !compDe(b.comp));
  const forges = blocs.filter(b => (compDe(b.comp) || {}).forge);

  const defs = blocs.map(b => {
    const c = compDe(b.comp);
    const corps = c.py ? c.py(Object.assign({}, defaults_(b))) : `raise RuntimeError("comportement sans traduction : ${b.comp}")`;
    const indente = String(corps).split("\n").map(l => "    " + l).join("\n");
    return `def bloc_${b.id}(e, p, s, ctx):\n    """${(b.nom || "").replace(/"/g, "'")} — ${c.nom}"""\n${indente}`;
  }).join("\n\n");

  function defaults_(b){ return Object.assign({}, defauts(b.comp), b.params || {}); }

  const graphe = {
    blocs: blocs.map(b => ({
      id: b.id, nom: b.nom, comp: b.comp,
      entrees: portsDe(b.comp, b.params, "e"),
      sorties: portsDe(b.comp, b.params, "s"),
      params: defaults_(b),
      attendTout: attendTout(compDe(b.comp), defaults_(b)),
      mangeAnomalie: !!compDe(b.comp).mangeAnomalie,
      portAnomalie: compDe(b.comp).portAnomalie || null,
      puits: !!compDe(b.comp).puits
    })),
    liens: M.liens.filter(l => blocs.some(b => b.id === l.de.b) && blocs.some(b => b.id === l.vers.b))
      .map(l => {
        const bd = M.blocs.find(x => x.id === l.de.b), bv = M.blocs.find(x => x.id === l.vers.b);
        return { de: l.de.b, port: portsDe(bd.comp, bd.params, "s")[indicePort(bd, "s", l.de)],
                 vers: l.vers.b, entree: portsDe(bv.comp, bv.params, "e")[indicePort(bv, "e", l.vers)] };
      }).filter(l => l.port !== undefined && l.entree !== undefined)
  };

  return `#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""« ${(M.titre || "Montage").replace(/"/g, "'")} » — engendré par l'Atelier de blocs.

Traduction fidèle du FLUX : mêmes blocs, mêmes ports, mêmes règles de
propagation des anomalies. Ce qui ne traverse pas la frontière :
  · l'horloge simulée (latences, files d'attente, débit) reste dans l'atelier ;
  · les blocs Script et les blocs forgés gardent un corps JavaScript et lèvent
    une erreur explicite ici — à réécrire en Python si tu en as besoin.
${inconnus.length ? "  · " + inconnus.length + " bloc(s) au comportement inconnu ont été omis.\n" : ""}
    python3 ce-fichier.py           exécute avec la graine 1
    python3 ce-fichier.py 7         … avec la graine 7
"""
${RUNTIME_PY}

# ── un bloc, une fonction ──────────────────────────────────────────────────
${defs || "# (aucun bloc)"}

FONCTIONS = {${blocs.map(b => `"${b.id}": bloc_${b.id}`).join(", ")}}

GRAPHE = ${JSON.stringify(graphe, null, 2).replace(/\btrue\b/g, "True").replace(/\bfalse\b/g, "False").replace(/\bnull\b/g, "None")}

# ── moteur de flux ─────────────────────────────────────────────────────────
def executer(graine=1):
    rng = random.Random(graine)
    journal, assertions = [], []
    ctx = Ctx(rng, journal, assertions)
    etats = {b["id"]: {} for b in GRAPHE["blocs"]}
    tampons = {b["id"]: {p: [] for p in b["entrees"]} for b in GRAPHE["blocs"]}
    puits = {b["id"]: [] for b in GRAPHE["blocs"] if b["puits"]}
    index = {b["id"]: b for b in GRAPHE["blocs"]}
    n_anomalies = [0]

    file = [(b["id"], None) for b in GRAPHE["blocs"] if not b["entrees"]]
    garde = 0

    def envoie(bid, port, v):
        cibles = [l for l in GRAPHE["liens"] if l["de"] == bid and l["port"] == port]
        if not cibles:
            journal.append(("warn", "%s · le port « %s » n'est relié à rien — %s s'arrête là"
                            % (index[bid]["nom"], port, aff(v))))
        for l in cibles:
            tampons[l["vers"]][l["entree"]].append(v)
            file.append((l["vers"], None))

    while file and garde < 20000:
        garde += 1
        bid, _ = file.pop(0)
        b = index[bid]
        e = {}
        if b["entrees"]:
            if b["attendTout"]:
                if not all(tampons[bid][p] for p in b["entrees"]): continue
                for p in b["entrees"]: e[p] = tampons[bid][p].pop(0)
            else:
                dispo = [p for p in b["entrees"] if tampons[bid][p]]
                if not dispo: continue
                e[dispo[0]] = tampons[bid][dispo[0]].pop(0)

        recue = next((v for v in e.values() if v and v["t"] == "anomalie"), None)
        if recue is not None and not b["mangeAnomalie"]:
            port = b["portAnomalie"] if b["portAnomalie"] in b["sorties"] else (b["sorties"][-1] if b["sorties"] else None)
            journal.append(("warn", "%s · anomalie transmise sans traitement → « %s »" % (b["nom"], port)))
            if port: envoie(bid, port, recue)
            continue

        taux = _f(b["params"].get("_panne", 0))
        if taux > 0 and rng.random() < taux / 100:
            journal.append(("err", "%s · panne aléatoire (%s %%)" % (b["nom"], taux)))
            if b["sorties"]:
                n_anomalies[0] += 1
                envoie(bid, b["sorties"][-1], ano("panne du bloc « %s »" % b["nom"]))
            continue

        try:
            res = FONCTIONS[bid](e, b["params"], etats[bid], ctx) or {}
        except Exception as err:
            journal.append(("err", "%s · %s" % (b["nom"], err)))
            res = {b["sorties"][-1]: ano(str(err))} if b["sorties"] else {}

        encore = res.pop("_encore", None)
        for port, v in res.items():
            if v is None: continue
            if port not in b["sorties"]:
                journal.append(("err", "%s · port de sortie inconnu : « %s »" % (b["nom"], port)))
                continue
            if v["t"] == "anomalie": n_anomalies[0] += 1
            journal.append(("err" if v["t"] == "anomalie" else "ok",
                            "%s → %s : %s" % (b["nom"], port, aff(v))))
            envoie(bid, port, v)
        if b["puits"]:
            puits[bid] = etats[bid].get("recu", [])
        if encore is not None:
            file.append((bid, None))

    return {"journal": journal, "puits": puits, "assertions": assertions,
            "anomalies": n_anomalies[0]}


if __name__ == "__main__":
    R = executer(int(sys.argv[1]) if len(sys.argv) > 1 else 1)
    for cls, txt in R["journal"]:
        print(("!! " if cls == "err" else "   ") + txt)
    print("")
    print("── bilan ──")
    print("anomalies : %d" % R["anomalies"])
    for bid, recu in R["puits"].items():
        nom = next((b["nom"] for b in GRAPHE["blocs"] if b["id"] == bid), bid)
        print("  %s : %s" % (nom, " · ".join(aff(v) for v in recu) if recu else "rien reçu"))
    for a in R["assertions"]:
        print("  assertion « %s » : %s (%s)" % (a["nom"], "vraie" if a["ok"] else "FAUSSE", a["valeur"]))
`;
}

  return {
    titre: M.titre || "Montage de l'atelier",
    sousTitre: `${M.blocs.length} blocs · ${M.liens.length} liens`,
    couches: cats.map((nom, i) => ({ id: "L" + (i + 1), nom })),
    blocs: M.blocs.map(b => {
      const c = compDe(b.comp) || { cat: "?", nom: b.comp, aide: "" };
      return { id: b.id, code: b.id.toUpperCase(), nom: b.nom,
        couche: "L" + (cats.indexOf(c.cat) + 1), vague: rang[b.id] || 1, etat: "ok",
        etiquette: c.nom, fichier: "",
        fiche: { recoit: portsDe(b.comp, b.params, "e").map(p => `port « ${p} »`),

                 refuse: [c.aide], manque: "—" } };

      if (!bd || !bv) return null;
      const a = rang[bd.id] || 1, z = rang[bv.id] || 1;

              z > a ? "f" : (z === a ? "v" : "b")];
    }).filter(Boolean)
  };
}

/** Export Mermaid — pour coller dans une page ou un dépôt. */
function engendreMermaid(M){
  const id = s => "n" + String(s).replace(/[^A-Za-z0-9]/g, "");
  const l = ["flowchart LR"];
  const parCat = {};
  M.blocs.forEach(b => { const c = compDe(b.comp) || { cat: "?" }; (parCat[c.cat] ??= []).push(b); });
  Object.keys(parCat).forEach((cat, i) => {
    l.push(`  subgraph S${i}["${cat}"]`);
    parCat[cat].forEach(b => {
      const c = compDe(b.comp) || { nom: b.comp };
      l.push(`    ${id(b.id)}["${b.nom.replace(/"/g, "'")}<br/><small>${c.nom}</small>"]`);
    });
    l.push("  end");
  });
  M.liens.forEach(x => {
    const bd = M.blocs.find(b => b.id === x.de.b), bv = M.blocs.find(b => b.id === x.vers.b);
    if (!bd || !bv) return;
    const port = portsDe(bd.comp, bd.params, "s")[indicePort(bd, "s", x.de)] || "";
    l.push(`  ${id(bd.id)} -->|${port}| ${id(bv.id)}`);
  });
  return l.join("\n");
}

/** Petit constructeur : blocs par tableaux, liens par (index, port). */
function monte(titre, blocs, liens, zones, scenarios){
  const M = montageVide();
  M.titre = titre;
  let n = 0;
  const ids = blocs.map(([comp, nom, x, y, params]) => {
    const b = { id: "b" + (++n), comp, nom, x, y,
                params: Object.assign(defauts(comp), params || {}) };
    M.blocs.push(b);
    return b;
  });
  liens.forEach(([i, ps, j, pe]) => {
    const bd = ids[i], bv = ids[j];
    const is = portsDe(bd.comp, bd.params, "s").indexOf(ps);
    const ie = portsDe(bv.comp, bv.params, "e").indexOf(pe);
    M.liens.push({ id: "l" + (++n), de: { b: bd.id, i: is, p: ps }, vers: { b: bv.id, i: ie, p: pe } });
  });
  (zones || []).forEach(([nom, x, y, w, h, teinte]) =>
    M.zones.push({ id: "z" + (++n), nom, x, y, w, h, teinte: teinte || 0 }));
  (scenarios || []).forEach((sc, i) => M.scenarios.push(Object.assign({ id: "s" + (i + 1) }, sc)));
  M.seq = n;
  return M;
}
