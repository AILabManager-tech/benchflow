<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier de blocs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
/* ═══════════════════════════════════════════════════════════════════
   ATELIER DE BLOCS — feuille de style
   Palette sobre, deux thèmes complets, aucune dépendance.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --ground:#EDEFF2; --surface:#FFFFFF; --surface-2:#F6F8FA; --surface-3:#E4E8ED;
  --ink:#10161D; --ink-2:#3D4A57; --ink-3:#6B7986;
  --line:#D2D9E0; --line-2:#BCC6D0; --grid:#DDE2E8; --grid-fort:#CFD7DF;
  --accent:#0E7C86; --accent-soft:#D6EDEF; --accent-ink:#095A62;
  --ok:#2E7D5B; --ok-soft:#DCEFE5;
  --warn:#B07A12; --warn-soft:#F7EBD2;
  --crit:#B33A34; --crit-soft:#F7E0DE;
  --abst:#5A6B7D; --abst-soft:#E3E8ED;
  --nombre:#4E6FA8; --texte:#7355A0; --booleen:#8A6D3B; --anomalie:#B33A34;
  --liste:#2F7F70; --objet:#9A5B2E; --quelconque:#6B7986;
  --shadow:0 1px 2px rgba(16,22,29,.06),0 4px 12px rgba(16,22,29,.05);
  --shadow-fort:0 2px 6px rgba(16,22,29,.10),0 16px 40px rgba(16,22,29,.14);
  --voile:rgba(16,22,29,.34);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0B1117; --surface:#131B23; --surface-2:#18222B; --surface-3:#22303B;
  --ink:#E4E9EE; --ink-2:#A9B6C2; --ink-3:#7A8996;
  --line:#25323D; --line-2:#33434F; --grid:#18222B; --grid-fort:#1E2A34;
  --accent:#35C6D4; --accent-soft:#0E3A40; --accent-ink:#7FDDE7;
  --ok:#4BB183; --ok-soft:#12332A; --warn:#D8A33F; --warn-soft:#3A2F14;
  --crit:#E0645C; --crit-soft:#3B1E1C; --abst:#8497A8; --abst-soft:#1D2833;
  --nombre:#7FA0DC; --texte:#A98CD8; --booleen:#C4A465; --anomalie:#E0645C;
  --liste:#5FBFAA; --objet:#D2915C; --quelconque:#7A8996;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --shadow-fort:0 2px 8px rgba(0,0,0,.5),0 18px 44px rgba(0,0,0,.5);
  --voile:rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --ground:#0B1117; --surface:#131B23; --surface-2:#18222B; --surface-3:#22303B;
  --ink:#E4E9EE; --ink-2:#A9B6C2; --ink-3:#7A8996;
  --line:#25323D; --line-2:#33434F; --grid:#18222B; --grid-fort:#1E2A34;
  --accent:#35C6D4; --accent-soft:#0E3A40; --accent-ink:#7FDDE7;
  --ok:#4BB183; --ok-soft:#12332A; --warn:#D8A33F; --warn-soft:#3A2F14;
  --crit:#E0645C; --crit-soft:#3B1E1C; --abst:#8497A8; --abst-soft:#1D2833;
  --nombre:#7FA0DC; --texte:#A98CD8; --booleen:#C4A465; --anomalie:#E0645C;
  --liste:#5FBFAA; --objet:#D2915C; --quelconque:#7A8996;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --shadow-fort:0 2px 8px rgba(0,0,0,.5),0 18px 44px rgba(0,0,0,.5);
  --voile:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--ground); color:var(--ink); overflow:hidden;
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif; font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased}
h1{margin:0; font-size:15px; font-weight:600; letter-spacing:-.012em; white-space:nowrap}
button,select,input,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:0; padding:0}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:6px; border:3px solid var(--surface)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.lbl{font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.vide{color:var(--ink-3); font-size:12px; line-height:1.55}
.sp{flex:1}

/* ── boutons ─────────────────────────────────────────────── */
.btn{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:6px;
  border:1px solid var(--line-2); background:var(--surface-2); font-size:12.5px; font-weight:600;
  white-space:nowrap; transition:border-color .12s,background .12s,color .12s}
.btn:hover:not(:disabled){border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.1); color:#fff; background:var(--accent)}
.btn.plat{border-color:transparent; background:transparent}
.btn.plat:hover:not(:disabled){background:var(--surface-2); border-color:var(--line)}
.btn:disabled{opacity:.4; cursor:default}
.btn.sm{padding:3.5px 8px; font-size:11.5px}
.btn.danger:hover:not(:disabled){border-color:var(--crit); color:var(--crit); background:var(--crit-soft)}
.btn.bascule{border-color:transparent; background:transparent; color:var(--ink-3); font-weight:600}
.btn.bascule:hover:not(.active){background:var(--surface-3); color:var(--ink-2); border-color:transparent}
.btn.bascule.active{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent)}
.k{font-family:"IBM Plex Mono",monospace; font-size:10px; padding:1px 4px; border-radius:3px;
  background:var(--surface-3); color:var(--ink-3); border:1px solid var(--line); font-weight:600}

/* ── charpente ───────────────────────────────────────────── */
.app{display:grid; grid-template-rows:auto 1fr; height:100%}
.bar{display:flex; align-items:center; gap:7px; padding:8px 12px; background:var(--surface);
  border-bottom:1px solid var(--line); z-index:20; box-shadow:0 1px 0 rgba(0,0,0,.02)}
.bar .sep{width:1px; height:20px; background:var(--line); margin:0 3px}
.marque{display:flex; align-items:center; gap:8px; padding-right:4px}
.marque .logo{width:22px; height:22px; border-radius:5px; background:var(--accent);
  display:grid; place-items:center; color:#fff; font-weight:700; font-size:12px;
  font-family:"IBM Plex Mono",monospace}
.etat-doc{font-size:11px; color:var(--ink-3); font-family:"IBM Plex Mono",monospace; white-space:nowrap}

.main{display:grid; grid-template-columns:236px minmax(0,1fr) 336px;
  grid-template-rows:minmax(0,1fr) auto auto; overflow:hidden; min-height:0}
.col-g{grid-column:1; grid-row:1/4; background:var(--surface); border-right:1px solid var(--line);
  overflow:hidden; display:flex; flex-direction:column; min-height:0}
.col-d{grid-column:3; grid-row:1/4; background:var(--surface); border-left:1px solid var(--line);
  overflow:hidden; display:flex; flex-direction:column; min-height:0}
.zone-canevas{grid-column:2; grid-row:1; position:relative; overflow:hidden; min-height:0}
.tiroir{grid-column:2; grid-row:3; border-top:1px solid var(--line); background:var(--surface);
  display:flex; flex-direction:column; min-height:0; overflow:hidden}
.tiroir.replie{height:33px !important}
.tiroir.replie .tiroir-corps{display:none}

/* ── onglets ─────────────────────────────────────────────── */
.ongl{display:flex; gap:0; border-bottom:1px solid var(--line); background:var(--surface-2);
  flex:none; overflow-x:auto; scrollbar-width:none}
.ongl::-webkit-scrollbar{display:none}
.ongl button{padding:8px 12px; font-size:11.5px; font-weight:600; color:var(--ink-3);
  border-bottom:2px solid transparent; white-space:nowrap; display:flex; align-items:center; gap:5px}
.ongl button:hover{color:var(--ink-2); background:var(--surface-3)}
.ongl button.on{color:var(--accent-ink); border-bottom-color:var(--accent); background:var(--surface)}
.pastille-n{min-width:16px; height:16px; padding:0 4px; border-radius:8px; font-size:9.5px;
  display:inline-grid; place-items:center; background:var(--line-2); color:var(--surface);
  font-family:"IBM Plex Mono",monospace; font-weight:700}
.pastille-n.crit{background:var(--crit); color:#fff}
.pastille-n.warn{background:var(--warn); color:#fff}
.pastille-n.ok{background:var(--ok); color:#fff}
.vue{display:none; overflow-y:auto; padding:12px; flex:1; min-height:0}
.vue.on{display:block}
.vue.plein{padding:0; overflow:hidden}
.vue.plein.on{display:flex; flex-direction:column}
.vue.plein > .jrn,.vue.plein > .chrono,.vue.plein > .code-plein{flex:1; min-height:0}

/* ── palette de blocs ────────────────────────────────────── */
.rech{position:relative; padding:9px; border-bottom:1px solid var(--line); flex:none}
.rech input{width:100%; padding:6px 9px 6px 26px; border-radius:6px; border:1px solid var(--line-2);
  background:var(--surface-2); font-size:12.5px}
.rech svg{position:absolute; left:17px; top:50%; transform:translateY(-50%); opacity:.45; pointer-events:none}
.pal{overflow-y:auto; flex:1; padding:9px; min-height:0}
.pal-groupe{font-size:10px; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-3); margin:10px 0 5px; padding-left:2px; display:flex; align-items:center; gap:6px}
.pal-groupe:first-child{margin-top:0}
.pal-groupe::after{content:""; flex:1; height:1px; background:var(--line)}
.pal button.item{display:grid; grid-template-columns:22px 1fr; gap:9px; align-items:start; width:100%;
  text-align:left; padding:6px 8px; border-radius:6px; border:1px solid transparent;
  background:transparent; font-size:12.5px; font-weight:600; margin-bottom:1px}
.pal button.item:hover{border-color:var(--line-2); background:var(--surface-2)}
.pal button.item[draggable="true"]{cursor:grab}
.pal .ic{width:22px; height:22px; border-radius:5px; display:grid; place-items:center;
  font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:700; color:#fff; flex:none}
.pal small{display:block; font-size:10.5px; color:var(--ink-3); font-weight:400; line-height:1.35; margin-top:1px}

/* ── canevas ─────────────────────────────────────────────── */
.wrap{position:absolute; inset:0; overflow:hidden; cursor:grab;
  background:
    linear-gradient(var(--grid-fort) 1px,transparent 1px) 0 0/120px 120px,
    linear-gradient(90deg,var(--grid-fort) 1px,transparent 1px) 0 0/120px 120px,
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px,
    var(--ground)}
.wrap.grabbing{cursor:grabbing}
.wrap.linking{cursor:crosshair}
.wrap.cadrant{cursor:crosshair}
#scene{position:absolute; inset:0; transform-origin:0 0}
#fils{position:absolute; left:-4000px; top:-3000px; width:14000px; height:10000px;
  overflow:visible; pointer-events:none}
#fils > g{transform:translate(4000px,3000px)}

.fil{fill:none; stroke:var(--ink-3); stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round}
.fil.passe{stroke:var(--accent); opacity:.55}
.fil.sel{stroke:var(--crit); stroke-width:3.4}
.fil.mise{stroke:var(--accent); stroke-width:3}
.fil.zone{stroke:transparent; stroke-width:16; pointer-events:stroke; cursor:pointer}
.fil.fantome{stroke:var(--accent); stroke-dasharray:6 5; opacity:.9}
.tete{fill:var(--ink-3)} .tete.passe{fill:var(--accent); opacity:.55} .tete.mise{fill:var(--accent)}
.etiq-fil{font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:600; fill:var(--ink-3);
  paint-order:stroke; stroke:var(--ground); stroke-width:4px; stroke-linejoin:round}
.jeton-vol{paint-order:stroke; stroke:var(--ground); stroke-width:3.5px; stroke-linejoin:round}
.jeton-txt{font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:700;
  paint-order:stroke; stroke:var(--ground); stroke-width:4px; stroke-linejoin:round}

.bloc{position:absolute; width:184px; background:var(--surface); border:1.5px solid var(--line-2);
  border-left-width:5px; border-radius:6px; box-shadow:var(--shadow); padding:7px 9px 8px;
  cursor:move; user-select:none; transition:box-shadow .12s}
.bloc.sel{border-color:var(--accent); box-shadow:var(--shadow),0 0 0 2.5px var(--accent-soft)}
.bloc.court{box-shadow:var(--shadow),0 0 0 3px var(--accent-soft)}
.bloc.enpanne{border-color:var(--crit)}
.bloc.attente{opacity:.98; border-style:dashed}
.bloc .tt{display:flex; align-items:center; gap:5px; min-height:13px}
.bloc .cmp{font-family:"IBM Plex Mono",monospace; font-size:8.5px; font-weight:700;
  letter-spacing:.07em; text-transform:uppercase}
.bloc .nm{font-size:12.5px; font-weight:600; margin-top:1px; line-height:1.25;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bloc .val{font-family:"IBM Plex Mono",monospace; font-size:10.5px; margin-top:5px;
  background:var(--surface-2); border-radius:3px; padding:2px 6px; min-height:17px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-2)}
.bloc .pastille{margin-left:auto; width:8px; height:8px; border-radius:50%; background:var(--line-2); flex:none}
.bloc.court .pastille{background:none; border:2px solid var(--accent-soft);
  border-top-color:var(--accent); animation:tourne .62s linear infinite}
.bloc .file-n{position:absolute; top:-8px; right:-8px; min-width:18px; height:18px; padding:0 5px;
  border-radius:9px; background:var(--warn); color:#fff; font-size:10px; font-weight:700;
  font-family:"IBM Plex Mono",monospace; display:grid; place-items:center; box-shadow:var(--shadow)}
.bloc .ruban{position:absolute; left:-5px; right:-1.5px; bottom:-1.5px; height:2.5px;
  border-radius:0 0 5px 5px; background:var(--accent); transform-origin:left; }
.bloc .spark{margin-top:4px; height:20px; display:block; width:100%}
@keyframes tourne{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bloc.court .pastille{animation:none;background:var(--accent);border:0}}

.port{position:absolute; width:12px; height:12px; border-radius:50%; background:var(--surface);
  border:2.5px solid var(--line-2); cursor:crosshair; z-index:3; transition:transform .1s}
.port:hover,.port.cible{border-color:var(--accent); background:var(--accent-soft); transform:scale(1.35)}
.port.lie{background:var(--line-2)}
.port.e{left:-7.5px} .port.s{right:-7.5px}
.port .etq{position:absolute; font-size:9px; font-family:"IBM Plex Mono",monospace;
  color:var(--ink-3); white-space:nowrap; top:-2px; pointer-events:none; font-weight:600}
.port.s .etq{left:16px} .port.e .etq{right:16px}
#scene.muet .port .etq{display:none}

.zone-s{position:absolute; border:1.5px solid; border-radius:10px; z-index:0; cursor:move}
.zone-s.sel{outline:2px solid var(--accent); outline-offset:2px}
.zone-s > .ti{position:absolute; top:-10px; left:12px; background:var(--ground); padding:1px 8px;
  border-radius:3px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  white-space:nowrap; user-select:none}
.zone-s > .poi{position:absolute; right:-6px; bottom:-6px; width:14px; height:14px; border-radius:3px;
  background:var(--surface); border:2px solid currentColor; cursor:nwse-resize}
.bloc{z-index:2}
.cadre-sel{position:absolute; border:1.5px dashed var(--accent); background:var(--accent-soft);
  opacity:.45; z-index:9; pointer-events:none; border-radius:3px}

/* ── flottants du canevas ────────────────────────────────── */
.flot{position:absolute; z-index:12; background:var(--surface); border:1px solid var(--line);
  border-radius:9px; box-shadow:var(--shadow-fort)}
.transport{left:50%; transform:translateX(-50%); bottom:14px; display:flex; align-items:center;
  gap:8px; padding:7px 11px}
.transport .rond{width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
  border:1px solid var(--line-2); background:var(--surface-2)}
.transport .rond:hover:not(:disabled){border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink)}
.transport .rond.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.transport .rond.primary:hover{filter:brightness(1.1)}
.transport .rond:disabled{opacity:.35; cursor:default}
.transport .horloge{font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:600;
  min-width:74px; text-align:right; color:var(--ink-2)}
.transport input[type=range]{width:118px; accent-color:var(--accent)}
.transport .mini{font-size:10px; color:var(--ink-3); font-weight:600}
.minicarte{right:14px; bottom:14px; width:186px; height:124px; overflow:hidden; padding:0}
.minicarte canvas{display:block; width:100%; height:100%; cursor:pointer}
.zoombar{right:14px; top:14px; display:flex; flex-direction:column; padding:3px}
.zoombar button{width:28px; height:26px; display:grid; place-items:center; border-radius:5px;
  font-size:13px; font-weight:600; color:var(--ink-2)}
.zoombar button:hover{background:var(--surface-2); color:var(--accent-ink)}
.astuce{left:14px; top:14px; padding:6px 10px; font-size:11px; color:var(--ink-2); max-width:290px;
  pointer-events:none}   /* purement informatif : ne doit jamais voler un clic */
.astuce b{color:var(--ink)}

/* ── inspecteur / formulaires ────────────────────────────── */
.champ{margin-bottom:10px}
.champ label{display:flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
  color:var(--ink-3); margin-bottom:3px}
.champ input,.champ select,.champ textarea{width:100%; padding:5.5px 8px; border-radius:5px;
  border:1px solid var(--line-2); background:var(--surface-2); font-size:12.5px}
.champ input:focus,.champ select:focus,.champ textarea:focus{border-color:var(--accent); outline:none;
  box-shadow:0 0 0 2.5px var(--accent-soft)}
.champ textarea{font-family:"IBM Plex Mono",monospace; font-size:11.5px; resize:vertical; min-height:54px;
  line-height:1.5; tab-size:2}
.champ textarea.err{border-color:var(--crit); box-shadow:0 0 0 2.5px var(--crit-soft)}
.champ .aide{font-size:10.5px; color:var(--ink-3); margin-top:3px; line-height:1.45}
.champ .aide code{background:var(--surface-3); padding:0 3px; border-radius:2px;
  font-family:"IBM Plex Mono",monospace; font-size:10px}
.champ .msg-err{font-size:10.5px; color:var(--crit); margin-top:3px; font-family:"IBM Plex Mono",monospace}
.grille2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.rang{display:flex; gap:6px}
.rang .btn{flex:1; justify-content:center}
.enttete{display:flex; align-items:center; gap:7px; padding:9px 11px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:7px; margin-bottom:11px}
.enttete .ic{width:26px; height:26px; border-radius:6px; display:grid; place-items:center; color:#fff;
  font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:12px; flex:none}
.enttete .t{font-weight:600; font-size:13px; line-height:1.2}
.enttete .s{font-size:10.5px; color:var(--ink-3)}
.repli{border:1px solid var(--line); border-radius:7px; margin-bottom:11px; overflow:hidden}
.repli > summary{padding:7px 10px; font-size:11px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-3); cursor:pointer; background:var(--surface-2);
  user-select:none; list-style:none; display:flex; align-items:center; gap:6px}
.repli > summary::-webkit-details-marker{display:none}
.repli > summary::before{content:"▸"; font-size:9px; transition:transform .14s}
.repli[open] > summary::before{transform:rotate(90deg)}
.repli .dedans{padding:10px 10px 2px}
.h2{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 8px; display:flex; align-items:center; gap:6px}
.h2:not(:first-child){margin-top:16px}

/* ── journal & listes ────────────────────────────────────── */
.jrn{font-family:"IBM Plex Mono",monospace; font-size:11px; line-height:1.62; padding:8px 11px;
  height:100%; overflow-y:auto; background:var(--surface)}
.jrn div{white-space:pre-wrap; word-break:break-word; padding:.5px 0}
.jrn .ok{color:var(--ok)} .jrn .err{color:var(--crit)} .jrn .acc{color:var(--accent-ink)}
.jrn .gris{color:var(--ink-3)} .jrn .warn{color:var(--warn)}
.jrn .t{color:var(--ink-3); opacity:.75}
.jrn mark{background:var(--warn-soft); color:inherit; border-radius:2px}

.carte{border:1px solid var(--line); border-radius:7px; padding:9px 10px; margin-bottom:7px;
  background:var(--surface-2)}
.carte.ok{border-left:3px solid var(--ok)}
.carte.err{border-left:3px solid var(--crit)}

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   ATELIER DE BLOCS
   Un bac à sable pour concevoir un pipeline, puis le faire tourner pour de
   vrai : des valeurs typées circulent de bloc en bloc, chaque bloc applique
   une fonction, le temps s'écoule, les files se remplissent, les pannes
   arrivent. On regarde, on remonte le temps, on mesure, on recommence.

   Trois principes tenus partout dans ce fichier :
     · Aucun repli silencieux — un mode inconnu, une expression fautive ou une
       capacité absente produit une ANOMALIE qui voyage sur un fil, jamais un
       résultat par défaut qui ferait croire que tout va bien.
     · Rien n'est masqué — toute valeur qui passe est affichable, toute
       décision est journalisée avec son horodatage simulé.
     · Aucune dépendance — un seul fichier, ouvrable hors ligne, pour toujours.

   Le code est découpé en deux moitiés. Le NOYAU (types, catalogue, moteur,
   scénarios, engendrement de code, auto-tests) ne touche jamais au DOM : il
   tourne tel quel sous Node, ce qui permet de le vérifier hors du navigateur
   (voir verifier.mjs). L'INTERFACE vient après.
   ═══════════════════════════════════════════════════════════════════════════ */

/* @noyau:debut */

/* ───────────────────────────────────────────────────────────────────────────
   §0 · OUTILS
   ─────────────────────────────────────────────────────────────────────────── */

/** Générateur pseudo-aléatoire déterministe (mulberry32).
 *  Même graine ⇒ même exécution, sans exception. C'est ce qui rend une
 *  simulation reproductible et un scénario vérifiable. */
function alea(graine){
  let a = (graine >>> 0) || 1;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Tirage normal (Box-Muller), utile aux générateurs de mesures. */
function aleaNormal(rng, moy, ecart){
  const u = Math.max(1e-12, rng()), v = rng();
  return moy + ecart * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/** Nombre tolérant : accepte "12", 12, " 3.5 ". Renvoie `def` si illisible. */
function nb(x, def){
  if (x === "" || x === null || x === undefined) return def;
  const n = Number(String(x).trim().replace(",", "."));
  return Number.isFinite(n) ? n : def;
}

/** Tas binaire minimal — l'ordonnanceur y range les événements à venir.
 *  Comparaison (temps, rang d'insertion) : à temps égal, premier arrivé,
 *  premier servi. C'est ce qui rend l'ordre des événements déterministe. */
class Tas {
  constructor(){ this.a = []; }
  get taille(){ return this.a.length; }
  avant(x, y){ return x.t !== y.t ? x.t < y.t : x.ord < y.ord; }
  pousse(e){
    const a = this.a; a.push(e);
    let i = a.length - 1;
    while (i > 0){
      const p = (i - 1) >> 1;
      if (this.avant(a[i], a[p])){ [a[i], a[p]] = [a[p], a[i]]; i = p; } else break;
    }
  }
  tire(){
    const a = this.a; if (!a.length) return null;
    const t = a[0], d = a.pop();
    if (a.length){
      a[0] = d; let i = 0;
      for(;;){
        const g = 2*i + 1, dr = 2*i + 2; let m = i;
        if (g < a.length && this.avant(a[g], a[m])) m = g;
        if (dr < a.length && this.avant(a[dr], a[m])) m = dr;
        if (m === i) break;
        [a[i], a[m]] = [a[m], a[i]]; i = m;
      }
    }
    return t;
  }
}

/* ───────────────────────────────────────────────────────────────────────────
   §1 · VALEURS ET TYPES
   Une valeur qui circule est toujours { t: type, v: contenu }. Le type
   « anomalie » n'est pas une exception : c'est une valeur comme les autres,
   qui se transporte, se branche et se répare.
   ─────────────────────────────────────────────────────────────────────────── */

const TYPES = ["nombre","texte","booleen","liste","objet","anomalie"];
const TYPES_SIMPLES = ["nombre","texte","booleen"];

const ANO = Symbol.for("atelier.anomalie");

/** Fabrique une anomalie. Elle porte un motif lisible et, si on le lui donne,
 *  la valeur fautive — pour qu'on sache toujours ce qui a été refusé. */
function anomalie(motif, cause){
  return { t:"anomalie", v: String(motif), cause: cause === undefined ? null : cause };
}
const estAnomalie = v => !!v && v.t === "anomalie";

/** Devine le type d'une valeur brute JavaScript. */
function typeBrut(x){
  if (Array.isArray(x)) return "liste";
  if (typeof x === "number") return Number.isFinite(x) ? "nombre" : "texte";
  if (typeof x === "boolean") return "booleen";
  if (x !== null && typeof x === "object") return "objet";
  return "texte";
}

/** Type effectif d'une valeur qui circule. */
function typeDe(v){
  if (v === undefined || v === null) return "quelconque";
  if (v.t && v.t !== "auto") return v.t;
  return typeBrut(v.v);
}

/** Enveloppe une valeur brute. `t` vaut "auto" quand on laisse deviner. */
function val(x, t){
  if (x !== null && typeof x === "object" && "t" in x && "v" in x) return x;  // déjà enveloppée
  return { t: t || typeBrut(x), v: x };
}

/** Conversion explicite vers un type. Échouer produit une anomalie, jamais un
 *  zéro silencieux : c'est toute la différence entre « je n'ai pas compris »
 *  et « la réponse est 0 ». */
function convertir(x, t){
  const brut = (x !== null && typeof x === "object" && "v" in x) ? x.v : x;
  if (t === "nombre"){
    if (typeof brut === "boolean") return val(brut ? 1 : 0, "nombre");
    const n = Number(String(brut).trim().replace(",", "."));
    return Number.isFinite(n) ? val(n, "nombre")
                              : anomalie(`« ${affBrut(brut)} » n'est pas un nombre`, brut);
  }
  if (t === "booleen"){
    if (typeof brut === "boolean") return val(brut, "booleen");
    const s = String(brut).trim().toLowerCase();
    if (["true","vrai","oui","1"].includes(s))  return val(true, "booleen");
    if (["false","faux","non","0",""].includes(s)) return val(false, "booleen");
    return anomalie(`« ${affBrut(brut)} » n'est ni vrai ni faux`, brut);
  }
  if (t === "texte") return val(String(brut), "texte");
  if (t === "liste") return Array.isArray(brut) ? val(brut, "liste") : val([brut], "liste");
  if (t === "objet"){
    if (brut !== null && typeof brut === "object" && !Array.isArray(brut)) return val(brut, "objet");
    return anomalie(`« ${affBrut(brut)} » n'est pas un objet`, brut);
  }
  return anomalie(`type de conversion inconnu : ${t}`);
}

/** Affichage court d'une valeur brute. */
function affBrut(x){
  if (x === undefined || x === null) return "—";
  if (typeof x === "number") return Number.isInteger(x) ? String(x) : String(Math.round(x * 1000) / 1000);
  if (typeof x === "boolean") return x ? "vrai" : "faux";
  if (Array.isArray(x)) return "[" + x.map(affBrut).join(", ") + "]";
  if (typeof x === "object"){
    try { return JSON.stringify(x); } catch(e){ return "{objet}"; }
  }
  return String(x);
}

/** Affichage d'une valeur qui circule (anomalie comprise). */
function aff(v){
  if (v === undefined || v === null) return "—";
  if (estAnomalie(v)) return "⚠ " + v.v;
  return affBrut(v.v);
}

/** Valeur brute d'une valeur qui circule, pour la donner aux expressions. */
const brut = v => (v === undefined || v === null) ? undefined : v.v;

/** Compile une expression utilisateur une seule fois et met en cache.
 *  Une expression fautive lève : l'appelant en fera une anomalie. */
const CACHE_MAX = 400;
const _cacheExpr = new Map();
function compileExpr(src, args){
  const cle = args.join(",") + "|" + src;
  /* Chaque frappe dans un champ d'expression fabrique une clé de plus. Sans
     borne, une longue séance accumulerait des milliers de fonctions compilées. */
  if (_cacheExpr.size > CACHE_MAX && !_cacheExpr.has(cle)) _cacheExpr.clear();
  if (_cacheExpr.has(cle)) {
    const c = _cacheExpr.get(cle);
    if (c.err) throw c.err;
    return c.f;
  }
  try {
    const f = new Function(...args, `"use strict"; return (${src});`);
    _cacheExpr.set(cle, { f });
    return f;
  } catch(err){
    const e = new Error("expression illisible : " + err.message);
    _cacheExpr.set(cle, { err: e });
    throw e;
  }
}

/** Compile un corps de fonction (plusieurs lignes, avec `return`). */
const _cacheCorps = new Map();
function compileCorps(src, args){
  const cle = args.join(",") + "|#|" + src;
  if (_cacheCorps.size > CACHE_MAX && !_cacheCorps.has(cle)) _cacheCorps.clear();
  if (_cacheCorps.has(cle)) {
    const c = _cacheCorps.get(cle);
    if (c.err) throw c.err;
    return c.f;
  }
  try {
    const f = new Function(...args, `"use strict";\n${src}`);
    _cacheCorps.set(cle, { f });
    return f;
  } catch(err){
    const e = new Error("code illisible : " + err.message);
    _cacheCorps.set(cle, { err: e });
    throw e;
  }
}

/** Évalue une expression sur la valeur reçue. `x` est la valeur brute. */
function evalue(src, entree, extra){
  const noms = ["x","aide", ...Object.keys(extra || {})];
  const f = compileExpr(src, noms);
  return f(brut(entree), AIDE, ...Object.values(extra || {}));
}

/** Boîte à outils offerte aux expressions de l'utilisateur — sous le nom
 *  `aide`. Rien d'obligatoire, mais ça évite de réécrire les mêmes formules. */
const AIDE = {
  somme: l => (l || []).reduce((s, x) => s + Number(x || 0), 0),
  moyenne: l => (l && l.length) ? AIDE.somme(l) / l.length : 0,
  min: l => Math.min(...(l || [0])),
  max: l => Math.max(...(l || [0])),
  arrondi: (x, n) => { const k = Math.pow(10, n || 0); return Math.round(x * k) / k; },
  borne: (x, a, b) => Math.min(b, Math.max(a, x)),
  sansAccent: s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, ""),
  motsCles: s => String(s).toLowerCase().split(/[^a-zà-ÿ0-9]+/).filter(Boolean),
  argent: x => new Intl.NumberFormat("fr-CA", { style:"currency", currency:"CAD" }).format(x),
  pourcent: (x, n) => (x * 100).toFixed(n === undefined ? 1 : n) + " %"
};
